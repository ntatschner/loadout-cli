        var gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.value = hz;
        gain.gain.setValueAtTime(0.0001, now + i * 0.14);
        gain.gain.exponentialRampToValueAtTime(0.09, now + i * 0.14 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.14 + 0.13);

        osc.connect(gain).connect(ctx.destination);
        osc.start(now + i * 0.14);
        osc.stop(now + i * 0.14 + 0.14);
      });

      setTimeout(function () { try { ctx.close(); } catch (e) { /* fine */ } }, 600);
    } catch (e) {
      // A browser that will not make a sound is not a reason to stop.
    }
  }

  function tell(items) {
    var fresh = items.filter(function (item) { return !told[keyOf(item)]; });

    // Rebuilt from what is true now, so a reason that has cleared is
    // forgotten and will be told again if it comes back.
    var next = {};
    items.forEach(function (item) { next[keyOf(item)] = true; });
    told = next;

    if (fresh.length === 0) { return; }

    if (document.getElementById("sound").checked) { chime(); }

    if (!("Notification" in window) || Notification.permission !== "granted") { return; }

    fresh.forEach(function (item) {
      try {
        var note = new Notification(item.run.team + " needs you", {
          body: item.reason.detail,

          // One notification per run and reason: a browser replaces a
          // notification carrying a tag it already has, so a page left open
          // for hours does not stack forty of them.
          tag: keyOf(item),
        });

        note.addEventListener("click", function () {
          window.focus();
          watch(item.run);
          note.close();
        });
      } catch (e) {
        // Some browsers refuse the constructor outside a service worker.
      }
    });
  }

  // Everything wanting somebody, across every run, newest first. Rebuilt on
  // every read: nothing here is remembered, so a reason that has gone is gone.
  /*
    What this machine has run before, offered as suggestions rather than as a
    list to choose from. Whether a team exists is the command line's question,
    and asking it here as well is how two answers start to disagree - but a
    name somebody typed last week is still the name they want today.
  */
  function suggest(runs) {
    [["known-teams", "team"], ["known-projects", "project"]].forEach(function (pair) {
      var list = document.getElementById(pair[0]);
      var seen = {};
      var names = [];

      runs.forEach(function (run) {
        var name = run[pair[1]];

        if (name && !seen[name]) {
          seen[name] = true;
          names.push(name);
        }
      });

      if (list.getAttribute("data-names") === names.join("|")) { return; }

      list.setAttribute("data-names", names.join("|"));
      list.textContent = "";

      names.forEach(function (name) {
        var option = document.createElement("option");

        option.value = name;
        list.appendChild(option);
      });
    });
  }

  (function () {
    var go = document.getElementById("start");

    go.addEventListener("click", function () {
      var team = document.getElementById("start-team").value.trim();
      var goal = document.getElementById("start-goal").value.trim();
      var project = document.getElementById("start-project").value.trim();
      var rounds = parseInt(document.getElementById("start-rounds").value, 10);
      var autonomy = document.getElementById("start-autonomy").value;

      if (!team || !goal) {
        announce("A run needs a team and something to do.");

        return;
      }

      // Named in the question. This one spends money and edits a repository,
      // and the token got somebody to the page rather than to this.
      if (!window.confirm("Start " + team + (project ? " on " + project : "")
        + " to \u201c" + goal + "\u201d?")) {
        return;
      }

      go.disabled = true;

      fetch("/api/start?token=" + encodeURIComponent(token), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          team: team,
          goal: goal,
          project: project || null,
          rounds: rounds > 0 ? rounds : null,
          autonomy: autonomy || null
        })
      })
        .then(function (answer) {
          return answer.text().then(function (body) {
            var said = null;

            try {
              said = JSON.parse(body).error;
            } catch (e) {
              said = null;
            }

            go.disabled = false;

            if (!answer.ok) {
              throw new Error(said || ("The dashboard answered " + answer.status + "."));
            }

            announce(team + " is starting. It appears in the list in a moment.");
            document.getElementById("start-goal").value = "";
          });
        })
        .catch(function (wrong) {
          go.disabled = false;
          announce(wrong.message);
        });
    });
  }());

  function drawRail(runs) {
    var rail = document.getElementById("rail");
    var list = document.getElementById("rail-list");
    var wanted = [];

    runs.forEach(function (run) {
      (run.attention || []).forEach(function (reason) {
        wanted.push({ run: run, reason: reason });
      });
    });

    list.textContent = "";
    rail.hidden = wanted.length === 0;

    wanted.forEach(function (item) {
      var li = document.createElement("li");

      var which = document.createElement("span");
      which.className = "which";
      which.textContent = nameOf(item.run) + " · " + properly(item.run.team) + " — ";
      li.appendChild(which);

      li.appendChild(document.createTextNode(item.reason.detail + " "));

      var clears = document.createElement("span");
      clears.className = "clears";
      clears.textContent = "(clears when " + item.reason.clears + ")";
      li.appendChild(clears);

      // Straight to the run it is about. A line that tells you something is
      // wrong and leaves you to find it is half a line.
      var go = document.createElement("button");
      go.type = "button";
      go.textContent = "Open";
      go.addEventListener("click", function () { watch(item.run); });
      li.appendChild(document.createTextNode(" "));
      li.appendChild(go);

      list.appendChild(li);
    });

    mark(wanted.length);
    tell(wanted);

    return wanted.length;
  }

  // The tab itself says how many. Free, needs no permission, and it works
  // while the tab is buried behind thirty others - which is the case this is
  // for.
  var titled = "Loadout teams";

  function mark(count) {
    document.title = count > 0 ? "(" + count + ") " + titled : titled;

    var link = document.querySelector("link[rel='icon']");

    if (!link) {
      link = document.createElement("link");
      link.rel = "icon";
      document.head.appendChild(link);
    }

    /*
      Two addresses rather than one drawing.

      This used to draw the icon here and hand it over as a data: URI, on the
      grounds that the page then fetched nothing. The page's own content
      security policy says `img-src 'self'`, which forbids exactly that, so the
      icon was blocked on every load and this badge - whose whole point is a
      tab buried behind thirty others - never appeared once. The browser then
      asked for /favicon.ico, which answered 403, and that was the second error
      in the console.

      Two addresses rather than one carrying the count, because a browser holds
      on to a favicon hard: changing which address is asked for is what makes
      it fetch again.
    */
    var wanted = count > 0 ? "/icon-needs" : "/icon";

    if (link.getAttribute("href") !== wanted) { link.href = wanted; }
  }

  /*
    An identifier as a name. "role.project-lead" is a key; "Project lead" is
    what somebody calls it, and both are true of the same thing.

    Derived rather than looked up, because there is no table of display names
    anywhere and inventing one would be a second thing to keep in step with
    the roles that ship. A role's id and a team's name are both written as
    lower-case words with hyphens between them, which is a sentence with its
    capital missing.

    NOT called "titled": the page already has a variable of that name holding
    the document title, and a function declaration would quietly replace it.
  */
  function properly(id) {
    if (!id) { return ""; }

    var words = String(id).replace(/^role\./, "").replace(/[-_]+/g, " ").trim();

    return words ? words.charAt(0).toUpperCase() + words.slice(1) : "";
  }

  /*
    The reference, kept beside the name rather than instead of it.

    A run is 20260918-1436-ed59 to every command on the machine, and somebody
    reading the page is usually about to type it somewhere. Drawn quietly and
    in a monospace, because it is a string to copy and not a thing to read.
  */
  function reference(text, into) {
    var code = document.createElement("code");
    code.className = "ident";
    code.textContent = text;

    if (into) { into.appendChild(code); }

    return code;
  }

  /*
    What to call a run: the room it was given, which is the whole reason it
    was given one. "The Good Kettle" is a thing somebody says a week later;
    20260918-1436-ed59 is not.
  */
  function nameOf(run) {
    return (run && run.room) || (run && run.id) || "";
  }

  /*
    What to call a node: the person, which points at exactly one node of
    exactly one run. Every office on the machine has an implementer/1 in it.
  */
  function who(node) {
    return (node && (node.personFull || node.person)) || (node && node.node) || "";
  }

  /*
    Which page this is. Written onto the opening tag by whatever served it,
    from the person's own accessibility profile, so it is true before the
    first paint and nothing has to redecorate itself afterwards.
  */
  function rich() {
    return document.documentElement.getAttribute("data-presentation") !== "plain";
  }

  /*
    A word with its punctuation in its own element.

    The plain page reads a node as one sentence and the rich one lines the
    same fields up in columns. Emitting the separators as elements is what
    lets one renderer do both: the rich page hides them, and neither page is
    a second implementation of the other.
  */
  function part(row, className, text, after) {
    var span = document.createElement("span");
    span.className = className;
    span.textContent = text;
    row.appendChild(span);

    if (after) {
      var sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = after;
      row.appendChild(sep);
    }

    return span;
  }

  /*
    A bar, as a fraction of something.

    Hidden from a screen reader on purpose: the number it draws is written out
    in words on the same line. Announcing it again would be reading the row
    twice, and a bar has no wording of its own that is not already there.
  */
  function drawn(className, fraction) {
    var bar = document.createElement("span");
    bar.className = "viz " + className;
    bar.setAttribute("aria-hidden", "true");

    var fill = document.createElement("span");
    fill.className = "fill";
    fill.style.width = Math.max(0, Math.min(1, fraction || 0)) * 100 + "%";
    bar.appendChild(fill);

    return bar;
  }

  /*
    The shape of the run: one column per round, as tall as that round was
    long, with the round still going marked.

    This is the thing a list cannot say and a number cannot either - that
    round three took four times round two - and every figure in it is already
    on the page as text.
  */
  function rounds(run) {
    var all = (run.numbers && run.numbers.rounds) || [];

    if (all.length === 0) { return null; }

    var longest = 1;

    all.forEach(function (one) {
      if (one.seconds > longest) { longest = one.seconds; }
    });

    var strip = document.createElement("span");
    strip.className = "viz strip";
    strip.setAttribute("aria-hidden", "true");

    all.forEach(function (one) {
      var column = document.createElement("span");
      column.className = "round" + (one.running ? " live" : "");

      // A floor, so a round that took two seconds is still a mark on the
      // page rather than a gap somebody reads as a missing round.
      column.style.height = Math.max(12, Math.round((one.seconds / longest) * 100)) + "%";
      column.title = "Round " + one.round + ": " + minutes(one.seconds);
      strip.appendChild(column);
    });

    return strip;
  }

  /*
    Where the money stands. Drawn only when the team set a cap, because a bar
    with no end is a bar that says nothing: without a budget the figure in the
    text is the whole of what is known.
  */
  function spend(run) {
    var money = run.numbers && run.numbers.money;

    if (!money || !money.budget) { return null; }

    var box = document.createElement("span");
    box.className = "viz budget" + (money.overrunning ? " over" : "");
    box.setAttribute("aria-hidden", "true");

    var spent = document.createElement("span");
    spent.className = "fill";
    spent.style.width = Math.min(1, money.spent / money.budget) * 100 + "%";
    box.appendChild(spent);

    if (money.projected) {
      var mark = document.createElement("span");
      mark.className = "mark";
      mark.style.left = Math.min(1, money.projected / money.budget) * 100 + "%";
      box.appendChild(mark);
    }

    return box;
  }

  function state(run) {
    // Its own state, above running, because a run stopped on a question and a
    // run working look identical until one of them is called what it is - and
    // this is the one where the next move is yours.
    if (run.waitingForYou) {
      return { word: "waiting for you", css: "stopped" };
    }

    if (run.running) {
      return { word: "running", css: "going" };
    }

    return run.ended === "done"
      ? { word: "done", css: "done" }
      : { word: run.ended || "stopped", css: "stopped" };
  }

  /*
    Three ways of looking at the same state, and none of them can do anything.
    Every control is in the detail pane, so answering a gate is implemented
    once rather than three times, and clicking anybody anywhere takes you
    there.
  */
  /*
    The list is drawn by whichever renderer this page is. Chosen here rather
    than inside one of them, so neither has to know the other exists.
  */
  function drawRunsOrList(runs) {
    return rich() ? drawRuns(runs) : drawList(runs);
  }

  var views = [
    { button: "view-list", box: "list", draw: drawRunsOrList },
    { button: "view-office", box: "office", draw: drawOffice },
    { button: "view-graph", box: "graph", draw: drawGraph },
    { button: "view-when", box: "when", draw: drawWhen },
    { button: "view-waiting", box: "waiting", draw: drawWaiting },
    { button: "view-terminal", box: "terminal", draw: drawTerminal }
  ];

  /*
    Which office a team works in.

    A room each, rather than everybody sharing one: a viewer showing four
    teams at once wants four different rooms, or it is the same picture four
    times and tells you nothing about which is which.

    Decided once, the first time a team is seen, and written down. It used to
    be worked out afresh every time by hashing the name across the installed
    sets - which meant installing or removing a single set moved every team on
    the machine into a different room. That is how an afternoon of measuring
    one office came to be applied to a different one, with nothing anywhere
    saying the room had changed.

    A team keeps its office until somebody changes it on the panel, or until
    the set it was in is gone.
  */
  var officeOf = kept("loadout.offices", {});

  function setFor(team) {
    if (!team) { return ""; }

    var all = (installed || []).slice().sort();

    if (!all.length) { return ""; }

    // Still valid? A set can be uninstalled, and pointing at one that is not
    // there draws nothing at all.
    if (officeOf[team] && all.indexOf(officeOf[team]) >= 0) { return officeOf[team]; }

    // An empty room first, so four teams get four offices rather than two of
    // them colliding on a hash and looking identical.
    var taken = {};

    Object.keys(officeOf).forEach(function (other) {
      if (other !== team && all.indexOf(officeOf[other]) >= 0) { taken[officeOf[other]] = true; }
    });

    var free = all.filter(function (one) { return !taken[one]; });
    var from = free.length ? free : all;

    var sum = 0;

    for (var i = 0; i < team.length; i += 1) { sum += team.charCodeAt(i) * (i + 1); }

    officeOf[team] = from[sum % from.length];
    keep("loadout.offices", officeOf);

    return officeOf[team];
  }

  // What each screen is called once it is a panel on a board rather than the
  // thing the whole pane is showing.
  var titles = {
    list: "Runs",
    office: "Office",
    graph: "Who asked whom",
    when: "Timeline",
    waiting: "Waiting",
    terminal: "Terminal"
  };

  var view = 0;

  /*
    The board: several screens at once instead of one.

    A panel does not copy a screen, it adopts it - the same element the single
    view uses is moved into the panel, so every draw function keeps working
    and nothing is built twice. A screen can therefore be in one place at a
    time, which is right: two offices on one page would be the same office.
  */
  var board = { on: false, open: [], big: null };

  /*
    Where the boxes live when the board is not borrowing them.

    Read once, now, while every one of them is still where the markup put it.
    Working it out later from one of the boxes is how they end up being
    "returned" into a panel that is about to be emptied - and emptying a panel
    destroys whatever is inside it, which is the screen itself.
  */
  var screensHome = document.getElementById("waiting").parentNode;

  /* Every adopted screen back home and hidden, before anything is emptied. */
  function reclaimScreens() {
    views.forEach(function (one) {
      var box = document.getElementById(one.box);

      if (box && box.closest("#board")) {
        box.hidden = true;
        screensHome.appendChild(box);
      }
    });
  }

  /* A screen named for a team rather than for one of the fixed views. */
  function isTeamOffice(name) { return name.indexOf("office:") === 0; }

  function teamOf(name) { return name.slice("office:".length); }

  function boardScreens() {
    return board.open.filter(function (name) {
      return isTeamOffice(name) || views.some(function (one) { return one.box === name; });
    });
  }

  /*
    How many across.

    The viewer works it out rather than being told: one panel fills the
    window, four make a two by two, nine a three by three, and it stops at six
    across because a seventh column is a row of postage stamps.
  */
  function across(count) {
    if (count <= 1) { return 1; }

    return Math.min(6, Math.ceil(Math.sqrt(count)));
  }

  /* One team's office, drawn into a panel of the viewer. */
  function drawTeamOffice(name, holds) {
    var team = teamOf(name);
    var runs = (shown || []).filter(function (run) { return run.team === team; });

    // The one going, or the last one there was. A panel for a team with
    // nothing to show says so rather than disappearing.
    var going = runs.filter(function (run) { return run.running; });
    var run = going[0] || runs[0] || null;

    holds.textContent = "";

    if (!run) {
      var none = document.createElement("p");

      none.className = "facts";
      none.textContent = team + " has not run on this machine.";
      holds.appendChild(none);

      return;
    }

    var list = document.createElement("ul");

    list.className = "rooms";
    list.appendChild(roomOf(run, setFor(team)));
    holds.appendChild(list);

    keepStill();
  }

  function drawBoard() {
    var holder = document.getElementById("board");

    // Everything home first and the panels emptied second. The other order
    // deletes the screens: they are inside the panels, and emptying a panel
    // takes its contents with it.
    reclaimScreens();

    holder.textContent = "";

    boardScreens().forEach(function (name) {
      var panel = document.createElement("section");
      var head = document.createElement("header");
      var title = document.createElement("h3");
      var team = isTeamOffice(name) ? teamOf(name) : null;

      panel.className = "screen"
        + (board.big === name ? " big" : "")
        + (team ? " office-of" : "");
      panel.setAttribute("aria-labelledby", "screen-" + name);

      title.id = "screen-" + name;
      title.textContent = team ? team : (titles[name] || name);
      head.appendChild(title);

      /*
        Which office this team works in, changeable here rather than only in a
        config file: it is a thing you decide by looking at it.

        Guarded, because a board restored from a previous visit is drawn
        before the answer saying what art exists has arrived - and reading
        .length off a list that is not there yet threw, which took the whole
        of drawBoard with it and left the board silently empty.
      */
      var sets = installed || [];

      if (team && sets.length > 1) {
        var pick = document.createElement("select");

        pick.setAttribute("aria-label", "Which office " + team + " works in");
        sets.forEach(function (one) {
          var choice = document.createElement("option");

          choice.value = one;
          choice.textContent = one;
          choice.selected = one === setFor(team);
          pick.appendChild(choice);
        });

        pick.addEventListener("change", function () {
          officeOf[team] = pick.value;
          keep("loadout.offices", officeOf);
          drawBoard();
          if (shown) { drawOpenScreens(shown); }
        });

        head.appendChild(pick);
      }

      var big = document.createElement("button");

      big.type = "button";
      big.textContent = "Big";
      big.setAttribute("aria-pressed", board.big === name ? "true" : "false");
      big.title = "Give " + (titles[name] || name) + " the whole width";
      big.addEventListener("click", function () {
        board.big = board.big === name ? null : name;
        keep("loadout.board", board);
        drawBoard();
        if (shown) { drawOpenScreens(shown); }
      });
      head.appendChild(big);

      var shut = document.createElement("button");

      shut.type = "button";
      shut.textContent = "Close";
      shut.title = "Take " + (titles[name] || name) + " off the board";
      shut.addEventListener("click", function () {
        board.open = board.open.filter(function (other) { return other !== name; });
        if (board.big === name) { board.big = null; }
        keep("loadout.board", board);
        showChoices();
        drawBoard();
        if (shown) { drawOpenScreens(shown); }
      });
      head.appendChild(shut);

      panel.appendChild(head);

      var holds = document.createElement("div");

      holds.className = "holds";

      if (team) {
        // Its own markup rather than a borrowed screen: there is one office
        // box and a viewer may hold six teams at once.
        holds.id = "holds-" + name;
        drawTeamOffice(name, holds);
      } else {
        var box = document.getElementById(name);

        box.hidden = false;
        holds.appendChild(box);
      }

      panel.appendChild(holds);
      holder.appendChild(panel);
    });

    holder.style.setProperty("--across", across(boardScreens().length));

    if (!boardScreens().length) {
      var none = document.createElement("p");

      none.className = "facts";
      none.textContent = "No screens on the board. Add one above.";
      holder.appendChild(none);
    }
  }

  /* Every screen the board is showing, drawn from the same state. */
  function drawOpenScreens(runs) {
    boardScreens().forEach(function (name) {
      if (isTeamOffice(name)) {
        var holds = document.getElementById("holds-" + name);

        if (holds) { drawTeamOffice(name, holds); }

        return;
      }

      var one = views.filter(function (v) { return v.box === name; })[0];

      if (one) { one.draw(runs); }
    });
  }

  function showChoices() {
    var where = document.getElementById("choices");

    where.textContent = "";

    function offer(name, text) {
      var label = document.createElement("label");
      var tick = document.createElement("input");

      tick.type = "checkbox";
      tick.checked = board.open.indexOf(name) >= 0;
      tick.addEventListener("change", function () {
        if (tick.checked) {
          if (board.open.indexOf(name) < 0) { board.open.push(name); }
        } else {
          board.open = board.open.filter(function (other) { return other !== name; });
          if (board.big === name) { board.big = null; }
        }

        keep("loadout.board", board);
        drawBoard();
        if (shown) { drawOpenScreens(shown); }
      });

      label.appendChild(tick);
      label.appendChild(document.createTextNode(" " + text));
      where.appendChild(label);
    }

    views.forEach(function (one) { offer(one.box, titles[one.box] || one.box); });

    /*
      And one per team that has run here, so a viewer can be four teams'
      offices side by side rather than four ways of looking at all of them.
      Taken from the runs themselves: a team nobody has run here is not a team
      this machine can show anything about.
    */
    var teams = [];

    (shown || []).forEach(function (run) {
      if (run.team && teams.indexOf(run.team) < 0) { teams.push(run.team); }
    });

    teams.sort();

    if (teams.length) {
      var rule = document.createElement("span");

      rule.className = "kind";
      rule.textContent = "Offices:";
      where.appendChild(rule);

      teams.forEach(function (team) { offer("office:" + team, team); });
    }
  }

  function showBoard() {
    board.on = true;
    view = -1;

    views.forEach(function (one) {
      document.getElementById(one.button).setAttribute("aria-pressed", "false");
      document.getElementById(one.box).hidden = true;
    });

    document.getElementById("view-board").setAttribute("aria-pressed", "true");
    var adding = document.getElementById("adding");

    adding.hidden = false;

    /*
      Open, when there is nothing on the board yet.

      It is a <details>, so an empty board showed its summary - "Which screens
      are on the board" - with apparently nothing underneath, and then "No
      screens on the board. Add one above." pointing at something that is not
      visible until you click it. Once something is on the board it can fold
      away again, because then the board itself says what is on it.
    */
    if (!board.open.length) { adding.open = true; }
    document.getElementById("board").hidden = false;

    keep("loadout.board", board);
    showChoices();
    drawBoard();

    if (shown) { drawOpenScreens(shown); }
  }

  function showView(which) {
    if (board.on) {
      // Take the screens back off the board before showing one on its own.
      board.on = false;

      reclaimScreens();

      document.getElementById("board").textContent = "";
      document.getElementById("board").hidden = true;
      document.getElementById("adding").hidden = true;
      document.getElementById("view-board").setAttribute("aria-pressed", "false");
      keep("loadout.board", board);
    }

    view = which;

    views.forEach(function (one, i) {
      document.getElementById(one.button).setAttribute("aria-pressed", i === which ? "true" : "false");
      document.getElementById(one.box).hidden = i !== which;
    });

    if (shown) { views[which].draw(shown); }
  }

  // The runs as they were last drawn, so switching view does not have to wait
  // four seconds for the next refresh to show anything.
  var shown = null;

  /*
    One screen, filling the window, for a browser dragged onto a second
    monitor. /screen/office is the office and nothing else - no heading, no
    view buttons, nothing to press by accident while walking past it.
  */
  function soloScreen() {
    var at = location.pathname.replace(/\/+$/, "");
    var mark = "/screen/";

    if (at.indexOf(mark) !== 0) { return null; }

    var want = decodeURIComponent(at.slice(mark.length));

    return views.some(function (one) { return one.box === want; }) ? want : null;
  }

  var solo = soloScreen();

  (function () {
    views.forEach(function (one, i) {
      document.getElementById(one.button).addEventListener("click", function () {
        showView(i);
      });
    });

    document.getElementById("view-board").addEventListener("click", showBoard);

    if (solo) {
      // The page is the screen. Everything else goes, including the panes,
      // so nothing has to be scrolled past to see it.
      document.body.className = "solo";
      document.title = (titles[solo] || solo) + " - Loadout teams";

      var main = document.querySelector("main");
      var banner = document.querySelector("header");

      Array.from(main.children).forEach(function (child) { child.hidden = true; });

      // The title and the preferences live in the banner now rather than in
      // main, so hiding main's children no longer takes them with it - and a
      // screen meant to fill a wall display does not want a row of buttons
      // above it.
      if (banner) { banner.hidden = true; }

      var box = document.getElementById(solo);

      box.hidden = false;
      main.appendChild(box);

      return;
    }

    // A board somebody arranged last time. Screens that no longer exist are
    // dropped rather than leaving a panel that cannot be filled.
    var saved = kept("loadout.board", null);

    if (saved && saved.on && (saved.open || []).length) {
      // Team offices count as well. This kept only the fixed views, so a
      // board of team offices came back empty - and then saved the empty one
      // over the top, which is how an arrangement disappears for good rather
      // than just failing to appear once.
      board.open = (saved.open || []).filter(function (name) {
        return isTeamOffice(name) || views.some(function (one) { return one.box === name; });
      });
      board.big = board.open.indexOf(saved.big) >= 0 ? saved.big : null;

      showBoard();
    }
  }());

  /*
    A desk. Its name and its state are words on the element, so a sprite - when
    there is art to put there - is a second encoding on top of a first rather
    than the only one. That ordering is the whole reason this is elements and
    not a canvas.
  */
  function desk(run, node, set) {
    var li = document.createElement("li");
    var button = document.createElement("button");
    var gone = node.state === "done" || node.state === "reported" || node.state === "failed";

    button.type = "button";
    button.className = "desk"
      + (gone ? " gone" : "")
      + (node.state === "working" ? " busy" : "");

    var sprite = document.createElement("span");

    // Decorative, and empty until there is art. Announced as nothing, which is
    // what a picture of a person at a desk is worth saying about - the name and
    // the state are already on the element as words, and this is the second
    // encoding rather than the only one.
    sprite.className = "sprite";
    sprite.setAttribute("aria-hidden", "true");

    var drawn = pieceFor(node, set);

    if (drawn) {
      sprite.className = "sprite drawn";
      sprite.style.backgroundImage = "url(\"/office/" + encodeURIComponent(set)
        + "/" + encodeURIComponent(drawn) + "?token=" + encodeURIComponent(token) + "\")";
    }

    button.appendChild(sprite);

    // Everything written goes on one plate, so there is a single opaque
    // thing behind all of it rather than a chip per line.
    var plate = document.createElement("span");

    plate.className = "plate";
    button.appendChild(plate);

    var role = node.role.replace(/^role\./, "");
    var doing = gone ? "left" : node.state;

    var who = document.createElement("span");

    // The person, not the slot. Every room on this machine has an
    // implementer/1 in it and none of them can be told apart in conversation;
    // this one is Priya and nobody else is.
    who.className = "who";
    who.textContent = node.person || node.node;
    plate.appendChild(who);

    var state = document.createElement("span");

    // On a floor plan the plate says who and how they are; which role they
    // are playing is on the card, along with everything else. A plate wide
    // enough for all three covers the desk next to it.
    state.className = "state";
    state.textContent = doing;
    plate.appendChild(state);

    /*
      The rest of it, on hovering or focusing the desk. The technical name is
      in here rather than on the plate because it is what the commands take
      and what a journal calls it - needed, and needed second.
    */
    var card = document.createElement("span");

    card.className = "card";
    card.setAttribute("aria-hidden", "true");

    var title = document.createElement("b");

    title.textContent = node.personFull || node.node;
    card.appendChild(title);

    [
      node.node + " - " + role,
      doing + (node.turns ? ", " + node.turns + " exchange" + (node.turns === 1 ? "" : "s") : ""),
      typeof node.cost === "number" ? "$" + node.cost.toFixed(2) : null,
      node.model || null,
      node.doing || null,
      node.said ? "says: " + node.said : null
    ].filter(Boolean).forEach(function (text) {
      var line = document.createElement("span");

      line.className = "line";
      line.textContent = text;
      card.appendChild(line);
    });

    button.appendChild(card);

    // Said as a sentence rather than left to whatever a reader makes of three
    // stacked spans: "lead project-lead, blocked" is what those run together
    // as, and a comma is the difference between a name and a mumble. The
    // person first and the node second, in the order somebody would say them.
    var sentence = (node.personFull ? node.personFull + ", " : "")
      + node.node + ", " + role + ", " + doing
      + (node.doing ? ", " + node.doing : "");

    button.setAttribute("aria-label", sentence);

    button.addEventListener("click", function () { watch(run); });

    li.appendChild(button);

    return li;
  }

  /*
    What is queued rather than going.

    Its own source: the office and the timeline both read the runs, and this
    reads the schedules and the tasks, which are the two things that have not
    become runs yet. A schedule is the machine's own intention and will fire
    whether or not anybody remembers; a task is a person's, and nothing will
    ever fire it. Showing one without the other answers half the question.
  */
  var queue = null;

  function queued() {
    return api("/api/waiting")
      .then(function (answer) {
        queue = answer.waiting || [];

        if (views[view].box === "waiting") { drawWaiting(); }
      })
      .catch(function () {
        // A dashboard that cannot see either store says so by staying empty,
        // which is what it should say.
      });
  }

  /*
    Which piece draws one of these.

    A lobby of identical people is a lobby nobody looks at twice, so a set may
    carry waiting-1, waiting-2 and so on and they are dealt out by the item's
    own id - the same item gets the same person on every redraw, which matters
    more than the variety does. Failing that, a piece named after the kind,
    and failing that the worker everything falls back to.
  */
  function queuePieceFor(item) {
    var many = [];

    for (var i = 1; i <= 24; i += 1) {
      if (waitingPieces["waiting-" + i]) { many.push("waiting-" + i); }
    }

    if (many.length > 0) {
      var sum = 0;

      for (var c = 0; c < item.id.length; c += 1) { sum += item.id.charCodeAt(c); }

      return many[sum % many.length];
    }

    if (waitingPieces[item.kind]) { return item.kind; }

    return waitingPieces.worker ? "worker" : null;
  }

  /*
    When it next comes round, said the way somebody would say it rather than
    as a timestamp. "Tomorrow at 09:00" is a thing a person can act on; an ISO
    string is a thing they have to decode first.
  */
  function nextTime(due) {
    if (!due) { return ""; }

    var at = new Date(due);
    var now = new Date();
    var days = Math.round((at - now) / 86400000);

    var clock = at.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

    if (at.toDateString() === now.toDateString()) { return "today at " + clock; }

    if (days >= 0 && days <= 1) { return "tomorrow at " + clock; }

    return at.toLocaleDateString([], { day: "numeric", month: "short" }) + " at " + clock;
  }

  function drawWaiting() {
    var box = document.getElementById("waiting");

    box.textContent = "";

    if (queue === null) { return; }

    if (queue.length === 0) {
      var none = document.createElement("li");

      none.className = "empty";
      none.textContent =
        "Nothing is queued. No schedule is waiting to fire and no task is open.";
      box.appendChild(none);

      return;
    }

    queue.forEach(function (item) {
      var li = document.createElement("li");
      var row = document.createElement("div");

      row.className = "item" + (item.held ? " held" : "");

      var sprite = document.createElement("span");
      var drawn = queuePieceFor(item);

      sprite.className = "sprite";
      sprite.setAttribute("aria-hidden", "true");

      if (drawn) {
        sprite.className = "sprite drawn";
        sprite.style.backgroundImage =
          "url(\"/waiting/" + encodeURIComponent(drawn) + "?token=" + encodeURIComponent(token) + "\")";
      }

      row.appendChild(sprite);

      var body = document.createElement("div");

      body.className = "body";

      var who = document.createElement("span");

      who.className = "who";
      who.textContent = item.title || item.id;
      body.appendChild(who);

      var why = document.createElement("span");

      // The kind first, because "schedule" and "task" are the difference
      // between something that will happen on its own and something that
      // will not happen until somebody does it.
      why.className = "why";
      why.textContent = (item.kind === "schedule"
        ? (item.team ? item.team : "a team") + (item.project ? " on " + item.project : "")
        : "task " + item.id + (item.project ? " in " + item.project : ""))
        + " - " + item.because;
      body.appendChild(why);

      row.appendChild(body);

      var when = document.createElement("span");

      when.className = "when";
      when.textContent = item.due ? nextTime(item.due) : "";
      row.appendChild(when);

      // Said as one sentence rather than left to whatever a reader makes of
      // three stacked spans.
      row.setAttribute("aria-label",
        (item.title || item.id) + ", " + why.textContent
        + (when.textContent ? ", " + when.textContent : ""));

      li.appendChild(row);
      box.appendChild(li);
    });
  }

  /*
    Whether to draw the room moving.

    The packs carry a head-bob loop of the whole floor as a GIF, which is the
    thing that makes an office look like somewhere people are rather than a
    diagram. It is also motion nobody asked for, so anybody who has asked
    their system for less gets the still instead - and a GIF cannot be stopped
    from CSS, so the choice is made here rather than in a media query.
  */
  function roomScene() {
    return pieces.room ? "room" : null;
  }

  /*
    The terminal. What one node is doing, line by line, as it does it.

    Which node: the newest running run's most recently active node. That is
    the thing somebody leaving a screen on wants to see, and picking it here
    rather than making them choose is the difference between a screen you
    glance at and one you operate.
  */
  var tapeOf = null;
  var tapeHas = 0;

  function drawTerminal(runs) {
    var box = document.getElementById("terminal");

    var going = runs.filter(function (run) { return run.running; });
    var run = going[0] || null;

    var node = null;

    if (run) {
      // Most recently seen first, and never one that has gone home.
      (run.nodes || []).forEach(function (one) {
        if (one.state === "done" || one.state === "reported" || one.state === "failed") { return; }
        if (!node || (one.lastSeen || "") > (node.lastSeen || "")) { node = one; }
      });
    }

    var want = run && node ? run.id + "/" + node.node : null;

    if (want !== tapeOf) {
      // A different node than last time, so nothing on the page belongs to it.
      tapeOf = want;
      tapeHas = 0;
      box.textContent = "";

      var who = document.createElement("p");

      who.className = "who";
      who.textContent = node
        ? node.node + " (" + node.role.replace(/^role\./, "") + ") in " + (run.room || run.id)
        : "Nothing is running.";
      box.appendChild(who);

      var tape = document.createElement("div");

      tape.className = "tape";
      tape.id = "tape";

      // A log that grows on its own, read out as it arrives, is a screen
      // reader talking over whoever is using the page. It is readable by
      // going to it, not by being announced.
      tape.setAttribute("role", "log");
      tape.setAttribute("aria-live", "off");
      tape.textContent = node ? "Reading what " + node.node + " has done..." : "";
      box.appendChild(tape);
    }

    if (!want) { return; }

    api("/api/runs/" + encodeURIComponent(run.id) + "/stream/"
      + encodeURIComponent(node.node) + "?after=" + tapeHas)
      .then(function (got) {
        // Somebody's run moved on while this was in flight.
        if (tapeOf !== want) { return; }

        var tape = document.getElementById("tape");

        if (!tape) { return; }

        if (tapeHas === 0) { tape.textContent = ""; }

        // A total below what is shown means the file was replaced rather than
        // added to, so what is on the page is not part of it.
        if (got.total < tapeHas) {
          tape.textContent = "";
          tapeHas = 0;
        }

        tapeHas = got.total;

        if (!got.steps.length) {
          if (!tape.textContent) { tape.textContent = node.node + " has recorded nothing yet."; }

          return;
        }

        var bottom = tape.scrollTop + tape.clientHeight >= tape.scrollHeight - 8;

        got.steps.forEach(function (step) {
          var line = document.createElement("p");

          line.textContent = clock(step.at) + "  " + step.kind
            + (step.sub ? " (subagent)" : "")
            + "  " + [step.tool, step.target, step.text].filter(Boolean).join(" ");

          tape.appendChild(line);
        });

        // Follows the tail only while somebody is already at the tail, so
        // scrolling back to read something is not yanked away a second later.
        if (bottom) { tape.scrollTop = tape.scrollHeight; }
      })
      .catch(function () {
        // A run that ended between the list and this. The next pass picks
        // whatever is running now.
      });
  }

  /*
    One run's room, drawn in a named office.

    Its own function because a room is wanted in two places now: the office
    screen, which draws every run in the machine's office, and a viewer panel,
    which draws one team in the office that team works in.
  */
  function roomOf(run, set) {
    var li = document.createElement("li");
    var how = state(run);
    var office = offices[set] || null;
    var plan = office && office.room ? office.room : null;

    li.className = "room" + (run.running ? "" : " empty");

    var name = document.createElement("h3");

    name.textContent = run.room || run.id;
    li.appendChild(name);

    var where = document.createElement("p");

    where.className = "where";
    where.textContent = run.team + (run.project ? " on " + run.project : "")
      + " - " + how.word + ". " + (run.goal || "");

    li.appendChild(where);

    var desks = document.createElement("ul");
    var spare = document.createElement("ul");

    // Where this office says its desks are, if it says. The lead's place is
    // first in the list, which is why the lead is first in the queue below.
    var places = (plan && plan.desks) || [];

    desks.className = "desks" + (places.length ? " placed" : "");
    spare.className = "desks";

    // The lead first and then its workers, so tabbing through a room follows
    // the shape of the team rather than the order a journal happened to
    // write things down in - and so the lead gets the lead's desk.
    var people = (run.nodes || []).slice().sort(function (a, b) {
      return (a.role === "role.project-lead" ? 0 : 1) - (b.role === "role.project-lead" ? 0 : 1);
    });

    people.forEach(function (node, i) {
      var seat = desk(run, node, set);

      if (places.length) {
        if (i < places.length) {
          seat.style.left = places[i][0] + "%";
          seat.style.top = places[i][1] + "%";

          /*
            And the same coordinate again as a stacking order, so that where
            two desks are close enough for their people to overlap, the one
            nearer the viewer is drawn in front. This is y-sorting, which is
            what every 2D engine does, and it costs nothing here because the
            number is already to hand.

            It goes on the sprite rather than on the desk on purpose. A
            positioned element with a z-index becomes a stacking context, and
            everything inside it is then trapped in that context - which would
            put each desk's name plate back underneath the furniture layer,
            however high the plate's own z-index was. The sprite has no such
            children, so it can be ordered freely.
          */
          var art = seat.querySelector(".sprite");

          if (art) { art.style.zIndex = Math.round(places[i][1] * 10); }

          desks.appendChild(seat);

          return;
        }

        // More people than the office has furniture. They stand in a row
        // under the room rather than being left out of it.
        spare.appendChild(seat);

        return;
      }

      desks.appendChild(seat);
    });

    if (!people.length) {
      var nobody = document.createElement("li");

      nobody.className = "where";
      nobody.textContent = run.running ? "Nobody has been briefed yet." : "Everybody has gone home.";

      // An empty room still has a floor, so the words go under it.
      (places.length ? spare : desks).appendChild(nobody);
    }

    var floor = document.createElement("div");
    var has = office && (office.pieces || []).indexOf("room") >= 0;

    floor.className = "floor" + (has ? "" : " bare");

    if (has) {
      // Decorative, and the desks stand on top of it. Which room this is,
      // what team, and who is at which desk are all words on the elements
      // already; a picture of an office adds nothing worth reading out.
      floor.style.backgroundImage = "url(\"/office/" + encodeURIComponent(set)
        + "/room?token=" + encodeURIComponent(token) + "\")";

      if (plan && plan.width && plan.height) {
        floor.style.aspectRatio = plan.width + " / " + plan.height;
      }

      if (plan && plan.person) {
        floor.style.setProperty("--person", plan.person);
      }
    }

    floor.appendChild(desks);

    if (has && (office.pieces || []).indexOf("front") >= 0) {
      var over = document.createElement("div");

      over.className = "over";
      over.setAttribute("aria-hidden", "true");
      over.style.backgroundImage = "url(\"/office/" + encodeURIComponent(set)
        + "/front?token=" + encodeURIComponent(token) + "\")";

      floor.appendChild(over);
    }

    li.appendChild(floor);

    // Anybody the room has no desk for stands in a row underneath rather than
    // being left out: a run with more nodes than the office has furniture is
    // still a run somebody needs to see all of.
    if (spare.children.length) { li.appendChild(spare); }

    return li;
  }

  /*
    Watches which rooms are actually on screen, so the ones that are not can
    stop animating. One observer, rebuilt with the rooms it watches, because
    every draw throws the old rooms away.
  */
  var watcher = null;

  /*
    Named for what it does rather than what it uses, because `watch` is already
    taken further down for watching one run in the detail pane - and a second
    function of that name silently replaces the first, so every call here went
    to the wrong one and threw.
  */
  function keepStill() {
    // Every room on the page, not one view's: the office list draws rooms and
    // so does a team's panel on the board, and both can be on screen at once.
    var rooms = [].slice.call(document.querySelectorAll(".room"));

    /*
      Once now, by measuring, and then by observer from here on.

      The observer alone is not enough, because it answers asynchronously and
      every poll rebuilds these rooms from scratch - so the answer arrived for
      elements that had already been thrown away, and the new ones started
      unmarked every time. Nothing was ever parked.

      Every rectangle is read before any class is written. Interleaving the two
      makes the browser recompute the layout for each room in turn.
    */
    var tall = window.innerHeight || 0;
    var showing = rooms.map(function (room) {
      var box = room.getBoundingClientRect();

      return box.bottom > -200 && box.top < tall + 200;
    });

    rooms.forEach(function (room, i) {
      room.classList.toggle("unwatched", !showing[i]);
    });

    if (!window.IntersectionObserver) { return; }

    if (watcher) { watcher.disconnect(); }

    watcher = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        entry.target.classList.toggle("unwatched", !entry.isIntersecting);
      });
    }, { rootMargin: "200px" });

    rooms.forEach(function (room) { watcher.observe(room); });
  }

  function drawOffice(runs) {
    var box = document.getElementById("office");

    box.textContent = "";

    runs.forEach(function (run) {
      box.appendChild(roomOf(run, setFor(run.team)));
    });

    keepStill();

    if (!runs.length) {
      var none = document.createElement("li");

      none.className = "where";
      none.textContent = "No team has run on this machine yet.";
      box.appendChild(none);
    }
  }

  /*
    The delegation tree as it happens: the lead, its workers under it, each
    carrying what it is and what it cost. This is the view that shows what a
    list cannot - the shape of a run - and it is the one to reach for when
    something is stuck.

    Hand-drawn SVG, like the bars. Every node is a link so it is focusable in
    tree order and reachable by keyboard without anything clever.
  */
  function drawGraph(runs) {
    var box = document.getElementById("graph");

    box.textContent = "";

    var going = runs.filter(function (run) { return run.running; });
    var wanted = going.length ? going : runs.slice(0, 3);

    if (!wanted.length) {
      var none = document.createElement("p");

      none.className = "facts";
      none.textContent = "No team has run on this machine yet.";
      box.appendChild(none);

      return;
    }

    wanted.forEach(function (run) {
      var name = document.createElement("h3");

      name.textContent = (run.room || run.id) + " - " + run.team;
      box.appendChild(name);
      box.appendChild(treeOf(run));
    });
  }

  /*
    Where the minutes and the money went, across the machine rather than inside
    one run. One row per run, placed by when it started and stretched by how
    long it took: what overlapped, what sat there waiting for somebody, and
    what the afternoon cost.

    Positioned elements rather than a picture, like everything else here. Each
    span is a button whose accessible name is the whole sentence, so the row
    reads without the bar being seen at all.
  */
  /*
    What the machine has learned about its own team file.

    One run refusing twenty tool calls is a bad afternoon; every run of one
    role refusing twenty is a role whose permissions are written wrong, and the
    second only shows up once the first is counted across runs. Same for cost:
    what a reviewer costs once is noise, and what it costs every time is a line
    somebody should change.

    Read when the section is opened rather than on every refresh: it walks
    every journal on the machine, and nobody needs that four times a minute
    behind a fold they have not opened.
  */
  (function () {
    var fold = document.getElementById("roles");

    fold.addEventListener("toggle", function () {
      if (fold.open) { drawRoles(); }
    });
  }());

  function drawRoles() {
    var box = document.getElementById("roles-table");

    box.textContent = "Reading every run on this machine...";

    api("/api/roles")
      .then(function (got) {
        box.textContent = "";

        if (!got.roles.length) {
          box.textContent = "No role has run yet.";

          return;
        }

        var table = document.createElement("table");

        table.className = "turns";

        var head = document.createElement("tr");

        ["Role", "Model", "Runs", "Cost", "Each", "Reports taken", "Refused"]
          .forEach(function (name, i) {
            var th = document.createElement("th");

            th.scope = "col";
            th.textContent = name;

            if (i === 3 || i === 4) { th.className = "money"; }

            head.appendChild(th);
          });

        var headRow = document.createElement("thead");

        headRow.appendChild(head);
        table.appendChild(headRow);

        var body = document.createElement("tbody");

        got.roles.forEach(function (role) {
          var row = document.createElement("tr");

          cell(row, role.role.replace(/^role\./, ""));

          // Null is a real answer: these runs did not write down what they ran
          // on, and a comparison against a model nobody knows is not one.
          cell(row, role.model || "not recorded");

          cell(row, role.runs);
          cell(row, money(role.cost), true);
          cell(row, money(role.each), true);

          cell(row, role.accepting === null || role.accepting === undefined
            ? "no reports"
            : Math.round(role.accepting * 100) + "% of " + (role.accepted + role.rejected));

          cell(row, role.denials
            ? role.denials + " (" + (Math.round(role.refusals * 10) / 10) + " a run)"
            : "");

          body.appendChild(row);
        });

        table.appendChild(body);
        box.appendChild(table);

        var note = document.createElement("p");

        note.className = "facts";
        note.textContent = "Dearest first. Which model a node ran on has only been "
          + "written down since this was added, so older runs say so rather than guessing.";

        box.appendChild(note);
      })
      .catch(function (wrong) {
        box.textContent = wrong.message;
      });
  }

  function drawWhen(runs) {
    var box = document.getElementById("when");

    box.textContent = "";

    var placed = runs.map(function (run) {
      var began = Date.parse(run.started);
      var ended = run.finished ? Date.parse(run.finished) : Date.now();

      return { run: run, began: began, ended: ended };
    }).filter(function (one) {
      return !isNaN(one.began) && !isNaN(one.ended);
    });

    if (!placed.length) {
      var none = document.createElement("p");

      none.className = "facts";
      none.textContent = "No team has run on this machine yet.";
      box.appendChild(none);

      return;
    }

    /*
      A strip per day, each scaled to the hours that day actually used.

      The obvious thing - one scale across everything - was tried and is
      useless: these runs span two days and each lasts minutes, so every bar
      came out at the minimum width and they all piled up against the left
      edge. It was a correct chart that said nothing.

      Collapsing the empty days keeps real time inside a day, which is where
      overlap lives and the only place it matters: two teams running at once
      are two teams running at once on an afternoon, never across a week.
    */
    var days = {};

    placed.forEach(function (one) {
      var day = new Date(one.began).toDateString();

      (days[day] = days[day] || []).push(one);
    });

    Object.keys(days).sort(function (a, b) {
      return Date.parse(a) - Date.parse(b);
    }).forEach(function (day) {
      var mine = days[day].slice().sort(function (a, b) { return a.began - b.began; });

      var first = Math.min.apply(null, mine.map(function (one) { return one.began; }));
      var last = Math.max.apply(null, mine.map(function (one) { return one.ended; }));

      // A day with one short run in it would otherwise be scaled to that run
      // and read as if it had taken all day. An hour is the shortest window
      // worth drawing.
      var across = Math.max(60 * 60 * 1000, last - first);

      var heading = document.createElement("h3");

      heading.textContent = new Date(first).toLocaleDateString(undefined,
        { weekday: "long", day: "numeric", month: "long" });

      box.appendChild(heading);

      var spent = mine.reduce(function (sum, one) { return sum + one.run.cost; }, 0);

      var sums = document.createElement("p");

      sums.className = "facts";
      sums.textContent = many(mine.length, "run", "runs") + ", "
        + spell(Math.round(mine.reduce(function (sum, one) {
          return sum + (one.ended - one.began);
        }, 0) / 1000)) + " of running, $" + spent.toFixed(2) + " in all.";

      box.appendChild(sums);

      var list = document.createElement("ul");

      list.className = "when";

      mine.forEach(function (one) { list.appendChild(row(one, first, across)); });

      box.appendChild(list);

      var ruler = document.createElement("p");

      ruler.className = "ruler";

      [first, first + (across / 2), first + across].forEach(function (at) {
        var mark = document.createElement("span");

        mark.textContent = new Date(at).toLocaleTimeString(undefined,
          { hour: "2-digit", minute: "2-digit" });

        ruler.appendChild(mark);
      });

      box.appendChild(ruler);
    });
  }

  function row(one, first, across) {
    var li = document.createElement("li");
    var how = state(one.run);

    var name = document.createElement("span");

    name.className = "name";
    name.textContent = one.run.room || one.run.id;
    li.appendChild(name);

    var track = document.createElement("span");

    track.className = "track";

    var span = document.createElement("button");
    var took = Math.max(0, one.ended - one.began);

    span.type = "button";
    span.className = "span " + how.css;
    span.style.left = ((one.began - first) / across * 100) + "%";

    // Never narrower than something that can be clicked, and never so wide
    // that it runs off the end of the day it is in.
    span.style.width = Math.min(
      100 - ((one.began - first) / across * 100),
      Math.max(1.5, took / across * 100)) + "%";

    // The whole sentence, because the bar says nothing at all to anybody who
    // cannot see where it starts.
    span.setAttribute("aria-label", (one.run.room || one.run.id) + ", " + one.run.team
      + ", " + how.word + ", started " + new Date(one.began).toLocaleTimeString()
      + ", " + spell(Math.round(took / 1000)) + ", $" + one.run.cost.toFixed(2));

    span.addEventListener("click", function () { watch(one.run); });

    track.appendChild(span);
    li.appendChild(track);

    var money = document.createElement("span");

    money.className = "spent";
    money.textContent = "$" + one.run.cost.toFixed(2);
    li.appendChild(money);

    return li;
  }

  function svg(name, into) {
    var made = document.createElementNS("http://www.w3.org/2000/svg", name);

    if (into) { into.appendChild(made); }

    return made;
  }

  function treeOf(run) {
    var nodes = (run.nodes || []).slice();
    var lead = nodes.filter(function (n) { return n.role === "role.project-lead"; })[0];
    var workers = nodes.filter(function (n) { return n !== lead; });

    var wide = Math.max(1, workers.length);
    var width = Math.max(320, wide * 150);
    var height = 190;

    var picture = svg("svg");

    picture.setAttribute("class", "graph");
    picture.setAttribute("viewBox", "0 0 " + width + " " + height);

    /*
      Drawn at its own size rather than stretched to the pane. The viewBox is
      as wide as the tree needs, and width: 100% alone scales that to whatever
      space there is - so a run with one node was blown up four and a half
      times and one with four workers only twice, and two rooms on the same
      screen drew their boxes at visibly different sizes. Capping the width at
      the viewBox keeps every box the same size in every room, and the 100% in
      the stylesheet still shrinks it when the pane is narrower than the tree.
    */
    picture.style.maxWidth = width + "px";
    picture.setAttribute("role", "group");
    picture.setAttribute("aria-label", "Who asked whom in " + (run.room || run.id));

    // The edges first so the boxes sit on top of them.
    workers.forEach(function (worker, i) {
      var line = svg("path", picture);
      var x = (i + 0.5) * (width / wide);

      line.setAttribute("class", "edge" + (worker.state === "working" ? " live" : ""));
      line.setAttribute("d", "M " + (width / 2) + " 62 C " + (width / 2) + " 100, " + x + " 90, " + x + " 118");
    });

    if (lead) { box(picture, lead, width / 2, 20, run); }

    workers.forEach(function (worker, i) {
      box(picture, worker, (i + 0.5) * (width / wide), 118, run);
    });

    return picture;
  }

  function box(picture, node, x, y, run) {
    var link = svg("a", picture);
    var rect = svg("rect", link);
    var stuck = (run.gates || []).some(function (gate) { return gate.node === node.node; });

    link.setAttribute("tabindex", "0");
    link.setAttribute("role", "button");
    link.setAttribute("aria-label", node.node + ", " + node.role.replace(/^role\./, "")
      + ", " + node.state + ", $" + (node.cost || 0).toFixed(2)
      + (stuck ? ", waiting for you" : ""));

    rect.setAttribute("class", "box"
      + (stuck ? " stuck" : node.state === "working" ? " going" : ""));
    rect.setAttribute("x", x - 62);
    rect.setAttribute("y", y);
    rect.setAttribute("width", 124);
    rect.setAttribute("height", 46);
    rect.setAttribute("rx", 4);

    [node.node, node.state + ", $" + (node.cost || 0).toFixed(2)].forEach(function (line, i) {
      var text = svg("text", link);

      text.setAttribute("x", x);
      text.setAttribute("y", y + 19 + (i * 15));
      text.setAttribute("text-anchor", "middle");
      text.textContent = line;
    });

    function open() { watch(run); }

    link.addEventListener("click", open);
    link.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        open();
        event.preventDefault();
      }
    });
  }

  function draw(runs) {
    shown = runs;

    suggest(runs);
    drawRail(runs);

    // Whatever is being followed keeps up whichever view is showing. This
    // lived inside the list, so opening the office froze the detail pane at
    // whatever was true when you left.
    if (watching) {
      var followed = runs.filter(function (one) { return one.id === watching; })[0];

      if (followed) {
        keepUp(followed);
      }
    }

    // On a board there is no single view to draw; the panels are drawn by
    // whoever asked for them. view is -1 there, and -1 is not an index.
    if (view >= 0) { views[view].draw(runs); }
  }

  /*
    The band across the top of the rich page: what is happening on this
    machine right now, in four numbers.

    Every one of them is a count of something already on the page. It is here
    because the page is left open on a second monitor and read from across a
    room, where a list of twelve cards answers "how many need me" only if you
    count them.
  */
  function drawTotals(runs) {
    var band = document.getElementById("totals");

    if (!band) { return; }

    var going = 0;
    var wants = 0;
    var spent = 0;
    var rate = 0;

    runs.forEach(function (run) {
      if (run.running) { going++; }
      if ((run.attention || []).length > 0) { wants++; }

      spent += run.cost || 0;

      if (run.running && run.numbers && run.numbers.money) {
        rate += run.numbers.money.perMinute || 0;
      }
    });

    band.textContent = "";

    total(band, "going", going === 1 ? "run going" : "runs going", going, going > 0 ? "going" : "");
    total(band, "wants", wants === 1 ? "run needs you" : "runs need you", wants, wants > 0 ? "stopped" : "");
    total(band, "spent", "spent across them", "$" + spent.toFixed(2), "");

    if (rate > 0) {
      total(band, "rate", "a minute, right now", "$" + rate.toFixed(2), "going");
    }
  }

  function total(band, name, label, value, tone) {
    var box = document.createElement("div");
    box.className = "total " + name + (tone ? " " + tone : "");

    var figure = document.createElement("strong");
    figure.textContent = value;
    box.appendChild(figure);

    var said = document.createElement("span");
    said.textContent = label;
    box.appendChild(said);

    band.appendChild(box);
  }

  /*
    One card per run, in a grid.

    Not a row: a row is as wide as the window and puts eight columns of table
    in front of somebody who wanted to know whether anything needs them. A
    card is the size of the thing it describes, twelve of them fit on a
    screen, and what it does not have room for is in the detail - which is one
    press away and is where the words for everything live.
  */
  function drawRuns(runs) {
    var list = document.getElementById("list");

    drawTotals(runs);

    list.textContent = "";
    list.className = "grouped";

    if (runs.length === 0) {
      // An empty page that says only that it is empty leaves somebody to find
      // out elsewhere what to do about it.
      var empty = document.createElement("li");
      var nothing = document.createElement("p");
      nothing.className = "nothing";
      nothing.textContent = "No team has run on this machine yet. "
        + "Open \u201cStart a team\u201d above, or run: loadout team run <team> \u201c<goal>\u201d";
      empty.appendChild(nothing);
      list.appendChild(empty);

      say("No team has run on this machine yet.");

      return;
    }

    // In the order somebody works in, and said rather than implied: a group
    // that is only an ordering is a pattern a reader has to notice, and one
    // reading in sequence cannot.
    grouped(list, "Needs you", runs.filter(function (run) {
      return (run.attention || []).length > 0;
    }));

    grouped(list, "Running", runs.filter(function (run) {
      return run.running && (run.attention || []).length === 0;
    }));

    grouped(list, "Finished", runs.filter(function (run) { return !run.running; }));

    say(many(runs.length, "run", "runs") + ", updated just now.");
  }

  /*
    One group of cards under its own heading, or nothing at all when the group
    is empty - an empty "Needs you" is a heading that makes somebody look for
    what is under it.
  */
  function grouped(into, title, runs) {
    if (runs.length === 0) { return; }

    // An item that holds the heading and the group's own list. The element
    // being drawn into is a list, and a list may contain nothing but items.
    var group = document.createElement("li");
    group.className = "group-item";

    var head = document.createElement("h3");
    head.className = "group";
    head.textContent = title;

    var count = document.createElement("span");
    count.className = "count";
    count.textContent = runs.length;
    head.appendChild(count);

    group.appendChild(head);

    var cards = document.createElement("ul");
    cards.className = "runs cards";
    group.appendChild(cards);
    into.appendChild(group);

    runs.forEach(function (run) { card(cards, run); });
  }

  function card(list, run) {
    (function (run) {
      var how = state(run);
      var box = document.createElement("li");
      box.className = "card " + how.css;

      // The whole card opens the run. A heading inside it, because the page
      // is a document before it is a dashboard and a card with no heading is
      // a list of twelve unnamed things to anybody reading it in order.
      // Under the group's heading, so the document outline reads
      // "Runs on this machine" then "Needs you" then the run - which is the
      // order it is laid out in, said the same way to somebody reading it.
      var name = document.createElement("h4");
      var open = document.createElement("button");
      open.type = "button";
      open.className = "as-link";
      open.textContent = nameOf(run);
      open.addEventListener("click", function () { watch(run); });
      name.appendChild(open);
      box.appendChild(name);

      var badges = document.createElement("p");
      badges.className = "badges";

      // The state, as a word. On every card, in every view, whatever the
      // colours are doing.
      var word = document.createElement("span");
      word.className = "state " + how.css;
      word.textContent = how.word;
      badges.appendChild(word);

      var team = document.createElement("span");
      team.className = "team";
      team.textContent = properly(run.team);
      badges.appendChild(team);

      if (run.project) {
        var where = document.createElement("span");
        where.className = "team";
        where.textContent = run.project;
        badges.appendChild(where);
      }

      box.appendChild(badges);

      var goal = document.createElement("p");
      goal.className = "goal";
      goal.textContent = run.goal || "";
      box.appendChild(goal);

      // The shape of it: one column per round, and where the money is.
      var shapes = document.createElement("div");
      shapes.className = "shapes";

      var strip = rounds(run);
      var budget = spend(run);

      if (strip) { shapes.appendChild(strip); }
      if (budget) { shapes.appendChild(budget); }
      if (strip || budget) { box.appendChild(shapes); }

      var facts = document.createElement("p");
      facts.className = "figures";

      figures(facts, "round " + run.rounds + (run.roundLimit ? " of " + run.roundLimit : ""));
      figures(facts, minutes(run.elapsedSeconds));
      figures(facts, "$" + run.cost.toFixed(2));
      box.appendChild(facts);

      // Who is in the room. Who, and nothing about how they are getting on:
      // a ring around an initial would be a claim carried by colour alone,
      // and every word for how a node is doing is in the detail, one press
      // away, where there is room to say it.
      var room = document.createElement("ul");
      room.className = "roster";

      run.nodes.forEach(function (node) {
        var seat = document.createElement("li");
        var reach = document.createElement("button");

        reach.type = "button";
        reach.className = "chip";
        reach.textContent = initials(who(node));

        // What the chip is, said properly, because two letters is not a name.
        reach.setAttribute("aria-label",
          who(node) + ", " + properly(node.role) + ", " + node.node
          + ": " + node.state + ". Show what they did.");
        reach.title = who(node) + " - " + properly(node.role) + " - " + node.node;

        reach.addEventListener("click", function () {
          wanted = node.node;
          watch(run);
        });

        seat.appendChild(reach);
        room.appendChild(seat);
      });

      box.appendChild(room);

      // The reference, last and quiet. It is what every command takes and
      // what somebody is about to type, and it is not what the card is about.
      var ident = document.createElement("p");
      ident.className = "facts";
      reference(run.id, ident);
      box.appendChild(ident);

      list.appendChild(box);
    }(run));
  }

  function figures(into, text) {
    var one = document.createElement("span");
    one.textContent = text;
    into.appendChild(one);
  }

  /*
    Two letters off a name. Enough to tell five people apart at a glance,
    which is all a seat in a room has to do; the name itself is the chip's
    accessible name and its tooltip.
  */
  function initials(name) {
    var words = String(name || "?").trim().split(/\s+/);

    return words.length > 1
      ? (words[0].charAt(0) + words[words.length - 1].charAt(0)).toUpperCase()
      : words[0].slice(0, 2).toUpperCase();
  }

  function drawList(runs) {
    list.textContent = "";

    if (runs.length === 0) {
      say("No team has run on this machine yet.");

      return;
    }

    runs.forEach(function (run) {
      var how = state(run);
      var item = document.createElement("li");
      item.className = "run";

      var name = document.createElement("h3");

      // The name opens the run. A heading that names a thing and cannot be
      // pressed makes somebody find the button that does the same, and on a
      // page of twelve runs that button is the one below the wrong card as
      // often as the right one.
      var open = document.createElement("button");
      open.type = "button";
      open.className = "as-link";
      open.textContent = nameOf(run);
      open.addEventListener("click", function () { watch(run); });
      name.appendChild(open);

      var team = document.createElement("span");
      team.className = "team";
      team.textContent = properly(run.team);
      name.appendChild(document.createTextNode(" "));
      name.appendChild(team);

      var top = document.createElement("div");
      top.className = "top";
      top.appendChild(name);
      item.appendChild(top);

      var line = document.createElement("p");
      line.className = "facts";

      var word = document.createElement("span");
      word.className = "state " + how.css;
      word.textContent = how.word;
      line.appendChild(word);

      line.appendChild(document.createTextNode(". "));

      // The identifier, beside the name rather than instead of it: this is
      // what every command takes and what somebody is about to type.
      reference(run.id, line);

      var rest = document.createTextNode(
        ". " +
        // Which project it worked on, first, because a machine with several
        // showed a list of runs nothing could attribute. Absent on runs
        // recorded before it was written down.
        (run.project ? run.project + ", " : "") +
        run.autonomy + ", round " + run.rounds +
        (run.roundLimit ? " of " + run.roundLimit : "") +
        ", " + minutes(run.elapsedSeconds) + ", $" + run.cost.toFixed(2) + ". " +
        (run.goal || ""));

      line.appendChild(rest);
      item.appendChild(line);

      if (rich()) {
        var shapes = document.createElement("div");
        shapes.className = "shapes";

        var strip = rounds(run);
        var budget = spend(run);

        if (strip) { shapes.appendChild(strip); }
        if (budget) { shapes.appendChild(budget); }

        // Beside the name rather than under the facts: the shape of a run and
        // what it is called are the two things somebody reads first, and a
        // drawing on a line of its own reads as a stray mark.
        if (strip || budget) { top.appendChild(shapes); }
      }

      if (run.atMostRemainingSeconds) {
        var ceiling = document.createElement("p");
        ceiling.className = "facts";
        ceiling.textContent = "At this rate, up to " + minutes(run.atMostRemainingSeconds) +
          " more if it uses all " + run.roundLimit + " rounds.";
        item.appendChild(ceiling);
      }

      var nodes = document.createElement("ul");
      nodes.className = "nodes";

      var dearest = 0;

      run.nodes.forEach(function (node) {
        if (node.cost > dearest) { dearest = node.cost; }
      });

      run.nodes.forEach(function (node) {
        var row = document.createElement("li");

        var person = document.createElement("span");
        person.className = "person";
        person.textContent = who(node);
        row.appendChild(person);

        var job = document.createElement("span");
        job.className = "job";
        job.textContent = " " + properly(node.role);
        row.appendChild(job);

        row.appendChild(document.createTextNode(" "));

        // Straight to everything that node did. The handle is the value a
        // person would otherwise copy, open the run, and hunt for in a list
        // of buttons.
        var reach = document.createElement("button");
        reach.type = "button";
        reach.className = "as-link";
        reach.appendChild(reference(node.node));
        reach.addEventListener("click", function () {
          wanted = node.node;
          watch(run);
        });

        row.appendChild(reach);

        var sep = document.createElement("span");
        sep.className = "sep";
        sep.textContent = ":";
        row.appendChild(sep);
        row.appendChild(document.createTextNode(" "));

        part(row, "node-state " + node.state.replace(/[^a-z-]/g, ""), node.state, ",");
        part(row, "turns", many(node.turns, "exchange", "exchanges"), ",");
        part(row, "money", "$" + node.cost.toFixed(2), node.tookSeconds ? "," : "");

        if (node.tookSeconds) {
          part(row, "took", minutes(node.tookSeconds), "");
        }

        // What this node's share of the run cost, drawn. Against the most
        // expensive node rather than the total, because a run with one node
        // that spent everything and five that spent nothing is a thing worth
        // seeing at a glance, and against the total it is one full bar and
        // five empty ones.
        if (rich() && dearest > 0) {
          row.appendChild(drawn("share", node.cost / dearest));
        }

        if (node.said) {
          var says = document.createElement("span");
          says.className = "doing";
          says.textContent = " - says: " + node.said;
          row.appendChild(says);
        }

        if (node.doing) {
          var doing = document.createElement("span");
          doing.className = "doing";
          doing.textContent = " - " + node.doing;
          row.appendChild(doing);
        }

        nodes.appendChild(row);
      });

      item.appendChild(nodes);

      var follow = document.createElement("button");
      follow.type = "button";
      follow.textContent = "Follow " + nameOf(run);
      follow.addEventListener("click", function () {
        watch(run);
      });

      item.appendChild(follow);
      list.appendChild(item);
    });

    say(many(runs.length, "run", "runs") + ", updated just now.");
  }

  // What a run has stopped to ask, with the buttons to answer it. Rebuilt
  // whenever the runs are read again, so an answer given anywhere - here, or
  // at a terminal - takes the question off the page.
  // What the gates looked like when they were last drawn, by their ids.
  var gatesShown = null;

  // What the room was called when the heading was last written.
  var roomShown = null;

  // How many exchanges the cost table was built from.
  var turnsShown = -1;

  /*
    The detail pane showing whatever was true when it was opened is a pane that
    lies within four seconds. It follows instead - but only redraws what has
