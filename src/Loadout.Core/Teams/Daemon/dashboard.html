<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loadout teams</title>
<style>
  /*
    Colour is never the only signal here: every state is a word as well. The
    pairs avoid red against green, which is the one combination a common
    colour deficiency cannot separate.
  */
  :root {
    color-scheme: light dark;
    --ink: #16181d;
    --quiet: #4a5160;
    --page: #ffffff;
    --card: #f4f5f7;
    --line: #c4c8d0;
    --going: #0b4f9e;
    --done: #14532d;
    --stopped: #7a3b00;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f2f3f5;
      --quiet: #bcc2cc;
      --page: #14161a;
      --card: #1e2128;
      --line: #454b56;
      --going: #9ec5ff;
      --done: #86e0a8;
      --stopped: #ffbf80;
    }
  }

  body {
    margin: 0;
    padding: 0 1rem 3rem;
    background: var(--page);
    color: var(--ink);
    font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  main { max-width: 90rem; margin: 0 auto; }

  /*
    Mission control: what needs you, what is running, and what you are looking
    at, all visible at once. Nothing important is ever a click away.

    One column by default and three when there is room, rather than the other
    way round: the narrow case is a phone answering a gate from the sofa, and
    a layout that starts wide and is squeezed reads as an afterthought there.

    The panes are in the order somebody needs them, so the document reads the
    same way it looks and a screen reader arrives at what needs doing first.
  */
  .panes { display: grid; gap: 1.25rem; align-items: start; }

  @media (min-width: 64rem) {
    .panes {
      grid-template-columns: minmax(16rem, 22rem) minmax(18rem, 24rem) minmax(0, 1fr);
    }

    /*
      The rail and the detail are hidden until something needs you and until
      you open a run, and a grid with three declared tracks holds all three
      open whether or not anything is in them. So the ordinary first look at
      this page - nothing waiting, nothing selected - put the run list in a
      22rem column with two thirds of the window empty beside it, which reads
      as a dashboard that failed to load rather than one with nothing to say.

      The template below therefore counts what is actually showing. The
      three-pane rule above stays as the default, so a browser without :has()
      gets exactly what it got before rather than something worse.
    */
    .panes:has(#rail[hidden]):has(#detail[hidden]) {
      grid-template-columns: minmax(0, 1fr);
    }

    .panes:has(#rail[hidden]):has(#detail:not([hidden])) {
      grid-template-columns: minmax(18rem, 24rem) minmax(0, 1fr);
    }

    .panes:has(#rail:not([hidden])):has(#detail[hidden]) {
      grid-template-columns: minmax(16rem, 22rem) minmax(0, 1fr);
    }

    /* Each pane scrolls on its own, so a long log cannot push the thing
       asking you a question off the screen. */
    .pane {
      max-height: calc(100vh - 12rem);
      overflow: auto;
    }
  }

  h1 { font-size: 1.5rem; margin: 1.5rem 0 0.25rem; }
  h2 { font-size: 1.2rem; margin: 2rem 0 0.5rem; }
  h3 { font-size: 1rem; margin: 0 0 0.25rem; }

  /* Visible, and not only as a colour change: a ring that survives a forced
     colours mode and a monochrome screen. */
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid currentColor;
    outline-offset: 2px;
  }

  .skip {
    position: absolute;
    left: -100vw;
  }

  .skip:focus {
    position: static;
    display: inline-block;
    padding: 0.5rem;
  }

  .runs { list-style: none; margin: 0; padding: 0; }

  .run {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.4rem;
    margin: 0 0 0.75rem;
    padding: 0.75rem 1rem;
  }

  /* Twenty-four pixels at least, in both directions, with room around it. */
  .run button {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 0.3rem;
    min-height: 2.5rem;
    min-width: 2.5rem;
    padding: 0.35rem 0.9rem;
    cursor: pointer;
  }

  .state { font-weight: 700; }
  .state.going { color: var(--going); }
  .state.done { color: var(--done); }
  .state.stopped { color: var(--stopped); }

  .facts { margin: 0.25rem 0 0; color: var(--quiet); }

  .nodes { list-style: none; margin: 0.75rem 0 0; padding: 0; }
  .nodes li { padding: 0.35rem 0; border-top: 1px solid var(--line); }
  .doing { color: var(--quiet); }
  .gate { border: 2px solid var(--stopped); padding: 0.75rem; margin: 0.75rem 0; }
  .gate .asked { font-weight: 700; margin: 0 0 0.5rem; }
  .gate button { margin: 0 0.5rem 0 0; }
  .gate textarea { font: inherit; width: 100%; box-sizing: border-box; padding: 0.4rem; margin: 0 0 0.5rem; }
  /*
    Hidden means hidden.

    A browser hides [hidden] through its own stylesheet, and any author rule
    that sets display beats it - so .controls { display: flex } left the box
    for typing at a live node on screen at all times, 664 by 78 pixels of it,
    and in the tab order, while its hidden attribute said otherwise. Every
    test passed: the attribute was in the markup, which is what they looked at.

    One rule rather than one per class, because the next thing given a display
    would bring it straight back, and there is nothing here that ever wants a
    hidden element drawn.
  */
  [hidden] { display: none !important; }

  .controls { margin: 0.75rem 0; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .controls input { flex: 1 1 14rem; min-width: 8rem; }

  /* Twenty-four pixels at least, in both directions. The buttons in the run
     list have said so since the first commit; the ones down here were relying
     on their own padding, and the box for steering a node came out at
     twenty-one, which axe caught and nobody would have. */
  .controls input, .controls button, .controls textarea { min-height: 2.5rem; }
  .said { flex-basis: 100%; }
  #said { font-weight: 700; margin: 0.25rem 0 0; }

  /* The rail. Bordered rather than coloured in, so it reads as a thing that
     needs doing under forced colours as well as in either theme. */
  #rail { border: 2px solid var(--stopped); padding: 0.5rem 0.75rem; margin: 0; }
  #rail h2 { margin: 0 0 0.5rem; font-size: 1rem; }
  #rail ul { list-style: none; margin: 0; padding: 0; }
  #rail li { padding: 0.4rem 0; border-top: 1px solid var(--line); }
  #rail li:first-child { border-top: 0; }
  #rail .which { font-weight: 700; }
  #rail .clears { color: var(--quiet); }

  /*
    Starting work. Folded away by default: the page is for watching what is
    already going, and a form that is always open is a form somebody fills in
    by accident.
  */
  .start { border: 1px solid var(--line); border-radius: 0.4rem; margin: 0 0 1rem; }
  .start summary { padding: 0.6rem 0.9rem; cursor: pointer; min-height: 2.5rem; }
  .start .fields { display: grid; gap: 0.6rem; padding: 0 0.9rem 0.9rem; }
  .start label { display: block; color: var(--quiet); font-size: 0.9rem; }
  .start input, .start select { font: inherit; width: 100%; box-sizing: border-box; padding: 0.4rem; }
  .start .narrow { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .start .narrow > * { flex: 1 1 8rem; }

  .start button {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 0.3rem;
    min-height: 2.5rem;
    padding: 0.35rem 0.9rem;
    cursor: pointer;
    justify-self: start;
  }

  /*
    Three ways of looking at the same state. The list is dense and sortable and
    is the working view; the office is glanceable and is the one left on a
    spare screen; the graph shows the shape of a run, which is what a list
    cannot. None of them can do anything: every control is in the detail pane,
    so there is one implementation of answering a gate rather than three.
  */
  /* Wraps, because the fifth view did not fit. Four buttons sat inside the
     runs pane and five overflowed it by sixty pixels, which turned the whole
     pane into a horizontal scroller and pushed every run's name off the left
     edge. A row of view buttons is not worth a scrollbar. */
  .views { display: flex; flex-wrap: wrap; gap: 0.25rem; margin: 0 0 0.75rem; }

  .views button {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 0.3rem;
    min-height: 2.5rem;
    padding: 0.35rem 0.9rem;
    cursor: pointer;
  }

  .views button[aria-pressed="true"] { font-weight: 700; box-shadow: inset 0 -3px 0 var(--going); }

  /*
    The office. Shape first and no art at all: every desk is a real element
    carrying its name and its state as words, and a sprite - when there is one
    - becomes a background on the same element rather than replacing it. That
    ordering is what keeps this inside the accessibility bar rather than beside
    it.
  */
  /*
    Rooms across the page rather than down it. Twelve runs stacked in one
    column is a page of scrolling with two thirds of the window unused; as a
    grid the afternoon fits on one screen, which is what a view you leave open
    on a spare monitor is for.
  */
  .rooms {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 1rem;
    grid-template-columns: repeat(auto-fill, minmax(32rem, 1fr));
  }

  .room {
    border: 1px solid var(--line);
    border-radius: 0.4rem;
    margin: 0 0 0.75rem;
    padding: 0.6rem 0.9rem;
  }

  /*
    The floor the desks stand on, rather than a picture above them. A band of
    office over a row of buttons is two things on a page; this is one room
    with the team in it, which is the whole point of the view.

    The scene stays behind the desks and never behind the words: every desk
    carries its own solid card, so the text it holds is read against that and
    not against whatever happens to be painted underneath.
  */
  /*
    The floor. Drawn at the scene's own shape and filled exactly, because the
    desks are placed on it by percentage and any cropping would move them off
    the furniture they belong to.
  */
  .room .floor {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 0.3rem;
    background-repeat: no-repeat;
    background-position: center;
    background-size: 100% 100%;
    image-rendering: pixelated;
  }

  /* Without a scene there is nothing to stand on, so they stand in a row. */
  .room .floor.bare { padding: 0.75rem; }

  /* The desks of a room that knows where its desks are. */
  .desks.placed { display: block; position: absolute; inset: 0; }

  .desks.placed li { position: absolute; }

  .desks.placed .desk {
    /* Anchored by the feet: the coordinate is where somebody stands, so the
       sprite sits above it and the plate hangs under it. */
    position: relative;
    transform: translate(-50%, -100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
    min-height: 0;
    padding: 0;
    font-size: 0.7rem;
    line-height: 1.25;
  }

  .desks.placed .desk .sprite.drawn { width: 2rem; height: 3.25rem; margin: 0; }
  /*
    Kept narrow so two people standing near each other do not label over one
    another. What is cut here is only ever repeated elsewhere: the whole
    sentence is the button's accessible name, it is on the element's title for
    a pointer, and the detail pane says all of it in full.
  */
  .desks.placed .desk .plate {
    text-align: center;
    max-width: 7rem;
    overflow: hidden;
  }

  .desks.placed .desk .who,
  .desks.placed .desk .state {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .desks.placed .desk .who { font-size: 0.72rem; }
  .desks.placed .desk .state { font-size: 0.66rem; }

  /* What a node is doing is a sentence, and a sentence on a floor plan covers
     the floor. It stays on the desk for a screen reader and in the detail
     pane for everybody. */
  .desks.placed .desk .doing { display: none; }

  /*
    The one bit of movement in the room, and it is the room's own people
    rather than a decoration: a node that is working breathes, and one that is
    blocked or gone is still. The reduced-motion rule further down turns every
    animation on the page off, this one included.
  */
  @keyframes at-work {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }

  .desk.busy .sprite.drawn { animation: at-work 1.8s ease-in-out infinite; }

  .room h3 { margin: 0; font-size: 1rem; }
  .room .where { color: var(--quiet); font-size: 0.85rem; margin: 0 0 0.5rem; }
  .room.empty { border-style: dashed; }

  .desks { list-style: none; display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 0; padding: 0; }

  /*
    A desk is a person standing in the room with a name plate, not a card
    pasted over a photograph. So the button itself carries nothing: the
    sprite stands on the floor and the words sit on a plate of their own.
  */
  .desk {
    border: 1px solid transparent;
    border-radius: 0.3rem;
    padding: 0.25rem;
    min-width: 7rem;
    min-height: 2.5rem;
    font: inherit;
    color: inherit;
    background: transparent;
    text-align: left;
    cursor: pointer;
  }

  .desk:hover { border-color: var(--line); }

  /*
    The plate. Opaque, and deliberately so: this is what the desk's words are
    read against once there is a room painted behind them, and a translucent
    one would make the contrast depend on which pixel of which office happened
    to land under which letter.
  */
  .desk .plate {
    display: block;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.25rem;
    padding: 0.2rem 0.4rem;
  }

  /* The word first and the colour second, here as everywhere else. */
  .desk .who { display: block; font-weight: 700; }
  .desk .state { display: block; font-size: 0.85rem; }
  .desk.gone { opacity: 0.7; }
  .desk.gone .plate { border-style: dashed; }

  /* Where a sprite goes when there is one: a background on the desk, with the
     words still in it. Nothing here needs art to work. */
  .desk .sprite {
    display: block;
    width: 2rem;
    height: 2rem;
    border: 1px solid var(--line);
    border-radius: 0.2rem;
    margin: 0 0 0.25rem;
  }

  /*
    With art in it. The border goes, because a square drawn round a character
    is a box and not a person; pixel art is scaled with no smoothing, because
    the whole point of a 32px sprite is the pixels.
  */
  .desk .sprite.drawn {
    /* A person is about twice as tall as they are wide, and a square box
       letterboxes them into something too small to recognise. The border goes
       with the art: a square drawn round a character is a box, not a person. */
    width: 3rem;
    height: 5rem;
    border-color: transparent;
    background-repeat: no-repeat;
    background-position: center bottom;
    background-size: contain;

    /* The whole point of pixel art is the pixels. Without this the browser
       smooths them on the way down and the sprite arrives as a smudge. */
    image-rendering: pixelated;
  }

  /* A desk whose node has finished keeps its sprite, quieter. The list already
     dims the whole desk; this stops the art fighting that. */
  .desk.gone .sprite.drawn { opacity: 0.7; }

  /*
    The waiting area. One row per thing that has not started: a reception of
    schedules with their next time, and the tasks sitting behind them. Rows
    rather than desks, because what somebody reads here is an order - what
    happens next, then next - and a wrapped grid has no order to read.
  */
  .queue { list-style: none; margin: 0; padding: 0; }

  .queue li { margin: 0 0 0.4rem; }

  /* No width: 100% here. This is a block element and already fills the row,
     and adding it to something with padding and a border - on a page with no
     global box-sizing - makes it exactly 21px too wide, which turned the whole
     runs pane into a horizontal scroller and clipped the time off every row. */
  .queue .item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    border: 1px solid var(--line);
    border-radius: 0.3rem;
    padding: 0.4rem 0.6rem;
    font: inherit;
    color: inherit;
    background: transparent;
    text-align: left;
  }

  /* Held is not a colour. A paused schedule and a blocked task say so in
     words on the row; the dashes are the second encoding, not the first. */
  .queue .item.held { border-style: dashed; opacity: 0.75; }

  .queue .who { display: block; font-weight: 700; }
  .queue .why { display: block; font-size: 0.85rem; color: var(--quiet); }
  .queue .when { margin-left: auto; padding-left: 0.6rem; font-size: 0.85rem; white-space: nowrap; }
  .queue .body { min-width: 0; }
  .queue .kind { font-size: 0.85rem; color: var(--quiet); }

  .queue .sprite {
    flex: 0 0 auto;
    display: block;
    width: 1.5rem;
    height: 1.5rem;
    border: 1px solid var(--line);
    border-radius: 0.2rem;
  }

  .queue .sprite.drawn {
    width: 2rem;
    height: 3rem;
    border-color: transparent;
    background-repeat: no-repeat;
    background-position: center bottom;
    background-size: contain;
    image-rendering: pixelated;
  }

  .queue .empty { color: var(--quiet); }

  /*
    The timeline. One row per run, placed by when it started and stretched by
    how long it took, so a machine's afternoon reads at a glance: what
    overlapped, what sat there, and what the day cost.
  */
  .when { list-style: none; margin: 0; padding: 0; font-size: 0.9rem; }

  .when li { display: flex; align-items: center; gap: 0.5rem; padding: 0.2rem 0; }
  .when .name { flex: 0 0 11rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .when .track { flex: 1 1 auto; position: relative; height: 1.6rem; }
  .when .spent { flex: 0 0 4rem; text-align: right; font-variant-numeric: tabular-nums; }

  .when .span {
    position: absolute;
    top: 0.3rem;
    height: 1rem;
    min-width: 3px;
    border: 1px solid var(--line);
    border-radius: 0.15rem;
    background: var(--done);
    font: inherit;
    color: inherit;
    padding: 0;
    cursor: pointer;
  }

  /* The word is in the accessible name; the colour is the second encoding. */
  .when .span.going { background: var(--going); }
  .when .span.stopped { background: var(--stopped); }
  .when .span:focus { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Three marks across the day's own window, so the bars have something to
     be read against rather than being widths with no scale. */
  .when + .ruler, .ruler { display: flex; justify-content: space-between; color: var(--quiet); font-size: 0.8rem; margin: 0 0 1rem; }
  .when .ruler span { flex: 0 0 auto; }

  .graph { width: 100%; height: auto; }
  .graph .edge { stroke: var(--line); stroke-width: 2; fill: none; }
  .graph .edge.live { stroke: var(--going); }
  .graph text { fill: var(--ink); font-size: 11px; }
  .graph .box { fill: var(--card); stroke: var(--line); stroke-width: 1; }
  .graph .box.going { stroke: var(--going); stroke-width: 2; }
  .graph .box.stuck { stroke: var(--stopped); stroke-width: 3; }
  .graph a:focus .box { stroke: var(--going); stroke-width: 3; }

  .prefs { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin: 0.5rem 0; }

  /*
    These two were left as the browser drew them while every other control on
    the page was given a size, so the button came out 21px tall and the
    checkbox 13px square - both under the 24px a pointer target has to be, and
    both in the header, which is the first thing anybody touches.
  */
  .prefs button {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 0.3rem;
    min-height: 2.5rem;
    padding: 0.35rem 0.9rem;
    cursor: pointer;
  }

  .prefs label {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    min-height: 2.5rem;
    color: var(--quiet);
    cursor: pointer;
  }

  .prefs input[type="checkbox"] {
    width: 1.5rem;
    height: 1.5rem;
    margin: 0;
    cursor: pointer;
  }

  .log {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.4rem;
    padding: 0.75rem 1rem;
    max-height: 22rem;
    overflow: auto;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 0.9rem;
  }

  .log p { margin: 0 0 0.2rem; }

  /* How many times in a row the same line came back, rather than the same
     line forty times. */
  .again { color: var(--quiet); font-weight: 700; }

  /*
    Three depths of the same run: what it cost, what it said, and the papers.
    A tab strip rather than three sections down the page, because the whole
    point of them is that you are looking at one at a time.
  */
  .depths { display: flex; flex-wrap: wrap; gap: 0.25rem; margin: 0.75rem 0 0; }

  .depths button {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 0.3rem 0.3rem 0 0;
    min-height: 2.5rem;
    padding: 0.35rem 0.9rem;
    cursor: pointer;
  }

  /* Bold and underlined as well as coloured, because which tab you are on is
     not something to say in colour alone. */
  .depths button[aria-selected="true"] {
    font-weight: 700;
    background: var(--card);
    box-shadow: inset 0 -3px 0 var(--going);
  }

  .depths kbd {
    font: inherit;
    font-size: 0.8em;
    color: var(--quiet);
    border: 1px solid var(--line);
    border-radius: 0.2rem;
    padding: 0 0.25rem;
    margin-left: 0.4rem;
  }

  /*
    The numbers that change a decision. Big enough to read from across a room,
    because the one that matters is read while deciding whether to walk over
    and stop something.
  */
  .figures { display: flex; flex-wrap: wrap; gap: 1.25rem; margin: 0 0 1rem; }
  .figure { min-width: 7rem; }
  .figure dt { color: var(--quiet); font-size: 0.85rem; }
  .figure dd { margin: 0; font-size: 1.4rem; font-variant-numeric: tabular-nums; }

  /* Bordered as well as coloured, so it survives a greyscale screenshot and a
     forced-colours mode - which is the whole point of saying it at all. */
  .figure.over dd { color: var(--stopped); font-weight: 700; }
  .figure.over { border-left: 3px solid var(--stopped); padding-left: 0.6rem; }

  /*
    A bar per round, drawn in the page rather than as a picture: no canvas, no
    library, and a screen reader reads the number rather than being told there
    is a chart.
  */
  .bars { list-style: none; margin: 0 0 1rem; padding: 0; font-size: 0.9rem; }
  .bars li { display: flex; align-items: center; gap: 0.5rem; padding: 0.15rem 0; }
  .bars .name { min-width: 9rem; }
  .bars .amount { font-variant-numeric: tabular-nums; min-width: 5rem; text-align: right; }

  .bars .bar {
    height: 0.7rem;
    background: var(--going);
    border: 1px solid var(--line);
    border-radius: 0.15rem;
    flex: 0 0 auto;
  }

  .turns { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  .turns th, .turns td { text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--line); }
  .turns td.money, .turns th.money { text-align: right; font-variant-numeric: tabular-nums; }
  .turns caption { text-align: left; color: var(--quiet); padding: 0 0 0.5rem; }

  .papers { list-style: none; margin: 0 0 0.75rem; padding: 0; }
  .papers li { padding: 0.2rem 0; }

  .papers button {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 0.3rem;
    min-height: 2.5rem;
    padding: 0.35rem 0.9rem;
    cursor: pointer;
    text-align: left;
  }

  .papers button[aria-pressed="true"] { font-weight: 700; box-shadow: inset 0 -3px 0 var(--going); }

  /*
    A patch. The + and - at the start of each line is what says which is which;
    the colour is decoration on top of a signal that is already there, which is
    why it survives a greyscale screenshot and a forced-colours mode intact.
  */
  .add { color: var(--done); }
  .drop { color: var(--stopped); }
  .hunk { color: var(--quiet); font-weight: 700; }

  .stat {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 0.85rem;
    white-space: pre-wrap;
    margin: 0 0 0.75rem;
  }

  .paper {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.4rem;
    padding: 0.75rem 1rem;
    max-height: 22rem;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 0.85rem;
  }

  /* A person who asked their machine for less movement gets none. */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }

  /* That rule is what stops the office breathing, so a set's room needs no
     motion switch of its own: the only movement is a CSS animation on the
     people who are working. */

  /* And one using a forced-colours mode keeps their own, with the borders
     still drawn. */
  @media (forced-colors: active) {
    .run, .log, .run button, .depths button, .papers button, .paper { border: 1px solid CanvasText; }
    .add, .drop, .hunk { color: CanvasText; }
    .bars .bar { background: CanvasText; }
    .views button, .room, .desk { border: 1px solid CanvasText; }
    .queue .item, .prefs button { border: 1px solid CanvasText; }

    /* Held keeps its dashes here too: in a mode that throws every colour
       away, the shape of the border is the only thing left carrying it, and
       the row says "paused" or "blocked" in words regardless. */
    .queue .item.held { border-style: dashed; }
    .views button[aria-pressed="true"] { border: 3px solid CanvasText; }
    .when .span { background: CanvasText; border: 1px solid CanvasText; }
    .graph .box { stroke: CanvasText; fill: Canvas; }
    .graph .edge { stroke: CanvasText; }
    .graph text { fill: CanvasText; }
    .depths button[aria-selected="true"], .papers button[aria-pressed="true"] { border: 3px solid CanvasText; }
    .state { color: CanvasText; }
  }
</style>
</head>
<body>
<a class="skip" href="#runs">Skip to the runs</a>

<main>
  <h1>Loadout teams</h1>

  <!--
    Present from the first paint, and empty, because a live region added to
    the page later is one a screen reader never started watching.
  -->
  <p id="status" role="status" aria-live="polite"></p>
  <p id="said" role="status" aria-live="assertive"></p>

  <div class="prefs">
    <button type="button" id="notify">Tell me when a run needs me</button>
    <label><input type="checkbox" id="sound"> Sound</label>
  </div>

  <div class="panes">

  <section id="rail" class="pane" hidden aria-labelledby="rail-heading">
    <h2 id="rail-heading">Needs you</h2>
    <ul id="rail-list"></ul>
  </section>

  <section class="pane" aria-labelledby="runs">
    <h2 id="runs">Runs on this machine</h2>

    <details class="start">
      <summary>Start a team</summary>

      <div class="fields">
        <div>
          <label for="start-team">Team</label>
          <input type="text" id="start-team" list="known-teams" placeholder="as team list names it">
          <datalist id="known-teams"></datalist>
        </div>

        <div>
          <label for="start-goal">What it is for</label>
          <input type="text" id="start-goal" placeholder="check the docs against the code">
        </div>

        <div>
          <label for="start-project">Project</label>
          <input type="text" id="start-project" list="known-projects" placeholder="as the registry names it">
          <datalist id="known-projects"></datalist>
        </div>

        <div class="narrow">
          <div>
            <label for="start-rounds">Rounds</label>
            <input type="number" id="start-rounds" min="1" max="20" placeholder="the team's own">
          </div>

          <div>
            <label for="start-autonomy">Autonomy</label>
            <select id="start-autonomy">
              <option value="">the team's own</option>
              <option value="manual">manual</option>
              <option value="supervised">supervised</option>
              <option value="autonomous">autonomous</option>
            </select>
          </div>
        </div>

        <button type="button" id="start">Start it</button>
      </div>
    </details>
    <div class="views" role="group" aria-label="How to look at them">
      <button type="button" id="view-list" aria-pressed="true">List</button>
      <button type="button" id="view-office" aria-pressed="false">Office</button>
      <button type="button" id="view-graph" aria-pressed="false">Graph</button>
      <button type="button" id="view-when" aria-pressed="false">Timeline</button>
      <button type="button" id="view-waiting" aria-pressed="false">Waiting</button>
    </div>

    <ul class="runs" id="list" aria-describedby="status"></ul>

    <ul class="rooms" id="office" hidden></ul>

    <div id="graph" hidden></div>

    <div id="when" hidden></div>

    <ul class="queue" id="waiting" hidden></ul>

    <details class="start" id="roles">
      <summary>How the roles have been doing</summary>
      <div class="fields" id="roles-table"></div>
    </details>
  </section>

  <section id="detail" class="pane" hidden aria-labelledby="detail-heading">
    <h2 id="detail-heading">Run</h2>

    <div id="gates"></div>

    <div id="controls" class="controls">
      <button type="button" id="pause">Hold it</button>
      <button type="button" id="resume">Let it carry on</button>
      <button type="button" id="stop">Stop it</button>
      <button type="button" id="again">Run it again</button>
      <label for="say" class="said">Say something to the lead</label>
      <input type="text" id="say" placeholder="read after its current round">
      <button type="button" id="send">Send</button>

      <label for="room" class="said">Call this room something</label>
      <input type="text" id="room" maxlength="60" placeholder="empty to go back to its own name">
      <button type="button" id="rename">Rename</button>
    </div>

    <div class="depths" role="tablist" aria-label="How much detail">
      <button type="button" role="tab" id="tab-messages" aria-controls="depth-messages"
        aria-selected="true">What it said <kbd>1</kbd></button>
      <button type="button" role="tab" id="tab-turns" aria-controls="depth-turns"
        aria-selected="false" tabindex="-1">What it cost <kbd>2</kbd></button>
      <button type="button" role="tab" id="tab-papers" aria-controls="depth-papers"
        aria-selected="false" tabindex="-1">The papers <kbd>3</kbd></button>
      <button type="button" role="tab" id="tab-changes" aria-controls="depth-changes"
        aria-selected="false" tabindex="-1">What it changed <kbd>4</kbd></button>
    </div>

    <div id="depth-messages" role="tabpanel" aria-labelledby="tab-messages" tabindex="0">
      <ul class="papers" id="who"></ul>

      <div class="controls" id="steer" hidden>
        <label for="steer-said" class="said">Say something to this node now</label>
        <input type="text" id="steer-said" placeholder="it hears this next time it says anything">
        <button type="button" id="steer-send">Say it</button>
      </div>

      <div class="log" id="log" role="log" aria-labelledby="detail-heading"></div>
    </div>

    <div id="depth-turns" role="tabpanel" aria-labelledby="tab-turns" tabindex="0" hidden></div>

    <div id="depth-papers" role="tabpanel" aria-labelledby="tab-papers" tabindex="0" hidden></div>

    <div id="depth-changes" role="tabpanel" aria-labelledby="tab-changes" tabindex="0" hidden></div>
  </section>

  </div>
</main>

<script>
(function () {
  "use strict";

  var token = new URLSearchParams(location.search).get("token") || "";
  var status = document.getElementById("status");
  var list = document.getElementById("list");
  var detail = document.getElementById("detail");
  var heading = document.getElementById("detail-heading");
  var log = document.getElementById("log");
  var stream = null;
  var watching = null;

  // The run the detail pane is showing, kept as an object rather than an id
  // so the depths can be drawn from it without asking the server again. It is
  // replaced on every refresh, so what the depths draw stays live.
  var opened = null;

  function say(text) {
    status.textContent = text;
  }

  // Everything that changes a run. The page never decides what any of these
  // mean: the daemon runs the command a person would have typed.
  function act(run, verb, body) {
    return fetch("/api/runs/" + encodeURIComponent(run) + "/" + verb +
                 "?token=" + encodeURIComponent(token), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body || {})
    }).then(function (r) {
      return r.text().then(function (said) {
        if (!r.ok) { throw new Error(said || ("HTTP " + r.status)); }
        return said;
      });
    });
  }

  // Said out loud rather than only shown, because the person who just changed
  // a run is the person who most needs to know whether it took.
  // Its own region, because the status line above is rewritten twice a second
  // by the poll - an answer to something somebody clicked lasted less than
  // half a second there, and a screen reader could miss it entirely.
  var saidTimer = null;

  function announce(said) {
    var box = document.getElementById("said");

    if (!box) { return; }

    box.textContent = said;

    // Cleared after a while so it does not read as the current state for ever.
    if (saidTimer) { clearTimeout(saidTimer); }
    saidTimer = setTimeout(function () { box.textContent = ""; }, 20000);
  }

  function api(path) {
    return fetch(path + (path.indexOf("?") < 0 ? "?" : "&") + "token=" + encodeURIComponent(token))
      .then(function (answer) {
        if (answer.ok) {
          return answer.json();
        }

        // Every one of these carries a sentence saying what happened and what
        // to do about it - the run is too old, the branch was tidied away, the
        // node recorded no stream. Replacing that with "404" throws away the
        // only part somebody can act on.
        return answer.text().then(function (body) {
          var said = null;

          try {
            said = JSON.parse(body).error;
          } catch (e) {
            said = null;
          }

          throw new Error(said || ("The dashboard answered " + answer.status + "."));
        });
      });
  }

  function minutes(seconds) {
    if (seconds === null || seconds === undefined) {
      return "";
    }

    if (seconds < 60) {
      return seconds + " seconds";
    }

    var m = Math.round(seconds / 60);

    return m + (m === 1 ? " minute" : " minutes");
  }

  // The word first, the colour second. Nothing here is carried by colour
  // alone, so a screenshot in greyscale says the same thing.
  // What has already been said out loud. Keyed by run, kind AND what it says,
  // because one run can be waiting on three different questions at once and
  // they are all kind "asking" - keyed on the kind alone, somebody would be
  // told about the first and never about the other two.
  //
  // A reason that clears and comes back is news again, because the key is
  // rebuilt from what is true now rather than remembered.
  var told = {};

  function keyOf(item) {
    return item.run.id + "/" + item.reason.kind + "/" + item.reason.detail;
  }

  // Per-viewer conveniences, in this browser only. Wrapped because a private
  // window throws rather than returning nothing.
  function remembered(name, fallback) {
    try {
      var value = window.localStorage.getItem(name);
      return value === null ? fallback : value === "1";
    } catch (e) {
      return fallback;
    }
  }

  function remember(name, on) {
    try { window.localStorage.setItem(name, on ? "1" : "0"); } catch (e) { /* fine */ }
  }

  // Synthesised rather than fetched, so the page still fetches nothing: a
  // short two-tone chime, quiet enough not to make somebody jump.
  function chime() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;

      if (!Ctx) { return; }

      var ctx = new Ctx();
      var now = ctx.currentTime;

      [880, 1174].forEach(function (hz, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.value = hz;
        gain.gain.setValueAtTime(0.0001, now + i * 0.14);
        gain.gain.exponentialRampToValueAtTime(0.09, now + i * 0.14 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.14 + 0.13);

        osc.connect(gain).connect(ctx.destination);
        osc.start(now + i * 0.14);
        osc.stop(now + i * 0.14 + 0.14);
      });

      setTimeout(function () { try { ctx.close(); } catch (e) { /* fine */ } }, 600);
    } catch (e) {
      // A browser that will not make a sound is not a reason to stop.
    }
  }

  function tell(items) {
    var fresh = items.filter(function (item) { return !told[keyOf(item)]; });

    // Rebuilt from what is true now, so a reason that has cleared is
    // forgotten and will be told again if it comes back.
    var next = {};
    items.forEach(function (item) { next[keyOf(item)] = true; });
    told = next;

    if (fresh.length === 0) { return; }

    if (document.getElementById("sound").checked) { chime(); }

    if (!("Notification" in window) || Notification.permission !== "granted") { return; }

    fresh.forEach(function (item) {
      try {
        var note = new Notification(item.run.team + " needs you", {
          body: item.reason.detail,

          // One notification per run and reason: a browser replaces a
          // notification carrying a tag it already has, so a page left open
          // for hours does not stack forty of them.
          tag: keyOf(item),
        });

        note.addEventListener("click", function () {
          window.focus();
          watch(item.run);
          note.close();
        });
      } catch (e) {
        // Some browsers refuse the constructor outside a service worker.
      }
    });
  }

  // Everything wanting somebody, across every run, newest first. Rebuilt on
  // every read: nothing here is remembered, so a reason that has gone is gone.
  /*
    What this machine has run before, offered as suggestions rather than as a
    list to choose from. Whether a team exists is the command line's question,
    and asking it here as well is how two answers start to disagree - but a
    name somebody typed last week is still the name they want today.
  */
  function suggest(runs) {
    [["known-teams", "team"], ["known-projects", "project"]].forEach(function (pair) {
      var list = document.getElementById(pair[0]);
      var seen = {};
      var names = [];

      runs.forEach(function (run) {
        var name = run[pair[1]];

        if (name && !seen[name]) {
          seen[name] = true;
          names.push(name);
        }
      });

      if (list.getAttribute("data-names") === names.join("|")) { return; }

      list.setAttribute("data-names", names.join("|"));
      list.textContent = "";

      names.forEach(function (name) {
        var option = document.createElement("option");

        option.value = name;
        list.appendChild(option);
      });
    });
  }

  (function () {
    var go = document.getElementById("start");

    go.addEventListener("click", function () {
      var team = document.getElementById("start-team").value.trim();
      var goal = document.getElementById("start-goal").value.trim();
      var project = document.getElementById("start-project").value.trim();
      var rounds = parseInt(document.getElementById("start-rounds").value, 10);
      var autonomy = document.getElementById("start-autonomy").value;

      if (!team || !goal) {
        announce("A run needs a team and something to do.");

        return;
      }

      // Named in the question. This one spends money and edits a repository,
      // and the token got somebody to the page rather than to this.
      if (!window.confirm("Start " + team + (project ? " on " + project : "")
        + " to \u201c" + goal + "\u201d?")) {
        return;
      }

      go.disabled = true;

      fetch("/api/start?token=" + encodeURIComponent(token), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          team: team,
          goal: goal,
          project: project || null,
          rounds: rounds > 0 ? rounds : null,
          autonomy: autonomy || null
        })
      })
        .then(function (answer) {
          return answer.text().then(function (body) {
            var said = null;

            try {
              said = JSON.parse(body).error;
            } catch (e) {
              said = null;
            }

            go.disabled = false;

            if (!answer.ok) {
              throw new Error(said || ("The dashboard answered " + answer.status + "."));
            }

            announce(team + " is starting. It appears in the list in a moment.");
            document.getElementById("start-goal").value = "";
          });
        })
        .catch(function (wrong) {
          go.disabled = false;
          announce(wrong.message);
        });
    });
  }());

  function drawRail(runs) {
    var rail = document.getElementById("rail");
    var list = document.getElementById("rail-list");
    var wanted = [];

    runs.forEach(function (run) {
      (run.attention || []).forEach(function (reason) {
        wanted.push({ run: run, reason: reason });
      });
    });

    list.textContent = "";
    rail.hidden = wanted.length === 0;

    wanted.forEach(function (item) {
      var li = document.createElement("li");

      var which = document.createElement("span");
      which.className = "which";
      which.textContent = item.run.team + " · " + item.run.id + " — ";
      li.appendChild(which);

      li.appendChild(document.createTextNode(item.reason.detail + " "));

      var clears = document.createElement("span");
      clears.className = "clears";
      clears.textContent = "(clears when " + item.reason.clears + ")";
      li.appendChild(clears);

      // Straight to the run it is about. A line that tells you something is
      // wrong and leaves you to find it is half a line.
      var go = document.createElement("button");
      go.type = "button";
      go.textContent = "Open";
      go.addEventListener("click", function () { watch(item.run); });
      li.appendChild(document.createTextNode(" "));
      li.appendChild(go);

      list.appendChild(li);
    });

    mark(wanted.length);
    tell(wanted);

    return wanted.length;
  }

  // The tab itself says how many. Free, needs no permission, and it works
  // while the tab is buried behind thirty others - which is the case this is
  // for.
  var titled = "Loadout teams";

  function mark(count) {
    document.title = count > 0 ? "(" + count + ") " + titled : titled;

    var link = document.querySelector("link[rel='icon']");

    if (!link) {
      link = document.createElement("link");
      link.rel = "icon";
      document.head.appendChild(link);
    }

    // Drawn rather than fetched, so the page still fetches nothing.
    var svg =
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'>" +
      "<rect width='16' height='16' rx='3' fill='" + (count > 0 ? "#7a3b00" : "#0b4f9e") + "'/>" +
      (count > 0
        ? "<circle cx='8' cy='8' r='3' fill='#fff'/>"
        : "<rect x='4' y='7' width='8' height='2' rx='1' fill='#fff'/>") +
      "</svg>";

    link.href = "data:image/svg+xml," + encodeURIComponent(svg);
  }

  function state(run) {
    // Its own state, above running, because a run stopped on a question and a
    // run working look identical until one of them is called what it is - and
    // this is the one where the next move is yours.
    if (run.waitingForYou) {
      return { word: "waiting for you", css: "stopped" };
    }

    if (run.running) {
      return { word: "running", css: "going" };
    }

    return run.ended === "done"
      ? { word: "done", css: "done" }
      : { word: run.ended || "stopped", css: "stopped" };
  }

  /*
    Three ways of looking at the same state, and none of them can do anything.
    Every control is in the detail pane, so answering a gate is implemented
    once rather than three times, and clicking anybody anywhere takes you
    there.
  */
  var views = [
    { button: "view-list", box: "list", draw: drawList },
    { button: "view-office", box: "office", draw: drawOffice },
    { button: "view-graph", box: "graph", draw: drawGraph },
    { button: "view-when", box: "when", draw: drawWhen },
    { button: "view-waiting", box: "waiting", draw: drawWaiting }
  ];

  var view = 0;

  function showView(which) {
    view = which;

    views.forEach(function (one, i) {
      document.getElementById(one.button).setAttribute("aria-pressed", i === which ? "true" : "false");
      document.getElementById(one.box).hidden = i !== which;
    });

    if (shown) { views[which].draw(shown); }
  }

  // The runs as they were last drawn, so switching view does not have to wait
  // four seconds for the next refresh to show anything.
  var shown = null;

  (function () {
    views.forEach(function (one, i) {
      document.getElementById(one.button).addEventListener("click", function () {
        showView(i);
      });
    });
  }());

  /*
    A desk. Its name and its state are words on the element, so a sprite - when
    there is art to put there - is a second encoding on top of a first rather
    than the only one. That ordering is the whole reason this is elements and
    not a canvas.
  */
  function desk(run, node) {
    var li = document.createElement("li");
    var button = document.createElement("button");
    var gone = node.state === "done" || node.state === "reported" || node.state === "failed";

    button.type = "button";
    button.className = "desk"
      + (gone ? " gone" : "")
      + (node.state === "working" ? " busy" : "");

    var sprite = document.createElement("span");

    // Decorative, and empty until there is art. Announced as nothing, which is
    // what a picture of a person at a desk is worth saying about - the name and
    // the state are already on the element as words, and this is the second
    // encoding rather than the only one.
    sprite.className = "sprite";
    sprite.setAttribute("aria-hidden", "true");

    var drawn = pieceFor(node);

    if (drawn) {
      sprite.className = "sprite drawn";
      sprite.style.backgroundImage =
        "url(\"/office/" + encodeURIComponent(drawn) + "?token=" + encodeURIComponent(token) + "\")";
    }

    button.appendChild(sprite);

    // Everything written goes on one plate, so there is a single opaque
    // thing behind all of it rather than a chip per line.
    var plate = document.createElement("span");

    plate.className = "plate";
    button.appendChild(plate);

    var who = document.createElement("span");

    who.className = "who";
    who.textContent = node.node;
    plate.appendChild(who);

    var state = document.createElement("span");

    state.className = "state";
    state.textContent = node.role.replace(/^role\./, "") + ", " + (gone ? "left" : node.state);
    plate.appendChild(state);

    if (node.doing) {
      var doing = document.createElement("span");

      doing.className = "state doing";
      doing.textContent = node.doing;
      plate.appendChild(doing);
    }

    // Said as a sentence rather than left to whatever a reader makes of three
    // stacked spans: "lead project-lead, blocked" is what those run together
    // as, and a comma is the difference between a name and a mumble.
    button.setAttribute("aria-label", node.node + ", " + state.textContent
      + (node.doing ? ", " + node.doing : ""));

    // The same sentence for a pointer, because a plate on a floor plan has to
    // be narrow and a narrow plate cuts words off.
    button.title = node.node + ", " + state.textContent
      + (node.doing ? ", " + node.doing : "");

    button.addEventListener("click", function () { watch(run); });

    li.appendChild(button);

    return li;
  }

  /*
    What is queued rather than going.

    Its own source: the office and the timeline both read the runs, and this
    reads the schedules and the tasks, which are the two things that have not
    become runs yet. A schedule is the machine's own intention and will fire
    whether or not anybody remembers; a task is a person's, and nothing will
    ever fire it. Showing one without the other answers half the question.
  */
  var queue = null;

  function queued() {
    return api("/api/waiting")
      .then(function (answer) {
        queue = answer.waiting || [];

        if (views[view].box === "waiting") { drawWaiting(); }
      })
      .catch(function () {
        // A dashboard that cannot see either store says so by staying empty,
        // which is what it should say.
      });
  }

  /*
    Which piece draws one of these.

    A lobby of identical people is a lobby nobody looks at twice, so a set may
    carry waiting-1, waiting-2 and so on and they are dealt out by the item's
    own id - the same item gets the same person on every redraw, which matters
    more than the variety does. Failing that, a piece named after the kind,
    and failing that the worker everything falls back to.
  */
  function queuePieceFor(item) {
    var many = [];

    for (var i = 1; i <= 24; i += 1) {
      if (waitingPieces["waiting-" + i]) { many.push("waiting-" + i); }
    }

    if (many.length > 0) {
      var sum = 0;

      for (var c = 0; c < item.id.length; c += 1) { sum += item.id.charCodeAt(c); }

      return many[sum % many.length];
    }

    if (waitingPieces[item.kind]) { return item.kind; }

    return waitingPieces.worker ? "worker" : null;
  }

  /*
    When it next comes round, said the way somebody would say it rather than
    as a timestamp. "Tomorrow at 09:00" is a thing a person can act on; an ISO
    string is a thing they have to decode first.
  */
  function nextTime(due) {
    if (!due) { return ""; }

    var at = new Date(due);
    var now = new Date();
    var days = Math.round((at - now) / 86400000);

    var clock = at.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

    if (at.toDateString() === now.toDateString()) { return "today at " + clock; }

    if (days >= 0 && days <= 1) { return "tomorrow at " + clock; }

    return at.toLocaleDateString([], { day: "numeric", month: "short" }) + " at " + clock;
  }

  function drawWaiting() {
    var box = document.getElementById("waiting");

    box.textContent = "";

    if (queue === null) { return; }

    if (queue.length === 0) {
      var none = document.createElement("li");

      none.className = "empty";
      none.textContent =
        "Nothing is queued. No schedule is waiting to fire and no task is open.";
      box.appendChild(none);

      return;
    }

    queue.forEach(function (item) {
      var li = document.createElement("li");
      var row = document.createElement("div");

      row.className = "item" + (item.held ? " held" : "");

      var sprite = document.createElement("span");
      var drawn = queuePieceFor(item);

      sprite.className = "sprite";
      sprite.setAttribute("aria-hidden", "true");

      if (drawn) {
        sprite.className = "sprite drawn";
        sprite.style.backgroundImage =
          "url(\"/waiting/" + encodeURIComponent(drawn) + "?token=" + encodeURIComponent(token) + "\")";
      }

      row.appendChild(sprite);

      var body = document.createElement("div");

      body.className = "body";

      var who = document.createElement("span");

      who.className = "who";
      who.textContent = item.title || item.id;
      body.appendChild(who);

      var why = document.createElement("span");

      // The kind first, because "schedule" and "task" are the difference
      // between something that will happen on its own and something that
      // will not happen until somebody does it.
      why.className = "why";
      why.textContent = (item.kind === "schedule"
        ? (item.team ? item.team : "a team") + (item.project ? " on " + item.project : "")
        : "task " + item.id + (item.project ? " in " + item.project : ""))
        + " - " + item.because;
      body.appendChild(why);

      row.appendChild(body);

      var when = document.createElement("span");

      when.className = "when";
      when.textContent = item.due ? nextTime(item.due) : "";
      row.appendChild(when);

      // Said as one sentence rather than left to whatever a reader makes of
      // three stacked spans.
      row.setAttribute("aria-label",
        (item.title || item.id) + ", " + why.textContent
        + (when.textContent ? ", " + when.textContent : ""));

      li.appendChild(row);
      box.appendChild(li);
    });
  }

  /*
    Whether to draw the room moving.

    The packs carry a head-bob loop of the whole floor as a GIF, which is the
    thing that makes an office look like somewhere people are rather than a
    diagram. It is also motion nobody asked for, so anybody who has asked
    their system for less gets the still instead - and a GIF cannot be stopped
    from CSS, so the choice is made here rather than in a media query.
  */
  function roomScene() {
    return pieces.room ? "room" : null;
  }

  function drawOffice(runs) {
    var box = document.getElementById("office");

    box.textContent = "";

    runs.forEach(function (run) {
      var li = document.createElement("li");
      var how = state(run);

      li.className = "room" + (run.running ? "" : " empty");

      var name = document.createElement("h3");

      name.textContent = run.room || run.id;
      li.appendChild(name);

      var where = document.createElement("p");

      where.className = "where";
      where.textContent = run.team + (run.project ? " on " + run.project : "")
        + " - " + how.word + ". " + (run.goal || "");

      li.appendChild(where);

      var desks = document.createElement("ul");
      var spare = document.createElement("ul");

      // Where the room says its desks are, if it says. The lead's place is
      // first in the list, which is why the lead is first in the queue below.
      var places = (pieces.room && room && room.desks) || [];

      desks.className = "desks" + (places.length ? " placed" : "");
      spare.className = "desks";

      // The lead first and then its workers, so tabbing through a room follows
      // the shape of the team rather than the order a journal happened to
      // write things down in - and so the lead gets the lead's desk.
      var people = (run.nodes || []).slice().sort(function (a, b) {
        return (a.role === "role.project-lead" ? 0 : 1) - (b.role === "role.project-lead" ? 0 : 1);
      });

      people.forEach(function (node, i) {
        var li = desk(run, node);

        if (places.length) {
          if (i < places.length) {
            li.style.left = places[i][0] + "%";
            li.style.top = places[i][1] + "%";
            desks.appendChild(li);

            return;
          }

          // More people than the office has furniture. They stand in a row
          // under the room rather than being left out of it.
          spare.appendChild(li);

          return;
        }

        desks.appendChild(li);
      });

      if (!people.length) {
        var nobody = document.createElement("li");

        nobody.className = "where";
        nobody.textContent = run.running ? "Nobody has been briefed yet." : "Everybody has gone home.";

        // An empty room still has a floor, so the words go under it.
        (places.length ? spare : desks).appendChild(nobody);
      }

      var scene = roomScene();
      var floor = document.createElement("div");

      floor.className = "floor" + (scene ? "" : " bare");

      if (scene) {
        // Decorative, and the desks stand on top of it. Which room this is,
        // what team, and who is at which desk are all words on the elements
        // already; a picture of an office adds nothing worth reading out.
        floor.style.backgroundImage =
          "url(\"/office/" + encodeURIComponent(scene) + "?token=" + encodeURIComponent(token) + "\")";

        if (room && room.width && room.height) {
          floor.style.aspectRatio = room.width + " / " + room.height;
        }
      }

      floor.appendChild(desks);
      li.appendChild(floor);

      // Anybody the room has no desk for stands in a row underneath rather
      // than being left out: a run with more nodes than the office has
      // furniture is still a run somebody needs to see all of.
      if (spare.children.length) { li.appendChild(spare); }
      box.appendChild(li);
    });

    if (!runs.length) {
      var none = document.createElement("li");

      none.className = "where";
      none.textContent = "No team has run on this machine yet.";
      box.appendChild(none);
    }
  }

  /*
    The delegation tree as it happens: the lead, its workers under it, each
    carrying what it is and what it cost. This is the view that shows what a
    list cannot - the shape of a run - and it is the one to reach for when
    something is stuck.

    Hand-drawn SVG, like the bars. Every node is a link so it is focusable in
    tree order and reachable by keyboard without anything clever.
  */
  function drawGraph(runs) {
    var box = document.getElementById("graph");

    box.textContent = "";

    var going = runs.filter(function (run) { return run.running; });
    var wanted = going.length ? going : runs.slice(0, 3);

    if (!wanted.length) {
      var none = document.createElement("p");

      none.className = "facts";
      none.textContent = "No team has run on this machine yet.";
      box.appendChild(none);

      return;
    }

    wanted.forEach(function (run) {
      var name = document.createElement("h3");

      name.textContent = (run.room || run.id) + " - " + run.team;
      box.appendChild(name);
      box.appendChild(treeOf(run));
    });
  }

  /*
    Where the minutes and the money went, across the machine rather than inside
    one run. One row per run, placed by when it started and stretched by how
    long it took: what overlapped, what sat there waiting for somebody, and
    what the afternoon cost.

    Positioned elements rather than a picture, like everything else here. Each
    span is a button whose accessible name is the whole sentence, so the row
    reads without the bar being seen at all.
  */
  /*
    What the machine has learned about its own team file.

    One run refusing twenty tool calls is a bad afternoon; every run of one
    role refusing twenty is a role whose permissions are written wrong, and the
    second only shows up once the first is counted across runs. Same for cost:
    what a reviewer costs once is noise, and what it costs every time is a line
    somebody should change.

    Read when the section is opened rather than on every refresh: it walks
    every journal on the machine, and nobody needs that four times a minute
    behind a fold they have not opened.
  */
  (function () {
    var fold = document.getElementById("roles");

    fold.addEventListener("toggle", function () {
      if (fold.open) { drawRoles(); }
    });
  }());

  function drawRoles() {
    var box = document.getElementById("roles-table");

    box.textContent = "Reading every run on this machine...";

    api("/api/roles")
      .then(function (got) {
        box.textContent = "";

        if (!got.roles.length) {
          box.textContent = "No role has run yet.";

          return;
        }

        var table = document.createElement("table");

        table.className = "turns";

        var head = document.createElement("tr");

        ["Role", "Model", "Runs", "Cost", "Each", "Reports taken", "Refused"]
          .forEach(function (name, i) {
            var th = document.createElement("th");

            th.scope = "col";
            th.textContent = name;

            if (i === 3 || i === 4) { th.className = "money"; }

            head.appendChild(th);
          });

        var headRow = document.createElement("thead");

        headRow.appendChild(head);
        table.appendChild(headRow);

        var body = document.createElement("tbody");

        got.roles.forEach(function (role) {
          var row = document.createElement("tr");

          cell(row, role.role.replace(/^role\./, ""));

          // Null is a real answer: these runs did not write down what they ran
          // on, and a comparison against a model nobody knows is not one.
          cell(row, role.model || "not recorded");

          cell(row, role.runs);
          cell(row, money(role.cost), true);
          cell(row, money(role.each), true);

          cell(row, role.accepting === null || role.accepting === undefined
            ? "no reports"
            : Math.round(role.accepting * 100) + "% of " + (role.accepted + role.rejected));

          cell(row, role.denials
            ? role.denials + " (" + (Math.round(role.refusals * 10) / 10) + " a run)"
            : "");

          body.appendChild(row);
        });

        table.appendChild(body);
        box.appendChild(table);

        var note = document.createElement("p");

        note.className = "facts";
        note.textContent = "Dearest first. Which model a node ran on has only been "
          + "written down since this was added, so older runs say so rather than guessing.";

        box.appendChild(note);
      })
      .catch(function (wrong) {
        box.textContent = wrong.message;
      });
  }

  function drawWhen(runs) {
    var box = document.getElementById("when");

    box.textContent = "";

    var placed = runs.map(function (run) {
      var began = Date.parse(run.started);
      var ended = run.finished ? Date.parse(run.finished) : Date.now();

      return { run: run, began: began, ended: ended };
    }).filter(function (one) {
      return !isNaN(one.began) && !isNaN(one.ended);
    });

    if (!placed.length) {
      var none = document.createElement("p");

      none.className = "facts";
      none.textContent = "No team has run on this machine yet.";
      box.appendChild(none);

      return;
    }

    /*
      A strip per day, each scaled to the hours that day actually used.

      The obvious thing - one scale across everything - was tried and is
      useless: these runs span two days and each lasts minutes, so every bar
      came out at the minimum width and they all piled up against the left
      edge. It was a correct chart that said nothing.

      Collapsing the empty days keeps real time inside a day, which is where
      overlap lives and the only place it matters: two teams running at once
      are two teams running at once on an afternoon, never across a week.
    */
    var days = {};

    placed.forEach(function (one) {
      var day = new Date(one.began).toDateString();

      (days[day] = days[day] || []).push(one);
    });

    Object.keys(days).sort(function (a, b) {
      return Date.parse(a) - Date.parse(b);
    }).forEach(function (day) {
      var mine = days[day].slice().sort(function (a, b) { return a.began - b.began; });

      var first = Math.min.apply(null, mine.map(function (one) { return one.began; }));
      var last = Math.max.apply(null, mine.map(function (one) { return one.ended; }));

      // A day with one short run in it would otherwise be scaled to that run
      // and read as if it had taken all day. An hour is the shortest window
      // worth drawing.
      var across = Math.max(60 * 60 * 1000, last - first);

      var heading = document.createElement("h3");

      heading.textContent = new Date(first).toLocaleDateString(undefined,
        { weekday: "long", day: "numeric", month: "long" });

      box.appendChild(heading);

      var spent = mine.reduce(function (sum, one) { return sum + one.run.cost; }, 0);

      var sums = document.createElement("p");

      sums.className = "facts";
      sums.textContent = many(mine.length, "run", "runs") + ", "
        + spell(Math.round(mine.reduce(function (sum, one) {
          return sum + (one.ended - one.began);
        }, 0) / 1000)) + " of running, $" + spent.toFixed(2) + " in all.";

      box.appendChild(sums);

      var list = document.createElement("ul");

      list.className = "when";

      mine.forEach(function (one) { list.appendChild(row(one, first, across)); });

      box.appendChild(list);

      var ruler = document.createElement("p");

      ruler.className = "ruler";

      [first, first + (across / 2), first + across].forEach(function (at) {
        var mark = document.createElement("span");

        mark.textContent = new Date(at).toLocaleTimeString(undefined,
          { hour: "2-digit", minute: "2-digit" });

        ruler.appendChild(mark);
      });

      box.appendChild(ruler);
    });
  }

  function row(one, first, across) {
    var li = document.createElement("li");
    var how = state(one.run);

    var name = document.createElement("span");

    name.className = "name";
    name.textContent = one.run.room || one.run.id;
    li.appendChild(name);

    var track = document.createElement("span");

    track.className = "track";

    var span = document.createElement("button");
    var took = Math.max(0, one.ended - one.began);

    span.type = "button";
    span.className = "span " + how.css;
    span.style.left = ((one.began - first) / across * 100) + "%";

    // Never narrower than something that can be clicked, and never so wide
    // that it runs off the end of the day it is in.
    span.style.width = Math.min(
      100 - ((one.began - first) / across * 100),
      Math.max(1.5, took / across * 100)) + "%";

    // The whole sentence, because the bar says nothing at all to anybody who
    // cannot see where it starts.
    span.setAttribute("aria-label", (one.run.room || one.run.id) + ", " + one.run.team
      + ", " + how.word + ", started " + new Date(one.began).toLocaleTimeString()
      + ", " + spell(Math.round(took / 1000)) + ", $" + one.run.cost.toFixed(2));

    span.addEventListener("click", function () { watch(one.run); });

    track.appendChild(span);
    li.appendChild(track);

    var money = document.createElement("span");

    money.className = "spent";
    money.textContent = "$" + one.run.cost.toFixed(2);
    li.appendChild(money);

    return li;
  }

  function svg(name, into) {
    var made = document.createElementNS("http://www.w3.org/2000/svg", name);

    if (into) { into.appendChild(made); }

    return made;
  }

  function treeOf(run) {
    var nodes = (run.nodes || []).slice();
    var lead = nodes.filter(function (n) { return n.role === "role.project-lead"; })[0];
    var workers = nodes.filter(function (n) { return n !== lead; });

    var wide = Math.max(1, workers.length);
    var width = Math.max(320, wide * 150);
    var height = 190;

    var picture = svg("svg");

    picture.setAttribute("class", "graph");
    picture.setAttribute("viewBox", "0 0 " + width + " " + height);

    /*
      Drawn at its own size rather than stretched to the pane. The viewBox is
      as wide as the tree needs, and width: 100% alone scales that to whatever
      space there is - so a run with one node was blown up four and a half
      times and one with four workers only twice, and two rooms on the same
      screen drew their boxes at visibly different sizes. Capping the width at
      the viewBox keeps every box the same size in every room, and the 100% in
      the stylesheet still shrinks it when the pane is narrower than the tree.
    */
    picture.style.maxWidth = width + "px";
    picture.setAttribute("role", "group");
    picture.setAttribute("aria-label", "Who asked whom in " + (run.room || run.id));

    // The edges first so the boxes sit on top of them.
    workers.forEach(function (worker, i) {
      var line = svg("path", picture);
      var x = (i + 0.5) * (width / wide);

      line.setAttribute("class", "edge" + (worker.state === "working" ? " live" : ""));
      line.setAttribute("d", "M " + (width / 2) + " 62 C " + (width / 2) + " 100, " + x + " 90, " + x + " 118");
    });

    if (lead) { box(picture, lead, width / 2, 20, run); }

    workers.forEach(function (worker, i) {
      box(picture, worker, (i + 0.5) * (width / wide), 118, run);
    });

    return picture;
  }

  function box(picture, node, x, y, run) {
    var link = svg("a", picture);
    var rect = svg("rect", link);
    var stuck = (run.gates || []).some(function (gate) { return gate.node === node.node; });

    link.setAttribute("tabindex", "0");
    link.setAttribute("role", "button");
    link.setAttribute("aria-label", node.node + ", " + node.role.replace(/^role\./, "")
      + ", " + node.state + ", $" + (node.cost || 0).toFixed(2)
      + (stuck ? ", waiting for you" : ""));

    rect.setAttribute("class", "box"
      + (stuck ? " stuck" : node.state === "working" ? " going" : ""));
    rect.setAttribute("x", x - 62);
    rect.setAttribute("y", y);
    rect.setAttribute("width", 124);
    rect.setAttribute("height", 46);
    rect.setAttribute("rx", 4);

    [node.node, node.state + ", $" + (node.cost || 0).toFixed(2)].forEach(function (line, i) {
      var text = svg("text", link);

      text.setAttribute("x", x);
      text.setAttribute("y", y + 19 + (i * 15));
      text.setAttribute("text-anchor", "middle");
      text.textContent = line;
    });

    function open() { watch(run); }

    link.addEventListener("click", open);
    link.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        open();
        event.preventDefault();
      }
    });
  }

  function draw(runs) {
    shown = runs;

    suggest(runs);
    drawRail(runs);

    // Whatever is being followed keeps up whichever view is showing. This
    // lived inside the list, so opening the office froze the detail pane at
    // whatever was true when you left.
    if (watching) {
      var followed = runs.filter(function (one) { return one.id === watching; })[0];

      if (followed) {
        keepUp(followed);
      }
    }

    views[view].draw(runs);
  }

  function drawList(runs) {
    list.textContent = "";

    if (runs.length === 0) {
      say("No team has run on this machine yet.");

      return;
    }

    runs.forEach(function (run) {
      var how = state(run);
      var item = document.createElement("li");
      item.className = "run";

      var name = document.createElement("h3");
      name.textContent = run.team + " - " + run.id;
      item.appendChild(name);

      var line = document.createElement("p");
      line.className = "facts";

      var word = document.createElement("span");
      word.className = "state " + how.css;
      word.textContent = how.word;
      line.appendChild(word);

      var rest = document.createTextNode(
        ". " +
        // Which project it worked on, first, because a machine with several
        // showed a list of runs nothing could attribute. Absent on runs
        // recorded before it was written down.
        (run.project ? run.project + ", " : "") +
        run.autonomy + ", round " + run.rounds +
        (run.roundLimit ? " of " + run.roundLimit : "") +
        ", " + minutes(run.elapsedSeconds) + ", $" + run.cost.toFixed(2) + ". " +
        (run.goal || ""));

      line.appendChild(rest);
      item.appendChild(line);

      if (run.atMostRemainingSeconds) {
        var ceiling = document.createElement("p");
        ceiling.className = "facts";
        ceiling.textContent = "At this rate, up to " + minutes(run.atMostRemainingSeconds) +
          " more if it uses all " + run.roundLimit + " rounds.";
        item.appendChild(ceiling);
      }

      var nodes = document.createElement("ul");
      nodes.className = "nodes";

      run.nodes.forEach(function (node) {
        var row = document.createElement("li");
        var text = node.node + " (" + node.role + "): " + node.state +
          ", " + many(node.turns, "exchange", "exchanges") + ", $" + node.cost.toFixed(2);

        if (node.tookSeconds) {
          text += ", " + minutes(node.tookSeconds);
        }

        row.textContent = text;

        if (node.said) {
          var says = document.createElement("span");
          says.className = "doing";
          says.textContent = " - says: " + node.said;
          row.appendChild(says);
        }

        if (node.doing) {
          var doing = document.createElement("span");
          doing.className = "doing";
          doing.textContent = " - " + node.doing;
          row.appendChild(doing);
        }

        nodes.appendChild(row);
      });

      item.appendChild(nodes);

      var follow = document.createElement("button");
      follow.type = "button";
      follow.textContent = "Follow " + run.id;
      follow.addEventListener("click", function () {
        watch(run);
      });

      item.appendChild(follow);
      list.appendChild(item);
    });

    say(many(runs.length, "run", "runs") + ", updated just now.");
  }

  // What a run has stopped to ask, with the buttons to answer it. Rebuilt
  // whenever the runs are read again, so an answer given anywhere - here, or
  // at a terminal - takes the question off the page.
  // What the gates looked like when they were last drawn, by their ids.
  var gatesShown = null;

  // What the room was called when the heading was last written.
  var roomShown = null;

  // How many exchanges the cost table was built from.
  var turnsShown = -1;

  /*
    The detail pane showing whatever was true when it was opened is a pane that
    lies within four seconds. It follows instead - but only redraws what has
    actually changed, because rebuilding a gate's buttons under somebody who
    has just tabbed to one takes their focus away, every four seconds, for as
    long as the question is open.
  */
  function keepUp(run) {
    opened = run;

    // A run that finishes while somebody is watching it becomes one that can
    // be run again, and the button said otherwise until the pane was opened
    // a second time - the same staleness the heading and the gates had.
    document.getElementById("again").hidden = run.running;

    // A rename lands as a file the next read picks up, and it can be done from
    // a terminal as easily as from here, so the heading follows it rather than
    // holding whatever it said when the run was opened.
    if ((run.room || "") !== roomShown) {
      roomShown = run.room || "";
      heading.textContent = (run.room ? run.room + ": " : "") + "what " + run.id + " is doing";

      var box = document.getElementById("room");

      // Left alone while somebody is typing in it: taking the cursor out of a
      // box every four seconds is worse than showing an old name in one.
      if (document.activeElement !== box) {
        box.value = run.room || "";
      }
    }

    var gates = (run.gates || []).map(function (gate) { return gate.id; }).join("|");

    if (gates !== gatesShown) {
      gatesShown = gates;
      drawGates(run);
    }

    drawWho();

    if (depth === 0 && trailOf) {
      steering();
      showTrail(false);
    }

    // Redrawn every tick rather than only when an exchange lands: what it is
    // costing per minute changes with the clock, and a burn rate that only
    // moves when a node finishes is a burn rate that says nothing while one
    // is running - which is exactly when somebody is reading it.
    if (depth === 1) {
      turnsShown = (run.turns || []).length;
      drawTurns();
    }
  }

  /*
    What answering this actually does, said in the question that asks whether
    to do it.

    Refusing is not one thing. Refusing a permission tells the node no and the
    run carries on - it reports what it needed and why. Refusing a brief or a
    confirmation stops the run, and so does choosing to stop one outright. A
    warning that said "that stops the run" over every refusal was wrong about
    the commonest one of the three, and a warning that is wrong is worse than
    none: it teaches somebody to click past it.
  */
  /*
    One question mark.

    A permission is written without one so that whoever asks can add it - the
    first real run asked somebody "Let it??" and that is why. A lead's own
    question arrives with one already, because it is a sentence somebody wrote,
    and appending another brought the same thing back on a different gate:
    "Should the flag be --since or --from??".

    So the mark is added only where there is not one, rather than the rule
    being remembered at each of the places that ask.
  */
  function asking(question) {
    var said = (question || "").trim();

    return /[?!.]$/.test(said) ? said : said + "?";
  }

  function ends(gate, option) {
    return option === "Stop the run"
      || ((gate.kind === "confirm" || gate.kind === "brief") && option === "no");
  }

  function asks(gate, option, instead) {
    if (instead && option !== "no") {
      return "Send this brief?\n\n" + (instead.value.trim() || "(nothing)");
    }

    if (ends(gate, option)) {
      return "Answer \u201c" + asking(gate.question) + "\u201d with \u201c" + option
        + "\u201d? That stops the run.";
    }

    if (gate.kind === "permission" && option === "no") {
      return "Refuse \u201c" + asking(gate.question) + "\u201d "
        + gate.node + " is told no and carries on without it.";
    }

    return "Answer \u201c" + asking(gate.question) + "\u201d with \u201c" + option + "\u201d?";
  }

  function drawGates(run) {
    var box = document.getElementById("gates");
    box.textContent = "";

    (run.gates || []).forEach(function (gate) {
      var card = document.createElement("div");
      card.className = "gate";

      var asked = document.createElement("p");
      asked.className = "asked";
      asked.textContent = asking(gate.question);
      card.appendChild(asked);

      /*
        A brief is the one question with a third answer. The lead wrote that
        task and can be wrong about it in a way that is obvious from here and
        expensive to find out any other way - the worker goes off and does the
        wrong thing, competently, for ten minutes. Yes and no would make
        somebody choose between the wrong brief and no brief.
      */
      var instead = null;

      if (gate.kind === "brief") {
        var label = document.createElement("label");

        label.className = "said";
        label.htmlFor = "instead-" + gate.id;
        label.textContent = "The brief it would be sent. Change it if it is wrong.";
        card.appendChild(label);

        instead = document.createElement("textarea");

        instead.id = "instead-" + gate.id;
        instead.rows = 3;
        instead.value = gate.recommendation || "";
        card.appendChild(instead);
      } else if (gate.recommendation) {
        var hint = document.createElement("p");
        hint.className = "doing";
        hint.textContent = "The lead recommends: " + gate.recommendation;
        card.appendChild(hint);
      }

      (gate.options || ["yes", "no"]).forEach(function (option) {
        var button = document.createElement("button");
        button.type = "button";
        button.textContent = option;

        button.addEventListener("click", function () {
          // The second confirmation, and the reason it exists: the token got
