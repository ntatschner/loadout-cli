    actually changed, because rebuilding a gate's buttons under somebody who
    has just tabbed to one takes their focus away, every four seconds, for as
    long as the question is open.
  */
  function keepUp(run) {
    opened = run;

    // A run that finishes while somebody is watching it becomes one that can
    // be run again, and the button said otherwise until the pane was opened
    // a second time - the same staleness the heading and the gates had.
    document.getElementById("again").hidden = run.running;

    // A rename lands as a file the next read picks up, and it can be done from
    // a terminal as easily as from here, so the heading follows it rather than
    // holding whatever it said when the run was opened.
    if ((run.room || "") !== roomShown) {
      roomShown = run.room || "";
      // What it is called, then what it is. The identifier is on the card that
      // opened this and in the address bar; a heading is read, not copied.
      heading.textContent = (run.room || run.id) + ": what it is doing";

      var box = document.getElementById("room");

      // Left alone while somebody is typing in it: taking the cursor out of a
      // box every four seconds is worse than showing an old name in one.
      if (document.activeElement !== box) {
        box.value = run.room || "";
      }
    }

    var gates = (run.gates || []).map(function (gate) { return gate.id; }).join("|");

    if (gates !== gatesShown) {
      gatesShown = gates;
      drawGates(run);
    }

    drawWho();

    if (depth === 0 && trailOf) {
      steering();
      showTrail(false);
    }

    // Redrawn every tick rather than only when an exchange lands: what it is
    // costing per minute changes with the clock, and a burn rate that only
    // moves when a node finishes is a burn rate that says nothing while one
    // is running - which is exactly when somebody is reading it.
    if (depth === 1) {
      turnsShown = (run.turns || []).length;
      drawTurns();
    }
  }

  /*
    What answering this actually does, said in the question that asks whether
    to do it.

    Refusing is not one thing. Refusing a permission tells the node no and the
    run carries on - it reports what it needed and why. Refusing a brief or a
    confirmation stops the run, and so does choosing to stop one outright. A
    warning that said "that stops the run" over every refusal was wrong about
    the commonest one of the three, and a warning that is wrong is worse than
    none: it teaches somebody to click past it.
  */
  /*
    One question mark.

    A permission is written without one so that whoever asks can add it - the
    first real run asked somebody "Let it??" and that is why. A lead's own
    question arrives with one already, because it is a sentence somebody wrote,
    and appending another brought the same thing back on a different gate:
    "Should the flag be --since or --from??".

    So the mark is added only where there is not one, rather than the rule
    being remembered at each of the places that ask.
  */
  function asking(question) {
    var said = (question || "").trim();

    return /[?!.]$/.test(said) ? said : said + "?";
  }

  function ends(gate, option) {
    return option === "Stop the run"
      || ((gate.kind === "confirm" || gate.kind === "brief") && option === "no");
  }

  function asks(gate, option, instead) {
    if (instead && option !== "no") {
      return "Send this brief?\n\n" + (instead.value.trim() || "(nothing)");
    }

    if (ends(gate, option)) {
      return "Answer \u201c" + asking(gate.question) + "\u201d with \u201c" + option
        + "\u201d? That stops the run.";
    }

    if (gate.kind === "permission" && option === "no") {
      return "Refuse \u201c" + asking(gate.question) + "\u201d "
        + gate.node + " is told no and carries on without it.";
    }

    return "Answer \u201c" + asking(gate.question) + "\u201d with \u201c" + option + "\u201d?";
  }

  function drawGates(run) {
    var box = document.getElementById("gates");
    box.textContent = "";

    (run.gates || []).forEach(function (gate) {
      var card = document.createElement("div");
      card.className = "gate";

      var asked = document.createElement("p");
      asked.className = "asked";
      asked.textContent = asking(gate.question);
      card.appendChild(asked);

      /*
        A brief is the one question with a third answer. The lead wrote that
        task and can be wrong about it in a way that is obvious from here and
        expensive to find out any other way - the worker goes off and does the
        wrong thing, competently, for ten minutes. Yes and no would make
        somebody choose between the wrong brief and no brief.
      */
      var instead = null;

      if (gate.kind === "brief") {
        var label = document.createElement("label");

        label.className = "said";
        label.htmlFor = "instead-" + gate.id;
        label.textContent = "The brief it would be sent. Change it if it is wrong.";
        card.appendChild(label);

        instead = document.createElement("textarea");

        instead.id = "instead-" + gate.id;
        instead.rows = 3;
        instead.value = gate.recommendation || "";
        card.appendChild(instead);
      } else if (gate.recommendation) {
        var hint = document.createElement("p");
        hint.className = "doing";
        hint.textContent = "The lead recommends: " + gate.recommendation;
        card.appendChild(hint);
      }

      (gate.options || ["yes", "no"]).forEach(function (option) {
        var button = document.createElement("button");
        button.type = "button";
        button.textContent = option;

        button.addEventListener("click", function () {
          // The second confirmation, and the reason it exists: the token got
          // somebody to this page, and answering a gate spends money or
          // changes a repository. It names what is being agreed to.
          if (!window.confirm(asks(gate, option, instead))) {
            return;
          }

          button.disabled = true;

          var changed = instead && instead.value.trim() !== (gate.recommendation || "").trim()
            ? instead.value.trim()
            : null;

          act(run.id, "gates", { gate: gate.id, answer: option, instead: changed })
            .then(function () {
              announce("Told " + run.id + ": " + option + ".");
              card.remove();
            })
            .catch(function (e) {
              button.disabled = false;
              announce("That did not go through: " + e.message);
            });
        });

        card.appendChild(button);
      });

      box.appendChild(card);
    });
  }

  function wire(run) {
    document.getElementById("pause").onclick = function () {
      act(run.id, "pause", {}).then(function () { announce(run.id + " holds before its next round."); })
        .catch(function (e) { announce(e.message); });
    };

    document.getElementById("resume").onclick = function () {
      act(run.id, "resume", {}).then(function () { announce(run.id + " carries on."); })
        .catch(function (e) { announce(e.message); });
    };

    document.getElementById("stop").onclick = function () {
      // Named in the question, because "stop" is the one nobody can undo.
      if (!window.confirm("Stop " + run.id + " after the round it is in?")) { return; }

      act(run.id, "stop", {})
        .then(function () { announce(run.id + " ends when its current round comes back."); })
        .catch(function (e) { announce(e.message); });
    };

    var room = document.getElementById("room");

    // Filled in from what it is called now, so renaming starts from the name
    // rather than from nothing, and emptying the box is visibly the way to
    // put the worked-out one back.
    room.value = run.room || "";

    document.getElementById("rename").onclick = function () {
        var wanted = room.value.trim();

        act(run.id, "name", { room: wanted })
          .then(function () {
            announce(wanted
              ? "That run is " + wanted + " now."
              : "That run goes back to the name it was given.");
          })
          .catch(function (e) { announce(e.message); });
      };

    /*
      A fresh run of the same thing, with the earlier one still readable - which
      is what re-running means and is the whole reason a finished run is kept.

      It fills the form rather than starting anything, because a run that has
      been run before is exactly the one somebody wants to change one thing
      about before running again.
    */
    var again = document.getElementById("again");

    again.hidden = run.running;

    again.onclick = function () {
      document.getElementById("start-team").value = run.team || "";
      document.getElementById("start-goal").value = run.goal || "";
      document.getElementById("start-project").value = run.project || "";
      document.getElementById("start-rounds").value = run.roundLimit || "";
      document.getElementById("start-autonomy").value = run.autonomy || "";

      var form = document.querySelector(".start");

      form.open = true;

      // Moved to, so somebody reading with the keyboard is at the thing that
      // just filled itself in rather than being told about it.
      document.getElementById("start-goal").focus();

      announce("Filled in from " + (run.room || run.id) + ". Change what you want and start it.");
    };

    document.getElementById("send").onclick = function () {
      var box = document.getElementById("say");

      if (!box.value.trim()) { return; }

      act(run.id, "message", { message: box.value.trim() })
        .then(function () {
          announce("The lead reads that at the start of its next round.");
          box.value = "";
        })
        .catch(function (e) { announce(e.message); });
    };
  }

  // The last line drawn, so a line that repeats becomes a count rather than
  // another row.
  var lastLine = null;
  var lastSaid = null;
  var lastSame = 1;

  /*
    Three depths of one run, in the order somebody reaches for them: what it
    said, then what that cost, then the papers it was working from. LangSmith
    splits a trace the same way and for the same reason - the trajectory is
    what you read, the numbers are what you check, and the raw documents are
    where you go when neither explains it.
  */
  var depths = [
    { tab: "tab-messages", panel: "depth-messages" },
    { tab: "tab-turns", panel: "depth-turns" },
    { tab: "tab-papers", panel: "depth-papers" },
    { tab: "tab-changes", panel: "depth-changes" }
  ];

  var depth = 0;

  // Whose account of the run is being shown: null for the run's own journal,
  // which is deliberately thin, or a node for everything that node did.
  var trailOf = null;

  /*
    A node somebody asked for from outside the detail pane, waiting for the
    buttons to exist.

    The list can open a run, and the buttons that choose whose account to show
    are built by the next refresh rather than by the click. So the wish is
    written down here and the builder honours it, which keeps one place
    deciding what a press does - rather than the list reaching into the detail
    and doing half of it itself.
  */
  var wanted = null;

  // How many of that node's steps are already on the page. Asking again every
  // few seconds and being sent the same two thousand steps is most of a
  // megabyte a minute to say nothing.
  var trailHas = 0;

  /*
    The second credential, held for as long as the daemon says and never
    written anywhere. The token in the address got somebody to this page, which
    is for watching and deciding; putting words into a process that is running
    with somebody's file access, at a moment nobody chose, is a separate grant.

    In a variable rather than in storage on purpose: it is for a person at a
    page, and when the page goes it should go with it.
  */
  var grant = null;

  function attached() {
    if (grant) { return Promise.resolve(grant); }

    var said = window.prompt(
      "Typing at a running node needs the attach passphrase. "
      + "The token that got you here is for watching and deciding.");

    if (!said) { return Promise.reject(new Error("Nothing was typed at anything.")); }

    return fetch("/api/attach?token=" + encodeURIComponent(token), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ passphrase: said })
    }).then(function (answer) {
      return answer.text().then(function (body) {
        var read = null;

        try {
          read = JSON.parse(body);
        } catch (e) {
          read = null;
        }

        if (!answer.ok || !read || !read.grant) {
          throw new Error((read && read.error) || "That was not accepted.");
        }

        grant = read.grant;

        announce("Attached. That lasts " + read.minutes + " minutes.");

        return grant;
      });
    });
  }

  function showDepth(which, move) {
    depth = which;

    depths.forEach(function (one, i) {
      var tab = document.getElementById(one.tab);
      var panel = document.getElementById(one.panel);

      tab.setAttribute("aria-selected", i === which ? "true" : "false");

      // One stop in the tab order for the whole strip, and the arrow keys
      // move within it. Three tabs are three stops otherwise, on the way to
      // everything below them.
      tab.tabIndex = i === which ? 0 : -1;
      panel.hidden = i !== which;
    });

    if (move) {
      document.getElementById(depths[which].tab).focus();
    }

    if (which === 1) {
      turnsShown = (opened && opened.turns ? opened.turns.length : 0);
      drawTurns();
    }

    if (which === 2) { drawPapers(); }
    if (which === 3) { drawChanges(); }
  }

  function money(amount) {
    return "$" + (Math.round((amount || 0) * 100) / 100).toFixed(2);
  }

  // The third argument shades a column of figures, not the money() above it.
  function cell(row, text, figures) {
    var td = document.createElement("td");

    td.textContent = text;

    if (figures) { td.className = "money"; }

    row.appendChild(td);

    return td;
  }

  function figure(into, name, value, over) {
    var box = document.createElement("div");
    var what = document.createElement("dt");
    var much = document.createElement("dd");

    box.className = "figure" + (over ? " over" : "");
    what.textContent = name;
    much.textContent = value;

    box.appendChild(what);
    box.appendChild(much);
    into.appendChild(box);
  }

  /*
    Bars drawn in the page rather than as a picture. No canvas and no library:
    a screen reader reads the row, which says the name and the number, and a
    bar that is only a width adds nothing for it to get wrong.
  */
  function bars(into, rows) {
    var most = rows.reduce(function (top, row) { return Math.max(top, row.amount); }, 0) || 1;
    var list = document.createElement("ul");

    list.className = "bars";

    rows.forEach(function (row) {
      var li = document.createElement("li");
      var name = document.createElement("span");
      var bar = document.createElement("span");
      var amount = document.createElement("span");

      name.className = "name";
      name.textContent = row.name;

      bar.className = "bar";
      bar.style.width = Math.max(2, Math.round((row.amount / most) * 60)) + "%";
      bar.setAttribute("aria-hidden", "true");

      amount.className = "amount";
      amount.textContent = row.said;

      li.appendChild(name);
      li.appendChild(bar);
      li.appendChild(amount);
      list.appendChild(li);
    });

    into.appendChild(list);
  }

  // One of a thing is not one things. Every count on this page goes through
  // here, because "1 tool calls refused" is the sort of thing that makes
  // somebody trust the rest of the numbers a little less.
  function many(count, one, more) {
    return count + " " + (count === 1 ? one : more);
  }

  function spell(seconds) {
    if (seconds < 60) { return seconds + "s"; }

    var m = Math.floor(seconds / 60);

    return m < 60 ? m + "m" : Math.floor(m / 60) + "h " + (m % 60) + "m";
  }

  function drawNumbers(panel) {
    var numbers = opened && opened.numbers;

    if (!numbers) { return; }

    var figures = document.createElement("dl");

    figures.className = "figures";

    figure(figures, "spent", "$" + numbers.money.spent.toFixed(2));
    figure(figures, "burning", numbers.money.rate);

    if (numbers.money.projected !== null && numbers.money.projected !== undefined) {
      figure(figures, "if it uses every round",
        "$" + numbers.money.projected.toFixed(2), numbers.money.overrunning);
    }

    if (numbers.money.budget !== null && numbers.money.budget !== undefined) {
      figure(figures, "budget", "$" + numbers.money.budget.toFixed(2), numbers.money.overrunning);
    }

    panel.appendChild(figures);

    if (numbers.money.overrunning) {
      var warned = document.createElement("p");

      warned.className = "said";
      warned.textContent = "At this rate it goes past what the team said it may spend.";
      panel.appendChild(warned);
    }

    // Where the time went, by round and then by node. The round narrows it
    // down; the node says which one to look at.
    if (numbers.rounds.length) {
      var byRound = document.createElement("h3");

      byRound.textContent = "Where the time went";
      panel.appendChild(byRound);

      bars(panel, numbers.rounds.map(function (round) {
        return {
          name: "round " + round.round + (round.running ? " (going)" : ""),
          amount: round.seconds,
          said: spell(round.seconds)
        };
      }));
    }

    if (numbers.nodes.length) {
      bars(panel, numbers.nodes.map(function (node) {
        return { name: node.node, amount: node.seconds, said: spell(node.seconds) };
      }));
    }

    drawSpent(panel);

    if (numbers.trouble.any) {
      var went = document.createElement("h3");

      went.textContent = "What went wrong";
      panel.appendChild(went);

      var said = [];

      if (numbers.trouble.denials) {
        said.push(many(numbers.trouble.denials, "tool call refused", "tool calls refused"));
      }

      if (numbers.trouble.rejected) {
        said.push(many(numbers.trouble.rejected, "report not accepted", "reports not accepted"));
      }

      if (numbers.trouble.retried) {
        said.push(many(numbers.trouble.retried, "turn asked again", "turns asked again"));
      }

      if (numbers.trouble.quietRounds) {
        said.push(many(numbers.trouble.quietRounds, "round asked for nothing", "rounds asked for nothing"));
      }

      if (numbers.trouble.conflicts) {
        said.push(many(numbers.trouble.conflicts, "branch would not merge", "branches would not merge"));
      }

      var line = document.createElement("p");

      line.className = "facts";
      line.textContent = said.join(", ") + ".";
      panel.appendChild(line);
    }
  }

  // Which run's time split is on screen, so reading every node's whole stream
  // happens when somebody opens this and not four times a minute.
  var spentShown = null;

  // When it was last asked, whether one is in flight, and what came back.
  var spentAt = 0;
  var spentAsking = false;
  var lastSpent = [];

  /*
    Where each node's time went, from the gaps between the things it did. Each
    gap is put down to whatever ended it: one ending in a tool call is the
    model deciding to make it, one ending in a tool's answer is that tool
    running, one ending in the node saying something is the model writing it.

    An account of when things arrived rather than of what a model was doing,
    and the difference is worth saying rather than glossing - which is why the
    heading says "roughly".
  */
  function drawSpent(panel) {
    if (!opened) { return; }

    var box = document.createElement("div");

    box.id = "spent";
    panel.appendChild(box);

    box.appendChild(spentFor(lastSpent));

    /*
      Asked again while the run is going, because the answer changes as the
      node works - it fetched once and then never again, so the split sat
      frozen beside a burn rate that kept moving, which is the pane lying in
      the way this page has already been caught doing once.

      Not every tick: answering it means reading every node's whole stream. And
      not while one is already in flight, or a slow answer on a big run would
      pile requests up behind itself.
    */
    var now = Date.now();

    if (spentAsking || (spentShown === opened.id && (!opened.running || now - spentAt < 20000))) {
      return;
    }

    var id = opened.id;

    spentAsking = true;

    api("/api/runs/" + encodeURIComponent(id) + "/spent")
      .then(function (got) {
        spentAsking = false;

        if (!opened || opened.id !== id) { return; }

        spentShown = id;
        spentAt = Date.now();
        lastSpent = got.nodes;

        var into = document.getElementById("spent");

        if (into) {
          into.textContent = "";
          into.appendChild(spentFor(got.nodes));
        }
      })
      .catch(function () {
        // Runs from before a node kept a stream have none, which is ordinary
        // rather than worth a line of its own.
        spentAsking = false;
        spentShown = id;
        spentAt = Date.now();
        lastSpent = [];
      });
  }

  function spentFor(nodes) {
    var box = document.createElement("div");

    if (!nodes || !nodes.length) { return box; }

    var heading = document.createElement("h3");

    heading.textContent = "Roughly where each node's time went";
    box.appendChild(heading);

    nodes.forEach(function (node) {
      var name = document.createElement("p");

      name.className = "facts";
      name.textContent = node.node;
      box.appendChild(name);

      bars(box, [
        { name: "deciding", amount: node.thinking, said: spell(node.thinking) },
        { name: "tools running", amount: node.tools, said: spell(node.tools) },
        { name: "writing", amount: node.writing, said: spell(node.writing) },
        { name: "waiting", amount: node.idle, said: spell(node.idle) }
      ].filter(function (row) { return row.amount > 0; }));
    });

    var note = document.createElement("p");

    note.className = "facts";
    note.textContent = "From when things arrived rather than from what the model was doing: "
      + "deciding includes the time an answer took to arrive, and gaps longer than two "
      + "minutes are counted as waiting rather than as any of the others.";

    box.appendChild(note);

    return box;
  }

  function drawTurns() {
    var panel = document.getElementById("depth-turns");

    panel.textContent = "";

    drawNumbers(panel);

    var turns = (opened && opened.turns) || [];

    if (!turns.length) {
      var none = document.createElement("p");

      none.textContent = opened && opened.running
        ? "Nothing has come back yet."
        : "This run recorded no exchanges.";

      panel.appendChild(none);

      return;
    }

    var table = document.createElement("table");

    table.className = "turns";

    var caption = document.createElement("caption");
    var spent = turns.reduce(function (sum, turn) { return sum + (turn.cost || 0); }, 0);

    caption.textContent = many(turns.length, "exchange", "exchanges") + ", " + money(spent) + " in all";

    table.appendChild(caption);

    var head = document.createElement("tr");

    ["Round", "Node", "Model", "Messages", "Refused", "Cost", "Came back as"]
      .forEach(function (name, i) {
        var th = document.createElement("th");

        th.scope = "col";
        th.textContent = name;

        if (i === 5) { th.className = "money"; }

        head.appendChild(th);
      });

    var headRow = document.createElement("thead");

    headRow.appendChild(head);
    table.appendChild(headRow);

    var body = document.createElement("tbody");

    turns.forEach(function (turn) {
      var row = document.createElement("tr");
      var about = (opened.nodes || []).filter(function (n) { return n.node === turn.node; })[0];

      cell(row, turn.round || "-");
      cell(row, turn.node + (turn.attempt > 1 ? " (try " + turn.attempt + ")" : ""));

      // Null is a real answer here and not a missing one: it means whatever
      // the agent picks for itself.
      cell(row, (about && about.model) || "its own choice");
      cell(row, turn.exchanges);
      cell(row, turn.denials || "");
      cell(row, money(turn.cost), true);

      cell(row, !turn.completed
        ? "did not finish"
        : (turn.outcome ? turn.outcome + ", said " + turn.status : "no report read"));

      body.appendChild(row);
    });

    table.appendChild(body);
    panel.appendChild(table);
  }

  function size(bytes) {
    return bytes < 1024
      ? bytes + " bytes"
      : Math.round(bytes / 1024) + "k";
  }

  // These are all JSON and all written on one line, which is unreadable in a
  // box. Indented if it parses, and left exactly as it came if it does not -
  // a document that will not parse is the one most worth seeing verbatim.
  function laidOut(text) {
    try {
      return JSON.stringify(JSON.parse(text), null, 2);
    } catch (e) {
      return text;
    }
  }

  function drawPapers() {
    var panel = document.getElementById("depth-papers");

    if (!opened) { return; }

    // Only when the run changes. Redrawing this every four seconds would take
    // the selection away from whoever is reading one.
    if (panel.getAttribute("data-run") === opened.id) { return; }

    panel.setAttribute("data-run", opened.id);
    panel.textContent = "";

    var waiting = document.createElement("p");

    waiting.textContent = "Reading what this run wrote down...";
    panel.appendChild(waiting);

    var id = opened.id;

    api("/api/runs/" + encodeURIComponent(id) + "/documents")
      .then(function (answer) {
        if (panel.getAttribute("data-run") !== id) { return; }

        panel.textContent = "";

        var papers = answer.documents || [];

        if (!papers.length) {
          var none = document.createElement("p");

          none.textContent = "This run wrote nothing beside its journal.";
          panel.appendChild(none);

          return;
        }

        var choices = document.createElement("ul");

        choices.className = "papers";

        var shown = document.createElement("pre");

        shown.className = "paper";
        shown.tabIndex = 0;
        shown.textContent = "Pick one to read it.";

        papers.forEach(function (paper) {
          var li = document.createElement("li");
          var open = document.createElement("button");

          open.type = "button";
          open.setAttribute("aria-pressed", "false");
          open.setAttribute("aria-controls", "paper-shown");
          open.textContent = paper.kind + ": " + paper.subject + " (" + size(paper.bytes) + ")";

          open.addEventListener("click", function () {
            choices.querySelectorAll("button").forEach(function (other) {
              other.setAttribute("aria-pressed", other === open ? "true" : "false");
            });

            shown.textContent = "Reading " + paper.name + "...";

            api("/api/runs/" + encodeURIComponent(id) + "/documents/"
              + encodeURIComponent(paper.name))
              .then(function (got) { shown.textContent = laidOut(got.text); })
              .catch(function (wrong) { shown.textContent = wrong.message; });
          });

          li.appendChild(open);
          choices.appendChild(li);
        });

        shown.id = "paper-shown";

        panel.appendChild(choices);
        panel.appendChild(shown);
      })
      .catch(function (wrong) {
        panel.textContent = wrong.message;
      });
  }

  /*
    A report says "added the flag and a test for it". The patch says what was
    added, and those are not always the same thing. This is the last of three
    answers about a node - what it was told, what it said, and what it did -
    and the only one nothing can argue with.
  */
  /*
    Two resolutions of the same question. The run's journal is one line every
    few seconds with repeats dropped, which is what somebody watching wants;
    a node's own stream is every tool it called and everything it said, which
    is what somebody working out where it went wrong wants. Both are "what it
    said", so both live here rather than in two tabs that sound the same.
  */
  function drawWho() {
    var box = document.getElementById("who");

    if (!opened) { return; }

    var names = ["the run"].concat((opened.nodes || []).map(function (n) { return n.node; }));

    // Rebuilt only when the cast changes, so a click does not land on a
    // button that was replaced between the press and the release.
    if (box.getAttribute("data-who") === names.join("|")) { return; }

    box.setAttribute("data-who", names.join("|"));
    box.textContent = "";

    names.forEach(function (name, i) {
      var li = document.createElement("li");
      var pick = document.createElement("button");
      var node = i === 0 ? null : name;

      pick.type = "button";

      // The person, with the handle beside it. "implementer/1" is the same
      // string in every room on the machine; the name points at one node of
      // one run, which is what somebody says out loud.
      var whose = i === 0
        ? null
        : (opened.nodes || []).filter(function (n) { return n.node === name; })[0];

      pick.textContent = whose ? who(whose) : name;

      if (whose) {
        pick.appendChild(document.createTextNode(" "));
        reference(name, pick);
      }
      pick.setAttribute("aria-pressed", trailOf === node ? "true" : "false");
      pick.setAttribute("aria-controls", "log");

      pick.addEventListener("click", function () {
        trailOf = node;

        box.querySelectorAll("button").forEach(function (other) {
          other.setAttribute("aria-pressed", other === pick ? "true" : "false");
        });

        log.textContent = "";
        lastLine = null;
        lastSaid = null;
        trailHas = 0;

        steering();

        if (node) {
          showTrail(true);
        } else {
          // Opened again rather than simply switched back to: the events
          // already delivered are gone, and on a run that has finished
          // nothing more is coming, so the box would stay empty for ever.
          follow(opened);
          say("Following " + opened.id + " again, from the top.");
        }
      });

      li.appendChild(pick);
      box.appendChild(li);

      // What somebody asked for from the list, now that there is a button to
      // press. Cleared first, so a rebuild between the click and this does
      // not press it again under them.
      if (node && node === wanted) {
        wanted = null;
        pick.click();
      }
    });
  }

  /*
    Typing at the node whose stream is open. Only there: this is the view that
    shows what a node is doing right now, which is the only moment at which
    saying something to it rather than to the lead makes any sense.
  */
  function steering() {
    var box = document.getElementById("steer");
    var alive = opened && opened.running && trailOf
      && (opened.nodes || []).some(function (node) {
        return node.node === trailOf && node.state !== "done" && node.state !== "reported";
      });

    box.hidden = !alive;
  }

  (function () {
    var send = document.getElementById("steer-send");

    send.addEventListener("click", function () {
      var box = document.getElementById("steer-said");
      var message = box.value.trim();

      if (!message || !trailOf || !opened) { return; }

      var node = trailOf;
      var id = opened.id;

      send.disabled = true;

      attached()
        .then(function (held) {
          return fetch("/api/runs/" + encodeURIComponent(id) + "/say?token="
            + encodeURIComponent(token), {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Loadout-Attach": held },
            body: JSON.stringify({ node: node, message: message })
          }).then(function (answer) {
            return answer.text().then(function (body) {
              if (!answer.ok) {
                // A grant that has run out is the ordinary case, and asking
                // again is what somebody wants rather than being told off.
                if (answer.status === 403) { grant = null; }

                throw new Error(body || ("The dashboard answered " + answer.status + "."));
              }

              box.value = "";
              announce(node + " hears that the next time it says anything.");
            });
          });
        })
        .catch(function (wrong) { announce(wrong.message); })
        .then(function () { send.disabled = false; });
    });
  }());

  function showTrail(fresh) {
    if (!opened || !trailOf) { return; }

    var id = opened.id;
    var node = trailOf;

    if (fresh) {
      log.textContent = "Reading everything " + node + " did...";
    }

    api("/api/runs/" + encodeURIComponent(id) + "/stream/" + encodeURIComponent(node)
      + "?after=" + trailHas)
      .then(function (got) {
        // Somebody may have picked a different one while this was in flight.
        if (opened.id !== id || trailOf !== node) { return; }

        if (fresh) {
          log.textContent = "";
        }

        // A total below what is already shown means the file was replaced
        // rather than added to, so what is on the page is not part of it.
        if (got.total < trailHas) {
          log.textContent = "";
          trailHas = 0;
        }

        trailHas = got.total;

        if (!got.steps.length) {
          if (fresh) {
            log.textContent = node + " recorded no steps.";
          }

          return;
        }

        got.steps.forEach(function (step) {
          var line = document.createElement("p");

          line.textContent = clock(step.at) + "  " + step.kind
            + (step.sub ? " (subagent)" : "")
            + "  " + [step.tool, step.target, step.text].filter(Boolean).join(" ");

          log.appendChild(line);
        });

        log.scrollTop = log.scrollHeight;
      })
      .catch(function (wrong) {
        log.textContent = wrong.message;
      });
  }

  function clock(at) {
    try {
      return new Date(at).toTimeString().slice(0, 8);
    } catch (e) {
      return "";
    }
  }

  function drawChanges() {
    var panel = document.getElementById("depth-changes");

    if (!opened) { return; }

    // Only when the run changes, like the papers: redrawing every four
    // seconds would take the patch away from whoever is reading it.
    if (panel.getAttribute("data-run") === opened.id) { return; }

    panel.setAttribute("data-run", opened.id);
    panel.textContent = "";

    var working = (opened.nodes || []).filter(function (node) { return node.branch; });

    if (!working.length) {
      var none = document.createElement("p");

      none.textContent = "No node in this run worked on a branch of its own.";
      panel.appendChild(none);

      return;
    }

    var choices = document.createElement("ul");

    choices.className = "papers";

    var stat = document.createElement("p");

    stat.className = "stat";

    var shown = document.createElement("pre");

    shown.className = "paper";
    shown.id = "patch-shown";
    shown.tabIndex = 0;
    shown.textContent = "Pick a node to see what it changed.";

    var id = opened.id;

    working.forEach(function (node) {
      var li = document.createElement("li");
      var open = document.createElement("button");

      open.type = "button";
      open.setAttribute("aria-pressed", "false");
      open.setAttribute("aria-controls", "patch-shown");
      open.textContent = node.node + " on " + node.branch
        + (merged(node.branch) ? " (merged)" : "");

      open.addEventListener("click", function () {
        choices.querySelectorAll("button").forEach(function (other) {
          other.setAttribute("aria-pressed", other === open ? "true" : "false");
        });

        stat.textContent = "";
        shown.textContent = "Reading what " + node.node + " changed...";

        api("/api/runs/" + encodeURIComponent(id) + "/diff/" + encodeURIComponent(node.node))
          .then(function (got) {
            stat.textContent = tidy(got.summary).trim() || "It changed nothing.";
            paint(shown, tidy(got.patch));
          })
          .catch(function (wrong) {
            stat.textContent = "";
            shown.textContent = wrong.message;
          });
      });

      li.appendChild(open);

      // Beside the diff rather than anywhere else, because the thing somebody
      // does after reading a diff is publish it - and this is the one button
      // here that pushes to a remote, so it asks first and names the branch.
      var pr = document.createElement("button");

      pr.type = "button";
      pr.textContent = "Open a pull request";

      pr.addEventListener("click", function () {
        if (!window.confirm("Push " + node.branch
          + " to origin and open a pull request for what " + node.node + " did?")) {
          return;
        }

        pr.disabled = true;

        act(id, "pr", { node: node.node })
          .then(function () {
            pr.disabled = false;
            announce("Pushed " + node.branch + " and opened a pull request.");
          })
          .catch(function (e) {
            pr.disabled = false;
            announce(e.message);
          });
      });

      li.appendChild(pr);
      choices.appendChild(li);
    });

    panel.appendChild(choices);
    panel.appendChild(stat);
    panel.appendChild(shown);
  }

  function merged(branch) {
    return ((opened && opened.merged) || []).indexOf(branch) >= 0;
  }

  // Whatever joined these lines did it the way this machine writes them, and
  // a carriage return at the end of every row is not part of anybody's diff.
  function tidy(text) {
    return (text || "").replace(/\r\n/g, "\n");
  }

  // One span per line, so a patch reads as a patch. The + and - are left on
  // the line rather than replaced by the colour: they are what says which is
  // which when there is no colour to see.
  function paint(into, patch) {
    into.textContent = "";

    if (!patch || !patch.trim()) {
      into.textContent = "It changed nothing.";

      return;
    }

    // Split on the newline and drop whatever carriage return is left: what
    // reads the patch back joins its lines the way this machine writes
    // them, and a stray return at the end of every row is not part of
    // anybody's diff.
    patch.split("\n").forEach(function (whole) {
      var line = whole.replace(/\r$/, "");
      var row = document.createElement("span");

      if (line.indexOf("@@") === 0) {
        row.className = "hunk";
      } else if (line.indexOf("+") === 0 && line.indexOf("+++") !== 0) {
        row.className = "add";
      } else if (line.indexOf("-") === 0 && line.indexOf("---") !== 0) {
        row.className = "drop";
      }

      row.textContent = line + "\n";
      into.appendChild(row);
    });
  }

  (function () {
    var strip = document.querySelector(".depths");

    depths.forEach(function (one, i) {
      document.getElementById(one.tab).addEventListener("click", function () {
        showDepth(i, false);
      });
    });

    strip.addEventListener("keydown", function (event) {
      var step = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0;

      if (step) {
        showDepth((depth + step + depths.length) % depths.length, true);
        event.preventDefault();
      } else if (event.key === "Home") {
        showDepth(0, true);
        event.preventDefault();
      } else if (event.key === "End") {
        showDepth(depths.length - 1, true);
        event.preventDefault();
      }
    });

    // The numbers, from anywhere on the page. Not while somebody is typing in
    // the box that sends a message to the lead, and not while a modifier is
    // held, because those are the browser's own shortcuts.
    document.addEventListener("keydown", function (event) {
      if (event.altKey || event.ctrlKey || event.metaKey) { return; }

      var on = event.target;

      if (on && (on.tagName === "INPUT" || on.tagName === "TEXTAREA" || on.isContentEditable)) {
        return;
      }

      var which = ["1", "2", "3", "4"].indexOf(event.key);

      if (which < 0 || detail.hidden) { return; }

      showDepth(which, true);
      event.preventDefault();
    });
  }());

  function watch(run) {
    watching = run.id;
    opened = run;
    roomShown = null;
    spentShown = null;
    spentAt = 0;
    lastSpent = [];

    showDepth(depth, false);
    // What it is called, then what it is. The identifier is on the card that
      // opened this and in the address bar; a heading is read, not copied.
      heading.textContent = (run.room || run.id) + ": what it is doing";
    detail.hidden = false;

    gatesShown = null;
    turnsShown = -1;
    trailOf = null;

    document.getElementById("steer").hidden = true;
    document.getElementById("who").removeAttribute("data-who");

    drawGates(run);
    wire(run);

    follow(run);

    // Moved to, so somebody reading with the keyboard is where the new
    // content is rather than being told about it and left at the top.
    heading.setAttribute("tabindex", "-1");
    heading.focus();
  }

  /*
    Opens, or re-opens, the run's own journal. Re-opening matters: the events
    already delivered are gone once the box is cleared, and on a run that has
    finished nothing more is coming, so anybody who looked at a node's own
    stream and came back would find an empty box for ever.
  */
  function follow(run) {
    if (stream) {
      stream.close();
    }

    log.textContent = "";
    lastLine = null;
    lastSaid = null;
    lastSame = 1;

    stream = new EventSource("/api/runs/" + encodeURIComponent(run.id) +
      "/events?token=" + encodeURIComponent(token));

    stream.addEventListener("line", function (message) {
      var entry = JSON.parse(message.data);

      // The same line over and over is one line and a count. A node reading
      // forty files writes forty rows that differ only in a path, and they
      // push everything that mattered off the top of the box.
      //
      // Compared on what it says and who said it, never on the rendered
      // line: that carries the clock in front of it, which is different
      // every time, so the first attempt at this collapsed nothing at all.
      // A node's own stream is in the box instead, so the run's journal has
      // nowhere to go and would be interleaved into somebody else's account.
      if (trailOf) {
        return;
      }

      var same = JSON.stringify([entry.node, entry.kind, entry.what || entry.said]);

      if (same === lastSaid && lastLine) {
        lastSame += 1;

        var badge = lastLine.querySelector(".again");

        if (!badge) {
          badge = document.createElement("span");
          badge.className = "again";
          lastLine.appendChild(badge);
        }

        badge.textContent = "  x" + lastSame;
        log.scrollTop = log.scrollHeight;

        return;
      }

      var line = document.createElement("p");

      line.textContent = entry.said;
      log.appendChild(line);

      lastLine = line;
      lastSaid = same;
      lastSame = 1;

      log.scrollTop = log.scrollHeight;
    });

    stream.addEventListener("error", function () {
      say("The connection to " + watching + " ended. Reload to follow it again.");
    });

    // Moved to, so somebody reading with the keyboard is where the new
    // content is rather than being told about it and left at the top.
    heading.setAttribute("tabindex", "-1");
    heading.focus();
  }

  // Wired once, not on every refresh. This sat inside refresh() and so
  // added another change handler and another click handler every four
  // seconds: after five minutes, one tick of the Sound box chimed seventy-odd
  // times and wrote the setting seventy-odd times.
  (function () {
    var sound = document.getElementById("sound");
    sound.checked = remembered("loadout.sound", false);
    sound.addEventListener("change", function () {
      remember("loadout.sound", sound.checked);

      // So somebody knows what they just switched on, before a run needs
      // them at three in the morning.
      if (sound.checked) { chime(); }
    });

    var ask = document.getElementById("notify");

    function showPermission() {
      if (!("Notification" in window)) {
        ask.textContent = "This browser cannot show notifications";
        ask.disabled = true;
        return;
      }

      if (Notification.permission === "granted") {
        ask.textContent = "Notifications are on";
        ask.disabled = true;
      } else if (Notification.permission === "denied") {
        ask.textContent = "Notifications are blocked for this page";
        ask.disabled = true;
      }
    }

    // Asked from a click rather than on load: a page that demands permission
    // the moment it opens is the reason people refuse it.
    ask.addEventListener("click", function () {
      Notification.requestPermission().then(function () {
        showPermission();

        // Everything already wanting somebody counts as new now. Without
        // this, saying yes would tell you about the next thing and never
        // about the three already waiting - which is the opposite of what
        // clicking it means.
        if (Notification.permission === "granted") { told = {}; }

        announce(Notification.permission === "granted"
          ? "You will be told when a run needs you."
          : "Notifications were not allowed. The tab title still says.");
      });
    });

    showPermission();
  })();

  /*
    The art, if any is installed. Asked for once rather than on every draw:
    a set is a directory somebody filled before starting the daemon, and it
    does not change underneath a page.

    Everything below degrades to what the office drew before. No art, an
    unreachable endpoint, a set naming pieces that are not there - all of them
    end with an empty square and a name in words, which is what the desk was
    built to be.
  */
  var pieces = {};
  var waitingPieces = {};

  // Every set this machine has: its room and its pieces, by name.
  var offices = {};
  var installed = [];

  // What the chosen set says about its own room: how big the scene is and
  // where somebody stands in it. Null for a set that says nothing, and then
  // the office draws the row of people it always drew.
  var room = null;

  function sprites() {
    return api("/api/office")
      .then(function (answer) {
        (answer.pieces || []).forEach(function (piece) { pieces[piece] = true; });
        (answer.waitingPieces || []).forEach(function (piece) { waitingPieces[piece] = true; });
        room = answer.room || null;
        offices = answer.offices || {};
        installed = (answer.sets || []).filter(function (one) {
          return offices[one] && offices[one].room;
        });

        // A board restored from a previous visit was drawn before any of this
        // arrived, so it has no office pickers on it and its rooms are bare.
        // Now that there is art, draw it again.
        if (board.on) {
          drawBoard();

          if (shown) { drawOpenScreens(shown); }
        }
      })
      .catch(function () {
        // Nothing to say. A dashboard with no art is the ordinary case.
      });
  }

  /*
    Which piece draws this node, or null for none.

    By role, because a role is what somebody recognises across runs - the
    reviewer looks like the reviewer whichever run it is in - and by the bare
    role name, so a set is a folder of files called implementer.png and
    reviewer.png rather than anything that needs a manifest. "worker" is the
    fallback for a set that did not draw every role, and a set with neither
    leaves the square empty.
  */
  function pieceFor(node, set) {
    var office = offices[set];
    var has = office ? (office.pieces || []) : [];
    var role = (node.role || "").replace(/^role\./, "");

    if (has.indexOf(role) >= 0) { return role; }

    return has.indexOf("worker") >= 0 ? "worker" : null;
  }

  function refresh() {
    // Both, every pass. The waiting area is two small files off a disk and a
    // schedule made while this is open should appear without a reload.
    queued();

    api("/api/runs")
      .then(function (answer) {
        shown = answer.runs;

        if (solo) {
          var one = views.filter(function (v) { return v.box === solo; })[0];

          if (one) { one.draw(answer.runs); }

          return;
        }

        draw(answer.runs);

        if (board.on) {
          // The team choices come from the runs, so they cannot be listed
          // until the first answer has arrived.
          showChoices();
          drawOpenScreens(answer.runs);
        }
      })
      .catch(function (wrong) {
        say(wrong.message + " The dashboard may have been stopped.");
      });
  }

  // The art first, then the runs, so the first office somebody sees is
  // already drawn rather than redrawing itself a moment later. Either way
  // round it works; this way it does not flicker.
  sprites().then(refresh);

  setInterval(refresh, 4000);
}());
</script>
</body>
</html>
