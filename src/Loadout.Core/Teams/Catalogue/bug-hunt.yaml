name: bug-hunt
description: Reproduces a bug without a person watching, proves its cause, fixes the proven cause, and proves the fix holds.
lead: lead
nodes:
  lead:
    role: role.project-lead
    delegates: [reproducer, investigator, fixer, regression-tester]
  reproducer:
    role: role.reproducer
    worktree: true
  investigator:
    role: role.investigator
    worktree: true
  fixer:
    role: role.fixer
    worktree: true
  regression-tester:
    role: role.regression-tester
    worktree: true
rules:
  autonomy: supervised
  budget:
    usd: 15
    turns_per_node: 40
    wall_clock: 3h
  gates:
    outward: ask
    merge: [regression-tester]
  stop_when: [goal_met, budget_spent, no_progress_2_rounds]
