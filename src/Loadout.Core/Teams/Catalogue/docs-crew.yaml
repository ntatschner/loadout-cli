name: docs-crew
description: Finds where the documentation and the code disagree, fixes it in the voice the docs already have, and follows the changed pages as a new reader would.
lead: lead
nodes:
  lead:
    role: role.project-lead
    delegates: [docs-auditor, docs-writer, docs-checker]
  docs-auditor:
    role: role.docs-auditor
  docs-writer:
    role: role.docs-writer
    worktree: true
  docs-checker:
    role: role.docs-checker
rules:
  autonomy: supervised
  budget:
    usd: 12
    turns_per_node: 40
    wall_clock: 2h
  gates:
    outward: ask
    merge: [docs-checker]
  stop_when: [goal_met, budget_spent, no_progress_2_rounds]
