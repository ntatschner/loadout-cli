<!-- @dsCard group="Pages" height=1250 width=1000 subtitle="One layer of an idea’s plan, its options side by side" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlanLayer</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
  #p .ls-layer + .ls-layer { margin-top: 18px; }
</style>
</head>
<body class="ls">
<div id="p" style="max-width: 940px"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  var IDEA = { id: "browser-launcher", where: ["--project", "loadout-cli"],
    questions: [
      { id: "q1", question: "Should the browser launcher replace the terminal one, or sit beside it?", why: "It decides whether the terminal launcher keeps its own screens.", options: ["Beside it", "Replace it"], recommendation: "Beside it", answer: null },
      { id: "q2", question: "Who opens it: only you on this machine, or anyone on the network?", why: "Anyone on the network means it needs signing in.", options: ["Only this machine", "The network, signed in"], recommendation: "Only this machine", answer: null },
      { id: "q3", question: "What should it show first?", why: null, options: [], recommendation: "The projects, most recent first", answer: "The projects, most recent first" }
    ],
    layer: { id: "L2", name: "How it is served", purpose: "Where the page comes from and who can reach it.", chosen: "o1", verdict: "Undecided", options: [
      { id: "o1", title: "From the daemon", detail: "The daemon that already hosts sessions serves the page too.", pros: ["One process to run", "Sessions are already there"], cons: ["The daemon must be running"], recommended: true },
      { id: "o2", title: "Its own server", detail: "loadout launcher serve, run when wanted.", pros: ["Nothing else needs to run"], cons: ["A second port", "Sessions live elsewhere"], recommended: false }
    ] } };
  var p = document.getElementById("p");
  /* Recorded after a moment, as the daemon reads it back. */
  function later(ok) { return function () { return new Promise(function (done) { setTimeout(function () { done(ok); }, 700); }); }; }
  p.appendChild(S.PlanLayer({ idea: IDEA.id, where: IDEA.where, layer: IDEA.layer, onChoose: later(true), onVerdict: later(true), onImprove: later(true) }));
  p.appendChild(S.PlanLayer({ idea: IDEA.id, where: IDEA.where, onChoose: later(false), onVerdict: later(false), onImprove: later(false),
    layer: { id: "L3", name: "Where the launch history lives", purpose: "Not recorded here: a round is running, so each change goes back.", chosen: null, verdict: "keep", options: [
      { id: "o1", title: "In the project's .loadout folder", pros: ["Travels with the repository"], cons: ["Noise in git status"], recommended: true },
      { id: "o2", title: "In the user's data folder", pros: ["Out of the repository"], cons: ["Lost when moving machine"] }] } }));
  p.appendChild(S.PlanLayer({ idea: IDEA.id, where: IDEA.where, addition: { id: "A1", title: "A link from the terminal launcher", why: "So people find the browser one from where they already are.", verdict: "Keep" }, onVerdict: later(true), onImprove: later(true) }));
})();
</script>
</body>
</html>
