<body class="ls">
<div id="d" style="max-width: 860px"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  document.getElementById("d").appendChild(S.DoneWhen({ by: "proposed by the lead, agreed by you", goal: "a --since option on loadout usage that filters by date",
    criteria: [
      { text: "the suite passes", project: true, verdict: "met", meaning: "the whole suite, on a fresh clone", evidence: ["verifier/1's report: dotnet test, 2,843 passed"], delivered: ["commit a4f21c9 by implementer/1"] },
      { text: "loadout usage --since 2026-01-01 prints only entries after that date", verdict: "met", meaning: "entries on or before the date are left out", evidence: ["verifier/1 ran it against a fixture of 40 entries"], delivered: ["commit a4f21c9 by implementer/1"], cited: ["round-3 (the lead's own report)"] },
      { text: "a test fails without the option and passes with it", verdict: "unmet", meaning: "a new test in tests/Loadout.Tests for --since" },
      { text: "the changelog mentions it", verdict: "not-attempted", meaning: "a line under Unreleased in CHANGELOG.md" },
      { text: "the docs say so", verdict: null, meaning: "the --since option is in docs/commands.md" }
    ] }));
})();
</script>
