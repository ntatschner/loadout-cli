<!-- @dsCard group="Modes" height=720 width=1300 subtitle="A page opened beside your terminals or the runs board, which stay live" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PageBeside</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<div id="g"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  document.documentElement.setAttribute("data-mode", "terminals");
  var deck = document.createElement("div"); deck.style.cssText = "display: grid; gap: 10px";
  [["why is this postgres query so slow", "working"], ["add a retry to the upload step", "needs approval"]].forEach(function (s, i) {
    deck.appendChild(S.Terminal({ title: s[0], project: i ? "loadout-cli" : "starstats", agent: "claude", state: i ? "approval" : "working", lines: [[["\u25cf ", "fg-green"], ["Read ", "bold"], [i ? "src/Upload/Uploader.cs" : "src/Stats/Queries/DailyTotals.sql", "fg-blue"]], [["  ", ""], [i ? "? Overwrite docs/images/dashboard-office.png?" : "Seq Scan on events  (rows=1,840,211)", i ? "fg-yellow bold" : "fg-bright-black"]]] }).el);
  });
  var out = document.createElement("p"); out.className = "out"; out.setAttribute("role", "status");
  var B = S.PageBeside({ page: "Spend", beside: "your terminals", onClose: function () { out.textContent = "Closed. The terminals take the width again."; } });
  var c = document.createElement("div");
  c.appendChild(S.TokenSplit({ since: "17 Sep", complete: true, from: "$ loadout usage --by project --days 30", totals: { input: 4.2e6, output: 1.9e6, thinking: 0.6e6, cacheRead: 38.5e6, total: 45.2e6, billedInputEquivalent: 11.3e6, savedFraction: 0.74, cacheHitFraction: 0.9 } }));
  c.appendChild(S.SpendBars({ by: "project", groups: [{ name: "loadout-cli", value: 6.1e6 }, { name: "starstats", value: 3.2e6 }, { name: "home-lab", value: 0.9e6 }] }));
  B.set(c);
  document.getElementById("g").appendChild(S.BesideGrid(deck, B)); document.body.appendChild(out);
})();
</script>
</body>
</html>
