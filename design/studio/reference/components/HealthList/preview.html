<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HealthList</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<div id="h" style="max-width: 760px"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  document.getElementById("h").appendChild(S.HealthList({ verdict: "Needs attention", from: "$ loadout drift loadout-cli", findings: [
    { name: "AGENTS.md", severity: "warning", detail: "Changed since Loadout wrote it", fixable: true },
    { name: "Git hook", severity: "error", detail: "pre-commit is missing, so AI tooling files could be committed", fixable: true },
    { name: "AI tooling files", severity: "info", detail: "none tracked in the repository" },
    { name: "Workspace link", severity: "ok", detail: "the repository says which project it is" } ] }));
})();
</script>
</body>
</html>
