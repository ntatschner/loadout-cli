<!-- @dsCard group="Teams" height=420 width=900 subtitle="Each done-when round by round: which one is stuck" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CriteriaGrid</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<div id="g" style="max-width: 820px"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  var CRIT = [
    { text: "loadout usage takes --since", verdicts: ["unmet", "met", "met", "met", "met"] },
    { text: "Every test passes", verdicts: ["not-attempted", "unmet", "unmet", "unmet", "unmet"] },
    { text: "The docs page names --since", verdicts: [null, "not-attempted", "unmet", "unmet", "unmet"] },
    { text: "The changelog has an entry", verdicts: ["not-attempted", "not-attempted", "met", "met", "met"] } ];
  document.getElementById("g").appendChild(S.CriteriaGrid({ rounds: 5, criteria: CRIT, stalledFor: 3, from: "journal.jsonl: report.checked" }));
})();
</script>
</body>
</html>
