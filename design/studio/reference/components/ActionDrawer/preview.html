<!-- @dsCard group="Pages" height=760 width=900 subtitle="A command as a closed drawer: opened, its form, the exact line and its button" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ActionDrawer</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<div id="d" style="max-width: 820px"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  var box = document.getElementById("d");
  box.appendChild(S.ActionDrawers([
    { name: "Safety", items: [
      { path: "backup restore", title: "Undo what one was taken for", label: "Restore", changesOnlyWith: ["--apply"], open: true, fields: [{ name: "id", label: "Backup", value: "20261016-2214-migrate", required: true }, { name: "--apply", label: "Restore the files, not only list them", kind: "flag" }] },
      { path: "checkpoint create", title: "Mark where a project stands", label: "Mark it", fields: [{ name: "name", label: "Name", placeholder: "before-the-rename", required: true }, { name: "--because", label: "Because", placeholder: "a sentence" }, { name: "--project", label: "Project", value: "loadout-cli", fixed: true }] }
    ] },
    { name: "Other effects", items: [
      { path: "memory review", title: "Walk the topics nobody has revisited", effect: "session", fields: [{ name: "project", label: "Project", value: "loadout-cli", fixed: true }] },
      { path: "secret set", title: "Store a secret", effect: "terminal", reason: "asks for the value at a masked prompt, so the secret never sits in a page or a command line", command: "$ loadout secret set <name>" },
      { path: "commands", title: "Everything Loadout can do", label: "List them", effect: "reads" }
    ] }
  ]));
})();
</script>
</body>
</html>
