<!-- @dsCard group="Teams" height=520 width=1000 subtitle="A team's nodes as the lead's line, and who each one briefs" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TeamNodes</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<div id="t" style="max-width: 720px"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  document.getElementById("t").appendChild(S.TeamNodes({ nodes: [
    { name: "lead", role: "role.lead", mode: "plan", deliverable: "a decision each round, and the verdicts", delegates: ["planner", "implementer", "reviewer", "verifier"] },
    { name: "planner", role: "role.planner", mode: "plan", deliverable: "PLAN.md" },
    { name: "implementer", role: "role.implementer", mode: "implement", deliverable: "a commit on its own branch", instances: 3, worktree: true },
    { name: "reviewer", role: "role.reviewer", mode: "review", deliverable: "notes on a branch" },
    { name: "verifier", role: "role.verifier", mode: "verify", deliverable: "what it ran, and what passed" }
  ] }));
})();
</script>
</body>
</html>
