<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RefusalsList</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<div id="r" style="max-width: 760px"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  document.getElementById("r").appendChild(S.RefusalsList({ from: "loadout team log <run> --events", items: [
    { at: "14:03", outcome: "refused", what: "implementer/1 ran git push", detail: "Bash(git push*) is not in its permissions" },
    { at: "14:05", outcome: "answered", what: "You answered the lead: Leave them", detail: "gate g4 \u00b7 by dashboard" },
    { at: "14:11", outcome: "refused", what: "The lead asked for a designer node", detail: "the team has no designer role" },
    { at: "14:20", outcome: "allowed", what: "verifier/1 ran dotnet test", detail: "allowed by its permissions" },
    { at: "14:31", outcome: "merged", what: "implementer/1's branch merged", detail: "merge gate \u00b7 yes" } ] }));
})();
</script>
</body>
</html>
