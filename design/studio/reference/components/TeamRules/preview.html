<!-- @dsCard group="Teams" height=480 width=1000 subtitle="What a run of a team follows: posture, budget, gates, waits and its own done-when" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TeamRules</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<div id="t" style="max-width: 760px"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  document.getElementById("t").appendChild(S.TeamRules({ rows: [
    ["Posture", "supervised: it goes on, and holds at the gates the team names"],
    ["Budget", "$15 a run · 40 turns a node · 4 hours", "A run's own --usd comes first, then this, then $ loadout config set team-budget"],
    ["Stops when", "the lead says done, the budget is spent, two rounds make no progress, or you"],
    ["Gates", "every merge · anything outward is asked, whatever the posture"],
    ["When nobody answers", "takes the lead's recommendation after 30m · think again once first"],
    ["Done when", "a test reproduces the bug: it fails without the fix and passes with it; the full test suite passes with the fix in place"],
    ["Held as well", "the suite passes (loadout-cli's own)"]
  ] }));
})();
</script>
</body>
</html>
