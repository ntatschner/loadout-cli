<!-- @dsCard group="Modes" height=420 width=1100 subtitle="Four modes, and a light that travels to the one you pick" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ModeSwitcher</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<p class="lab">Full</p><div id="a"></div>
<p class="lab" style="margin-top: 22px">Compact, for a phone</p><div id="b"></div>
<p class="lab" style="margin-top: 22px">Vertical, for a rail</p><div id="c"></div>
<p class="out" role="status" id="out"></p>
<script>
(function () {
  var S = window.LoadoutStudio;
  var out = document.getElementById("out");
  function said(m) { out.textContent = "\u2713 " + S.MODES.filter(function (x) { return x.key === m; })[0].desc; }
  var A = S.ModeSwitcher({ mode: "default", onChange: function (m) { B.set(m); C.set(m); said(m); } }), B = S.ModeSwitcher({ mode: "default", compact: true, onChange: function (m) { A.set(m); C.set(m); said(m); } }), C = S.ModeSwitcher({ mode: "default", vertical: true, compact: true, onChange: function (m) { A.set(m); B.set(m); said(m); } });
  document.getElementById("a").appendChild(A.el); document.getElementById("b").appendChild(B.el); document.getElementById("c").appendChild(C.el);
})();
</script>
</body>
</html>
