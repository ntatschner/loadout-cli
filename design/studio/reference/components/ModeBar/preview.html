<!-- @dsCard group="Modes" height=300 width=1200 subtitle="The bar at the top of every mode: the switcher, search, and what is waiting on you" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ModeBar</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<div id="a"></div><div id="b" style="margin-top: 18px"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  document.getElementById("a").appendChild(S.ModeBar({ mode: "terminals", onSearch: function () {}, waiting: [{ label: "Push the tag v0.66.0 to origin?" }, { label: "add a retry to the upload step needs approval" }] }).el);
  document.getElementById("b").appendChild(S.ModeBar({ mode: "minimal", compact: true, onSearch: function () {}, waiting: [] }).el);
})();
</script>
</body>
</html>
