<!-- @dsCard group="Pages" height=760 width=1000 subtitle="What Loadout did for you, counted and never estimated" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ValueReport</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<div id="v" style="max-width: 940px"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  document.getElementById("v").appendChild(S.ValueReport({ head: "In the last 30 days Loadout launched 46 sessions with the specialists their tasks needed, took 7 backups before changing many files, and ran 6 team runs, 4 of them to done.",
    groups: [
      { name: "Sessions", figures: [{ label: "sessions launched", value: 46, from: "loadout launches --days 30" }, { label: "specialists loaded, on average", value: "4.1", detail: "of 63 in the library", from: "loadout instructions stats" }, { label: "sessions picked up again", value: null, detail: "loadout resume; the ledger does not mark a resume yet" }] },
      { name: "Memory", figures: [{ label: "times memory was recalled", value: null, detail: "loadout_recall and memory find" }, { label: "facts written", value: null, detail: "loadout_remember and memory write" }] },
      { name: "Safety", figures: [{ label: "backups taken", value: 7, from: "<State>/backups" }, { label: "checkpoints marked", value: 3, from: "<State>/checkpoints" }, { label: "restores", value: null, detail: "backup restore and checkpoint restore" }, { label: "drift put right", value: null, detail: "drift --fix" }] } ] }));
})();
</script>
</body>
</html>
