<!-- @dsCard group="Navigation" height=720 width=1180 subtitle="Icons with live counts; widens over the page on hover or focus. At 320px a Pages tab slides it in." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SideRail</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div id="wide" style="position: relative; width: 760px; height: 660px; overflow: hidden; background: var(--ground); box-shadow: inset 0 0 0 1px var(--rule)">
  <div style="padding: 24px 24px 0 108px"><p class="lab">Home</p><p style="margin: 0; max-width: 520px; color: var(--muted)">Hover the rail, or tab into it, and it widens over the page with a dim. The page never moves under it.</p></div>
</div>
<div id="narrow" style="position: relative; width: 320px; height: 660px; overflow: hidden; background: var(--ground); box-shadow: inset 0 0 0 1px var(--rule)">
  <div style="padding: 24px 16px 0 52px"><p class="lab">At 320px</p><p style="margin: 0; color: var(--muted)">The Pages tab opens the same list over the page, with Close and Escape.</p></div>
</div></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  var PAGES = [{ key: "home", name: "Home", fact: "2 waiting on you", need: true }, { key: "sessions", name: "Sessions", fact: "1 waiting on you", need: true }, { key: "ideas", name: "Ideas", fact: "1 being shaped" },
    { key: "teams", name: "Teams", fact: "1 waiting on you", need: true }, { key: "memory", name: "Memory", fact: "12 topics" }, { key: "context", name: "Context", fact: "2,403 tokens" },
    { key: "spend", name: "Spend", fact: "[N]% of threshold" }, { key: "projects", name: "Projects", fact: "3 projects" }, { key: "settings", name: "Settings" }];
  document.getElementById("wide").appendChild(S.SideRail({ pages: PAGES, current: "home", contained: true }));
  document.getElementById("narrow").appendChild(S.SideRail({ pages: PAGES, current: "home", narrow: true }));
})();
</script>
</body>
</html>
