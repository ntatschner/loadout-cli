<!-- @dsCard group="Inputs" height=230 subtitle="On or Off in words beside the light, and where the choice is kept" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switch</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<div id="sw" style="max-width: 560px"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  var w = document.getElementById("sw");
  w.appendChild(S.Switch({ label: "Single-letter shortcuts", sub: "A for Ambient, N for a new session · kept in this browser", checked: true }));
  w.appendChild(S.Switch({ label: "Go full screen in Ambient", sub: "covers your editor, so it starts off · kept in this browser" }));
  w.appendChild(S.Switch({ label: "Pointer depth", sub: "layers drift as the pointer moves · never with reduced motion", checked: true }));
})();
</script>
</body>
</html>
