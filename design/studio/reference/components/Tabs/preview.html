<!-- @dsCard group="Inputs" height=190 subtitle="The line of light slides to the tab you are on" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tabs</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<div id="t"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  var words = ["today", "in the last 7 days", "in the last 30 days"];
  var t = S.Tabs({ label: "Tokens used over", tabs: [{ label: "Today" }, { label: "7 days" }, { label: "30 days" }], onSelect: function (i, panel) {
    panel.innerHTML = '<span class="display-xl" style="color: var(--ink-strong)">[N] tokens</span><p style="margin: 0; color: var(--muted)">used ' + words[i] + ' \u00b7 your daily threshold is [THRESHOLD]</p>'; } });
  document.getElementById("t").appendChild(t.el);
})();
</script>
</body>
</html>
