<!-- @dsCard group="Sessions" height=1340 width=1200 subtitle="A hosted session's status in full, for its Details: context, cost, usage windows, specialists" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StatusBlock</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 28px 36px; align-items: flex-start; }
  .lab { margin: 0 0 12px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  /* As wide as a session's Details column. */
  .col { flex: 0 1 300px; min-width: 0; }
</style>
</head>
<body class="ls">
<div class="row">
  <div class="col"><p class="lab">Normal</p><div id="a"></div></div>
  <div class="col"><p class="lab">Filling, every window</p><div id="b"></div></div>
  <div class="col"><p class="lab">Nearly full</p><div id="c"></div></div>
  <div class="col"><p class="lab">Old, no limits</p><div id="d"></div></div>
</div>
<script>
(function () {
  var S = window.LoadoutStudio, now = Date.parse("2026-10-27T12:00:20Z");
  function snapshot(over) {
    var s = { version: 1, at: "2026-10-27T12:00:02Z", refreshSeconds: 30, terminal: "off", wrapping: false, model: "Opus 5.5",
      context: { usedPercent: 42, inputTokens: 84000, windowSize: 200000, uncachedTokens: 1200, cacheReadTokens: 79800, cacheWriteTokens: 3000, outputTokens: 900 },
      cost: { usd: 1.234, durationMs: 600000, linesAdded: 40, linesRemoved: 7 },
      limits: { fiveHour: { usedPercent: 61.5, resetsAt: "2026-10-27T14:10:00Z" }, sevenDay: null, spend: null },
      project: "loadout-cli", specialists: ["role.implementer", "language.csharp"] };
    Object.keys(over || {}).forEach(function (k) { s[k] = over[k]; });
    return s;
  }
  function put(id, s) { document.getElementById(id).appendChild(S.StatusBlock({ status: s, now: now }).el); }
  put("a", snapshot());
  put("b", snapshot({ terminal: "full", wrapping: true, context: { usedPercent: 78.4, inputTokens: 156800, windowSize: 200000, uncachedTokens: 900, cacheReadTokens: 150000, cacheWriteTokens: 5900, outputTokens: 1400 },
    cost: { usd: 14.6, durationMs: 3600000, linesAdded: 220, linesRemoved: 31 },
    limits: { fiveHour: { usedPercent: 74, resetsAt: "2026-10-27T12:42:00Z" }, sevenDay: { usedPercent: 38, resetsAt: "2026-10-30T09:00:00Z" }, spend: { usedPercent: 46, resetsAt: "2026-11-01T00:00:00Z", usedUsd: 23, limitUsd: 50, period: "monthly" } },
    specialists: ["role.writer"] }));
  put("c", snapshot({ terminal: "minimal", context: { usedPercent: 93.2, inputTokens: 186400, windowSize: 200000, uncachedTokens: 400, cacheReadTokens: 184000, cacheWriteTokens: 2000, outputTokens: 2100 },
    cost: { usd: 6.8, durationMs: 5400000, linesAdded: 640, linesRemoved: 290 }, limits: { fiveHour: { usedPercent: 94, resetsAt: "2026-10-27T12:42:00Z" }, sevenDay: null, spend: null },
    specialists: ["role.implementer", "language.go", "domain.queues"] }));
  put("d", snapshot({ at: "2026-10-27T11:52:40Z", terminal: "full", model: "Haiku 5", context: { usedPercent: 21, inputTokens: 42000, windowSize: 200000, uncachedTokens: null, cacheReadTokens: null, cacheWriteTokens: null, outputTokens: 300 },
    cost: { usd: 0.31, durationMs: 300000, linesAdded: null, linesRemoved: null }, limits: null, project: null, specialists: ["role.reviewer"] }));
})();
</script>
</body>
</html>
