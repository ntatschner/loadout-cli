<!-- @dsCard group="Teams" height=760 width=1200 subtitle="The office in Studio: the shared engine’s picture in Studio’s frame, with a keyboard way round it" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OfficeView</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<p class="lab">The Teams page → Office. The real engine draws the pixel-art building; this stand-in draws blocks in the same places.</p><div id="a"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  function Sketch() {
    var stage, cv, o, inside = null, zoom = 1, view = "corner", lvl = 0;
    var FLOORS = [{ n: 6, run: "release-crew", state: "working" }, { n: 4, run: "docs-sweep", state: "waiting on you" }, { n: 3, run: "bucket-move", state: "failed" }];
    var ROOMS = [["The lead's office", "lead · Release 0.66.0", 0.08, 0.18], ["Meeting room", "1 question waiting for you", 0.42, 0.14], ["Mara, developer", "typing · src/Usage.cs", 0.2, 0.6], ["Theo, tester", "running the tests", 0.5, 0.62], ["The kitchen", "nobody on a break", 0.76, 0.2]];
    function size() { var r = stage.getBoundingClientRect(); return { w: r.width, h: r.height }; }
    function draw() {
      var s = size(), g = cv.getContext("2d"); cv.width = s.w; cv.height = s.h;
      g.fillStyle = "#121a24"; g.fillRect(0, 0, s.w, s.h); g.font = "12px monospace";
      if (!inside) {
        var bw = 180 * zoom, x = s.w / 2 - bw / 2, fh = 30 * zoom;
        for (var i = 0; i < 10; i++) { var y = s.h - 40 - (i + 1) * fh, f = FLOORS.filter(function (F) { return F.n === i + 1; })[0]; g.fillStyle = f ? "#2b3a4c" : "#1b2430"; g.fillRect(x, y, bw, fh - 3); if (f) { g.fillStyle = f.state === "failed" ? "#e5534b" : f.state === "working" ? "#4ec9e0" : "#e0a84e"; g.fillRect(x, y + fh - 6, bw, 3); } }
        g.fillStyle = "#8b98a5"; g.fillText("stand-in: the engine draws the tower here", 12, 20);
      } else {
        g.fillStyle = "#1f2a36"; g.fillRect(20, 20, s.w - 40, s.h - 40); g.fillStyle = "#8b98a5"; g.fillText("stand-in: floor " + inside.n + " · " + inside.run, 28, 40);
        ROOMS.forEach(function (R) { g.strokeStyle = "#3d4f63"; g.strokeRect(R[2] * s.w, R[3] * s.h, s.w * 0.16, s.h * 0.16); });
      }
    }
    return {
      mount: function (st, opts) { stage = st; o = opts; cv = document.createElement("canvas"); cv.setAttribute("aria-hidden", "true"); stage.insertBefore(cv, stage.firstChild); draw(); },
      where: function () { return inside ? { place: "floor", label: "Floor " + inside.n, detail: inside.run + " · " + inside.state, canTurn: true, canLevel: [true, true], zoom: zoom, zoomRange: [1, 3] } : { place: "outside", label: "The building", detail: "3 runs on 3 floors · " + (view === "street" ? "from the street" : view === "aerial" ? "from above" : "from a corner"), view: view, canTurn: true, canLevel: [false, false], zoom: zoom, zoomRange: [1, 3] }; },
      targets: function () {
        var s = size();
        if (!inside) { var bw = 180 * zoom, x = s.w / 2 - bw / 2, fh = 30 * zoom; return FLOORS.map(function (f) { return { id: "floor-" + f.n, kind: "floor", label: "Floor " + f.n + ": " + f.run, detail: f.state, run: f.run, rect: { x: x, y: s.h - 40 - f.n * fh, w: bw, h: fh - 3 } }; }); }
        return ROOMS.map(function (R, i) { return { id: "r" + i, kind: i === 2 || i === 3 ? "person" : "room", label: R[0], detail: R[1], run: inside.run, rect: { x: R[2] * s.w, y: R[3] * s.h, w: s.w * 0.16, h: s.h * 0.16 } }; });
      },
      activate: function (id) { if (!inside) { inside = FLOORS.filter(function (f) { return "floor-" + f.n === id; })[0]; draw(); return "entered"; } return "picked"; },
      back: function () { if (!inside) { return false; } inside = null; draw(); return true; },
      turn: function () { draw(); }, zoom: function (d) { zoom = Math.max(1, Math.min(3, zoom + d)); draw(); }, level: function () { draw(); },
      setView: function (v) { view = v; draw(); }, resize: function () { draw(); }, destroy: function () { cv.remove(); }
    };
  }
  var v = S.OfficeView({ engine: Sketch(), settingsHref: "#settings/machine", onPick: function (t) {
    v.show(S.OfficePanel({ kind: t.kind === "person" ? "Somebody" : "A room", title: t.label, lines: [t.detail], actions: [{ label: "Open the run", onPress: function () {} }], onClose: function () { v.hide(); } }));
  } });
  document.getElementById("a").appendChild(v.el);
})();
</script>
</body>
</html>
