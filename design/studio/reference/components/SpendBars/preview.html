<!-- @dsCard group="Pages" height=640 width=1000 subtitle="Tokens by project as bars; by day as columns read with the arrow keys" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SpendBars</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<p class="lab">By project</p><div id="a" style="max-width: 900px; margin-bottom: 28px"></div><p class="lab">By day</p><div id="b" style="max-width: 900px"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  document.getElementById("a").appendChild(S.SpendBars({ by: "project", groups: [{ name: "loadout-cli", value: 6.1e6 }, { name: "starstats", value: 3.2e6 }, { name: "home-lab", value: 0.9e6 }, { name: "~/Downloads/scratch", value: 0.4e6, registered: false }] }));
  var days = []; for (var i = 0; i < 30; i++) { var d = new Date(2026, 8, 18 + i); days.push({ name: d.getDate() + " " + d.toLocaleString("en-GB", { month: "short" }), value: Math.round(150000 + 500000 * Math.abs(Math.sin(i * 0.7)) + (i % 7 > 4 ? -120000 : 0)) }); }
  document.getElementById("b").appendChild(S.SpendBars({ by: "day", groups: days }));
})();
</script>
</body>
</html>
