<!-- @dsCard group="Foundations" height=640 width=1200 subtitle="The field map: an embossed survey map behind every page, still or with a slow scan" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FieldMap</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<div id="frame" style="position: relative; height: 560px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--rule); transform: translateZ(0)"><nav class="ls-railnav" style="position: absolute"><span class="mark"><i></i></span></nav><div style="position: relative; margin-left: 96px; padding: 24px 28px"><div class="ls-modebar" style="margin-bottom: 26px"><span class="calmword">the mode bar</span></div><h1 style="margin: 0 0 6px; font-size: 30px; font-weight: 200; color: var(--ink-strong)">Projects</h1><p style="margin: 0 0 18px; font-family: var(--font-mono); font-size: 12px; color: var(--muted)">3 known · 2 on this machine</p><div style="display: grid; grid-template-columns: repeat(3, 220px); gap: 8px"><div style="padding: 14px 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); color: var(--ink-strong)">Loadout CLI</div><div style="padding: 14px 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); color: var(--ink-strong)">StarStats</div><div style="padding: 14px 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--rule); color: var(--ink-strong)">Home lab</div></div></div></div>
<p class="lab" style="margin-top: 14px">Background</p><div id="pick" class="row"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  var frame = document.getElementById("frame");
  S.setBackdrop("map-animated");
  var M = S.FieldMap({ host: frame, width: 1150, height: 560 });
  M.el.style.position = "absolute"; M.el.style.zIndex = "0";
  frame.querySelector("nav").style.zIndex = "2"; frame.children[2].style.zIndex = "1";
  var pick = document.getElementById("pick");
  pick.appendChild(S.ModePicker({ label: "Background", selected: 2, options: [{ name: "Plain" }, { name: "Field map, still" }, { name: "Field map, animated" }], onChange: function (n, i) { S.setBackdrop(S.BACKDROPS[i]); } }));
})();
</script>
</body>
</html>
