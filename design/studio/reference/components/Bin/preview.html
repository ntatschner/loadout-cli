<!-- @dsCard group="Teams" height=640 width=1100 subtitle="What was removed, putting it back, emptying it for good, and clearing out runs" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bin</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<div id="b" style="max-width: 860px"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  document.getElementById("b").appendChild(S.Bin({ keptDays: 30, entries: [
    { kind: "run", name: "20260917-1116-ed59", what: "iterating-project · tidy the launcher", removed: "17 Sep", left: 2, size: "1.2 MB" },
    { kind: "run", name: "20261002-0930-41aa", what: "bug-hunt · find the flaky upload test", removed: "2 Oct", left: 15, size: "640 KB" },
    { kind: "team", name: "quick-review", what: "yours · for loadout-cli", removed: "9 Oct", left: 22 }],
    /* As main: a dry run asks too, and what it answers is said; the real one moves them. */
    onPrune: function (line, dry, p) { return dry ? "Would move 3 runs to the bin: 20260921-1012-4be0, 20260924-1630-a91c, 20260930-0815-77d2. Keeps 20 newer, and 1 that left a branch nothing merged." : "Cleared out 3 runs, to the bin."; } }));
})();
</script>
</body>
</html>
