<!-- @dsCard group="Commands as controls" height=560 width=1000 subtitle="A value a command keeps: what it is now, the control, Set and Clear, and the line" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SettingRow</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .col { flex: 1 1 420px; min-width: 0; max-width: 640px; }
</style>
</head>
<body class="ls">
<div class="row"><div class="col" id="a"></div></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  var a = document.getElementById("a");
  a.appendChild(S.SettingRow({ label: "The style this project uses", sub: "How sessions here are told to write code.", value: "house", kind: "choice", options: [["house", "house (yours)"], ["dotnet", "dotnet"], ["google", "google"]],
    setCmd: function (v) { return "$ loadout style use " + v + " --project loadout-cli"; }, setLabel: "Use it" }));
  a.appendChild(S.SettingRow({ label: "Where calls for help go", sub: "A run that needs you while you're away sends a message here.", value: null, unset: "nowhere: calls for help are off", kind: "choice", valueWord: "where", options: [["telegram", "Telegram"], ["slack", "Slack"], ["webhook", "A webhook"]],
    setCmd: function (v) { return "$ loadout team notify set " + v; }, clearCmd: "$ loadout team notify clear" }));
  a.appendChild(S.SettingRow({ label: "The webhook", sub: "Lets another service start a team run.", value: "off", kind: "switch", setCmd: function (v) { return v === "on" ? "$ loadout team webhook enable" : "$ loadout team webhook disable"; } }));
  a.appendChild(S.SettingRow({ label: "Hours in a working day", sub: "Used when your voice writes estimates.", value: "6", kind: "number", setCmd: function (v) { return "$ loadout voice time set hours-per-day " + v + " --project loadout-cli"; }, clearCmd: "$ loadout voice time unset hours-per-day --project loadout-cli" }));
})();
</script>
</body>
</html>
