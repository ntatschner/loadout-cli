<!-- @dsCard group="Teams" height=260 width=760 subtitle="Is a run getting closer: N of M met, when it last moved, and its line" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ProgressLine</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<p class="lab">Getting closer</p><div id="a"></div><p class="lab" style="margin-top: 20px">Stalled, held after this round</p><div id="b"></div><p class="lab" style="margin-top: 20px">Compact, for a board row</p><div id="c"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  document.getElementById("a").appendChild(S.ProgressLine({ total: 4, byRound: [0, 1, 2, 2], lastMoved: 1 }));
  document.getElementById("b").appendChild(S.ProgressLine({ total: 4, byRound: [0, 1, 2, 2, 2, 2], lastMoved: 3, stalled: true }));
  document.getElementById("c").appendChild(S.ProgressLine({ total: 5, byRound: [1, 3, 3], lastMoved: 1, compact: true }));
})();
</script>
</body>
</html>
