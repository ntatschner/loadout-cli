<!-- @dsCard group="Modes" height=360 width=1200 subtitle="Every session as a tab: its state, context, key and new output; close, rename, move, hide, and a menu on each" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SessionTabs</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<p class="lab">Tabs</p>
<div id="a"></div><p class="out" role="status" id="out">Right-click a tab, or Shift F10, for its menu; F2 renames; drag to move.</p>
<p class="lab" style="margin-top: 70px">Only watching: no Rename, no End</p>
<div id="w"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  var SESS = [
    { id: "s1", hid: "4f2a9c", title: "why is this postgres query so slow", word: "working", where: "starstats", agent: "claude", project: "starstats", launchTitle: "why is this postgres query so slow", namesAgent: true, context: 42 },
    { id: "s2", hid: "8b31d0", title: "upload retries", word: "needs approval", where: "loadout-cli", agent: "claude", project: "loadout-cli", launchTitle: "add a retry to the upload step", namesAgent: true, unread: true, context: 78 },
    { id: "s3", hid: "c07e55", title: "tidy the deploy script", word: "ended", where: "starstats", agent: "codex", project: "starstats", ended: true },
    { id: "s4", hid: "e91f02", title: "review the memory compress change", word: "working", where: "loadout-cli", agent: "claude", project: "loadout-cli", unread: true, context: 93 }
  ];
  var HIDDEN = [{ id: "s5", hid: "5d4c11", title: "watch the nightly build", word: "idle", where: "loadout-cli", agent: "claude", project: "loadout-cli" }];
  var out = document.getElementById("out");
  function said(t) { out.textContent = t; }
  var T = S.SessionTabs({ sessions: SESS, hidden: HIDDEN, current: "s1",
    onPick: function (id) { said("Showing " + id); },
    onMaximise: function (id) { said("Shows " + id + " alone"); },
    onNew: function () { said("Opens the launch sheet"); },
    onMove: function (order) { said("New order: " + order.join(", ") + " · this browser only"); },
    onRename: function (id, name) { said(name === null ? "Back to its launch name" : "Renamed to " + name); },
    onHide: function (id) { said("Hidden from this browser's strip: " + id + " · it still runs"); },
    onUnhide: function (id) { said("Back on the strip: " + id); },
    onClear: function (id) { said("Cleared " + id + " from this browser"); },
    onEnd: function (id) { said("$ loadout session end " + id + " --yes"); } });
  document.getElementById("a").appendChild(T);
  var W = S.SessionTabs({ label: "Sessions, only watching", changes: false, sessions: SESS.slice(0, 2), current: "s2", onPick: function () {} });
  document.getElementById("w").appendChild(W);
})();
</script>
</body>
</html>
