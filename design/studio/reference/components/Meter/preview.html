<!-- @dsCard group="Signals" height=330 subtitle="A beam with your threshold marked; past it the colour shifts and the words say so" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meter</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<div style="display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 18px 28px; align-items: center; max-width: 820px">
<div id="ring"></div><div><b style="font-family: var(--font-mono); font-weight: 500; color: var(--ink-strong)" id="st">Stage 3 of 5 · running</b><div style="margin-top: 6px"><button type="button" class="ls-halo small" id="adv"><span class="ring" aria-hidden="true"></span>Move it on</button></div></div>
<span class="lab" style="margin: 0">Tokens today</span><div id="m1"></div>
<span class="lab" style="margin: 0">Instruction budget</span><div id="m2"></div></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  var R = S.ProgressRing({ value: 0.6 }), st = 2, F = [0.1, 0.35, 0.6, 0.75, 1], W = ["captured", "shaping", "running", "waiting for you", "done"];
  document.getElementById("ring").appendChild(R.el);
  document.getElementById("adv").addEventListener("click", function () { st = (st + 1) % 5; R.set(F[st]); document.getElementById("st").textContent = "Stage " + (st + 1) + " of 5 \u00b7 " + W[st]; });
  var fmt = function (v) { return Math.round(v).toLocaleString("en-GB"); };
  var a = S.Meter({ label: "Tokens used today", value: 41000, max: 100000, threshold: 60000, unit: "tokens", thresholdLabel: "daily threshold", format: fmt, of: function () { return "of a 60,000 daily threshold"; }, source: "worked out by $ loadout spend refresh" });
  document.getElementById("m1").appendChild(a.el);
  var v = 41000; setInterval(function () { v = v >= 76000 ? 41000 : v + 5000; a.set(v); }, 1400);
  var b = S.Meter({ label: "Instruction budget used", value: 2403, max: 12000, threshold: 9600, unit: "of 12,000 tokens", thresholdLabel: "warns at 80%", format: fmt, source: "the mark warns at 80%, the default \u00b7 $ loadout config set instruction-warn-percent <percent>" });
  document.getElementById("m2").appendChild(b.el);
})();
</script>
</body>
</html>
