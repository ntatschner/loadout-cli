<!-- @dsCard group="Sessions" height=1140 width=1300 subtitle="The session page: the terminal first, details in a side panel that folds away: facts, status, events, actions" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SessionView</title>
<style>
  body { margin: 0; padding: 20px 24px; background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.45; }
  .row { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-start; }
  .lab { margin: 0 0 8px; font-size: 12px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-soft); }
  .ask { margin: 2px 0 0; font-size: 19px; color: var(--needs-text); }
  .asker { font-family: var(--font-mono); font-size: 11.5px; color: var(--needs-text); }
  .out { margin: 10px 0 0; font-size: 14px; color: var(--good); min-height: 20px; }
  
</style>
</head>
<body class="ls">
<div id="v" style="min-height: 700px; display: grid"></div>
<script>
(function () {
  var S = window.LoadoutStudio;
  var OUT = [
    [["› ", "fg-cyan"], ["loadout loadout-cli --task-id upload-retries --mode implement", ""]],
    [["  loaded foundation, implement mode, language.csharp, framework.dotnet · 1,456 tokens", "fg-bright-black"]],
    [["● ", "fg-green"], ["Read ", "bold"], ["src/Upload/Uploader.cs", "fg-blue"]],
    [["● ", "fg-green"], ["Edit ", "bold"], ["src/Upload/Uploader.cs", "fg-blue"]],
    [["  - await client.PutAsync(target, body, ct);", "fg-red"]],
    [["  + await Retry.WithBackoff(() => client.PutAsync(target, body, ct), attempts: 3, ct);", "fg-green"]],
    [["● ", "fg-green"], ["Run ", "bold"], ["dotnet test tests/Loadout.Tests --filter Upload", "fg-bright-black"]],
    [["  warning CS8618: Non-nullable field '_policy' is uninitialized.", "fg-yellow"]],
    [["  Passed! ", "fg-bright-green bold"], ["14 passed, 0 failed", "fg-green"]],
    [["● ", "fg-magenta"], ["The upload retries three times with backoff. Tests pass.", "fg-bright-white"]]
  ];
  var STATUS = { version: 1, at: "2026-10-27T12:00:12Z", refreshSeconds: 30, terminal: "off", wrapping: false, model: "Opus 5.5",
    context: { usedPercent: 42, inputTokens: 84000, windowSize: 200000, uncachedTokens: 1200, cacheReadTokens: 79800, cacheWriteTokens: 3000, outputTokens: 900 },
    cost: { usd: 1.234, durationMs: 1260000, linesAdded: 40, linesRemoved: 7 }, limits: { fiveHour: { usedPercent: 61.5, resetsAt: "2026-10-27T14:10:00Z" }, sevenDay: null, spend: null },
    project: "loadout-cli", specialists: ["role.implementer", "language.csharp"] };
  var NOW = Date.parse("2026-10-27T12:00:20Z");
  var V = S.SessionView({ line: { title: "add a retry to the upload step", where: "loadout-cli", agent: "claude", mode: "implement", time: "21 min" },
    terminal: { project: "loadout-cli", agent: "claude", sessionId: "3f9c2a1e", state: "approval", lines: OUT, foot: S.StatusStrip ? S.StatusStrip({ status: STATUS, now: NOW }) : null },
    facts: [["Project", "loadout-cli"], ["Agent", "claude"], ["Mode", "implement"], ["Task", "upload-retries"], ["Running", "21 min"], ["Quiet", "1 min"], ["Memory", "212 MB"], ["Windows", "2"], ["Drawn with", "webgl"]],
    status: STATUS, now: NOW,
    events: [["14:06", "asked for approval"], ["14:02", "tests passed"], ["13:45", "started"]],
    commands: [{ why: "Started with:", command: "$ loadout loadout-cli --task-id upload-retries --mode implement" }, { why: "Carry this conversation on in a terminal instead:", command: S.resumeCommand("3f9c2a1e", "loadout-cli") }],
    note: "Sessions survive a reload of this page, not a restart of the daemon.",
    actions: [{ label: "End the session", kind: "danger", cmd: "stops the agent in this terminal" }],
    /* Another window holds the input: this one can take it over. */
    button: { label: "Type here instead", cmd: "another window holds the input · takes it over", onPress: function () { V.setButton(null); } } });
  document.getElementById("v").appendChild(V.el);
})();
</script>
</body>
</html>
