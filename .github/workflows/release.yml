name: Release

# The run's title says which of two things it is. A run from the Actions page
# builds every package and publishes none of them — the publish, verify and
# Homebrew jobs are all gated on the ref being a tag — and it came out green,
# titled "Release", with four jobs skipped. Somebody who had just
# pressed the button read that as a release. Now the list says what happened.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && 'Rehearsal — nothing is published from the Actions page; push a tag to release'
      || format('Release {0}', github.ref_name) }}

# A release compiles nothing. CI on main publishes every runtime once, through
# build/publish.ps1, and tests those bytes on a machine of each kind (spec
# section 92); this promotes them. It finds that CI run, checks every file
# against the hashes CI took, signs the Windows executable once, and wraps the
# same bytes in the archives, the MSI, the .deb and the .rpm. What ships is
# what was tested, and the release says which run tested it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      run:
        description: >-
          CI run to promote, as a rehearsal that publishes nothing. Empty means
          the newest successful run on main that built binaries. To release,
          push an annotated tag vX.Y.Z instead.
        required: false
        default: ''

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Which CI run's build this ships. See build/find-tested-build.sh for what it
  # refuses and why. For a tag it waits for CI, which the documented release
  # command starts at the same moment as this, so its timeout covers a whole
  # CI run.
  source:
    name: Find the tested build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
      sha: ${{ steps.find.outputs.sha }}
      version: ${{ steps.find.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find the CI run that built and tested it
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.run }}
        run: bash build/find-tested-build.sh

      - name: Say where the build came from
        env:
          RUN: ${{ steps.find.outputs.run }}
          SHA: ${{ steps.find.outputs.sha }}
          VERSION: ${{ steps.find.outputs.version }}
        run: |
          {
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "## Rehearsal — nothing is published"
              echo
              echo "Started from the Actions page, so this promotes and packages a build and"
              echo "then stops: the publish, verify and Homebrew jobs only run for a tag."
              echo
            fi
            echo "## Version $VERSION, built and tested by CI"
            echo
            echo "- CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN"
            echo "- Commit: \`$SHA\`"
            echo
            echo "Each package job below adds the binary's hash as CI tested it and as it ships."
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    needs: source
    # Bounded so a hang fails visibly instead of burning the job's whole
    # allowance. The win-x64 installer job hung for forty-eight minutes on
    # the 0.8.0 release and was killed with no log left to read, which is a
    # much worse outcome than a fast failure naming the step.
    timeout-minutes: 30
    # Named so the OIDC subject stays constant. Without it the subject carries
    # the ref, which differs for every tag, and a federated credential can only
    # match a fixed subject — this account's subjects also carry immutable
    # owner and repository IDs, which the portal's GitHub Actions preset cannot
    # express, so one stable subject is the only workable shape.
    environment: release

    # Presence of ARTIFACT_SIGNING_ACCOUNT is the switch. Unset, the build
    # scripts skip signing and produce unsigned artefacts; set, they refuse to
    # run half-configured. The other two are read by build/sign-windows.ps1.
    env:
      ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
      VERSION: ${{ needs.source.outputs.version }}
      RUNTIME: ${{ matrix.rid }}

    # id-token for the OIDC token azure/login exchanges, harmless when signing
    # is not configured because no token is then requested; actions to read
    # the build out of the CI run.
    permissions:
      contents: read
      id-token: write
      actions: read

    strategy:
      # One platform failing must not hide the others.
      fail-fast: false
      matrix:
        # Nothing is compiled here, so no runtime needs a runner of its own
        # kind any more. The archives and Linux packages are made on Ubuntu,
        # where tar and chmod set the executable bit for real; the MSI needs
        # WiX, which is Windows.
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-latest }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: osx-x64,     os: ubuntu-latest }
          - { rid: osx-arm64,   os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v7

      # Nothing is compiled, but WiX is a dotnet tool, and installing it from
      # inside the checkout honours global.json's SDK pin.
      - uses: actions/setup-dotnet@v6
        if: startsWith(matrix.rid, 'win-')
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: loadout-${{ matrix.rid }}
          path: build-${{ matrix.rid }}
          run-id: ${{ needs.source.outputs.run }}
          github-token: ${{ github.token }}

      # Every file against the hashes CI took when it published them, so
      # nothing that reaches a package is other than what CI tested. The
      # executable's hash is kept as the tested one, before signing changes it.
      # An artefact is a zip, which carries no Unix mode, so the bit is put
      # back here.
      - name: Check it is the build CI tested
        id: tested
        shell: bash
        working-directory: build-${{ matrix.rid }}
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          binary=$(ls | grep -E '^loadout(\.exe)?$')
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
          echo "hash=$(awk -v b="$binary" '$2 == b { print $1 }' SHA256SUMS)" >> "$GITHUB_OUTPUT"
          [ "$binary" = loadout.exe ] || chmod +x loadout

      # Placed immediately before the step that signs, and deliberately not
      # earlier. GitHub's OIDC assertion is valid for five minutes and
      # azure/login cannot renew it, so a login sitting in front of a long
      # step is already dead by the time signtool asks for a token:
      # AADSTS700024, "Client assertion is not within its valid time range".
      - name: Azure login for signing
        if: startsWith(matrix.rid, 'win-') && env.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Once, before anything is packaged, so the zip and the MSI carry the
      # same signed executable. The MSI is signed separately by installer.ps1:
      # the executable's signature is what Windows checks when it runs, the
      # package's when it is double-clicked. A no-op unless Artifact Signing
      # is configured.
      - name: Sign the executable
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: ./build/sign-windows.ps1 -Path build-$env:RUNTIME/loadout.exe

      # The tested hash and the shipped one side by side. They are the same
      # everywhere but Windows, where signing writes into the file; the pair
      # is what lets anyone tie the signed download to the bytes CI tested.
      - name: Record what was tested and what ships
        shell: bash
        env:
          BINARY: ${{ steps.tested.outputs.binary }}
          TESTED: ${{ steps.tested.outputs.hash }}
          RUN: ${{ needs.source.outputs.run }}
        run: |
          set -euo pipefail
          shipped=$(sha256sum "build-$RUNTIME/$BINARY" | cut -d' ' -f1)
          mkdir -p artifacts
          printf '%s\t%s\t%s\t%s\n' "$RUNTIME" "$BINARY" "$TESTED" "$shipped" > "artifacts/provenance-$RUNTIME.tsv"
          {
            echo "### $RUNTIME"
            echo
            echo "- Tested by CI run $RUN: \`$TESTED\`"
            echo "- Ships as: \`$shipped\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        shell: pwsh
        run: >
          ./build/package.ps1
          -Runtime ${{ matrix.rid }}
          -Version ${{ needs.source.outputs.version }}
          -Build build-${{ matrix.rid }}

      - name: Check the archive holds what it should
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts

          # Not `ls loadout-*.{zip,tar.gz}`: that expands to two globs, and a
          # platform producing only one of them makes ls exit 2 for the glob
          # that matched nothing. With pipefail that fails the step even though
          # the archive was found.
          archive=$(find . -maxdepth 1 \( -name 'loadout-*.zip' -o -name 'loadout-*.tar.gz' \) | head -1)
          if [ -z "$archive" ]; then echo "no archive was produced" >&2; exit 1; fi
          archive=${archive#./}
          echo "Checking $archive"

          # A release that fails its own checksum is worse than no release.
          sha256sum -c "${archive}.sha256"

          case "$archive" in
            *.tar.gz)
              # The executable bit is the one property that silently ruins a
              # Unix release, so it is asserted rather than assumed.
              if ! tar -tvzf "$archive" | grep -E '^-rwx.*loadout$'; then
                echo "loadout is not executable inside $archive" >&2
                exit 1
              fi
              ;;
          esac

          # Debug symbols and generated API documentation must not ship.
          if tar -tzf "$archive" 2>/dev/null | grep -qE '\.(pdb|xml)$'; then
            echo "$archive contains build artefacts that should not ship" >&2
            exit 1
          fi

      # The binary itself was tested in CI. What this catches is the archive:
      # a file left out, or a mode lost, on the two runtimes these runners can
      # execute.
      - name: Smoke test the archive
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke && cd smoke

          archive=$(find ../artifacts -maxdepth 1 \( -name 'loadout-*.zip' -o -name 'loadout-*.tar.gz' \) | head -1)
          if [ -z "$archive" ]; then echo "no archive to smoke test" >&2; exit 1; fi

          case "$archive" in
            *.zip) unzip -q "$archive" ;;
            *) tar -xzf "$archive" ;;
          esac

          [ "$(./loadout --version | tr -d '\r')" = "$VERSION" ]
          ./loadout doctor --json > /dev/null
          ./loadout project list --json > /dev/null

      # Pinned to 5, deliberately. WiX 6 and later require accepting the Open
      # Source Maintenance Fee agreement, which is a decision for whoever owns
      # this project rather than something a build script should accept on
      # their behalf. Version 5 is MIT and asks for nothing.
      # The Util extension is a separate install from the tool itself, and is
      # pinned to the same version: WixQuietExec comes from it, and without it
      # the package does not build at all rather than quietly building one that
      # flashes a console window during install.
      - name: Install WiX
        if: startsWith(matrix.rid, 'win-')
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2

      - name: Install packaging tools
        if: startsWith(matrix.rid, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y rpm

      # The MSI is signed inside installer.ps1, after WiX writes it, and the
      # login above may have expired by then, so it logs in again.
      - name: Azure login for signing the installer
        if: startsWith(matrix.rid, 'win-') && env.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build installer
        if: startsWith(matrix.rid, 'win-') || startsWith(matrix.rid, 'linux-')
        shell: pwsh
        run: >
          ./build/installer.ps1
          -Runtime ${{ matrix.rid }}
          -Version ${{ needs.source.outputs.version }}
          -Build build-${{ matrix.rid }}

      # The MSI's own authoring, which no checksum or file listing reaches.
      # 0.3.0 shipped an installer that could not upgrade over a running
      # launcher and failed with 1603, and it was invisible here because the
      # package built and installed perfectly on a machine whose Restart
      # Manager was available. See build/verify-windows.ps1.
      - name: Check the installer can upgrade over a running launcher
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          Get-ChildItem artifacts/*.msi | ForEach-Object {
            ./build/verify-windows.ps1 -Path $_.FullName
          }

      # Installing it is the only way to know it installs, and until now that
      # was true of the .deb and not of the MSI — the one people double-click.
      - name: Check the package holds what it should
        if: startsWith(matrix.rid, 'win-') || startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts

          for file in *.msi *.deb *.rpm; do
            [ -e "$file" ] || continue

            echo "Checking $file"
            sha256sum -c "${file}.sha256"
          done

          # A Debian package that unpacks to nothing on PATH installs cleanly
          # and leaves the user with no command, which is the failure mode
          # worth catching here rather than in somebody's terminal.
          for deb in *.deb; do
            [ -e "$deb" ] || continue

            dpkg-deb -c "$deb" | grep -q './usr/bin/loadout' || {
              echo "$deb puts nothing on PATH" >&2
              exit 1
            }

            dpkg-deb -c "$deb" | grep -qE '\.(pdb|xml)$' && {
              echo "$deb contains build artefacts that should not ship" >&2
              exit 1
            }

            true
          done

      # Installing it is the only way to know it installs. The runner is
      # disposable, so this costs nothing and catches the class of defect a
      # checksum never will.
      - name: Install and run it
        if: matrix.rid == 'linux-x64'
        run: |
          set -euo pipefail
          sudo dpkg -i artifacts/loadout_*_amd64.deb
          loadout --version
          loadout doctor --json > /dev/null
          sudo dpkg -r loadout

          # Checked on the filesystem, not with `command -v`: that consults the
          # shell's hash table, which still holds the path from the successful
          # run above and so reports a binary that has already been removed.
          [ ! -e /usr/bin/loadout ]

      # Nothing looked inside the .rpm until a released one turned out to be
      # missing 90% of itself. rpmbuild strips every ELF it recognises, which
      # rewrites a .NET single-file binary without the bundle appended after
      # its sections: 80 MB became 11 MB, and the package installed cleanly
      # and did nothing.
      #
      # Read from the package metadata rather than by extracting, so this needs
      # no tools the runner might not have.
      - name: Check the rpm carries its payload
        if: startsWith(matrix.rid, 'linux-')
        run: |
          set -euo pipefail
          rpm=$(find artifacts -maxdepth 1 -name '*.rpm' | head -1)
          [ -n "$rpm" ] || { echo "no rpm was produced" >&2; exit 1; }

          # The long listing puts a symlink target in the last field, so the
          # /usr/bin symlink line ends with the same path as the binary it
          # points at. Restricting to regular files by the mode column is what
          # separates them; matching the path alone read the symlink and
          # reported its 24-byte size.
          size=$(rpm -qlvp "$rpm" | awk '$1 ~ /^-/ && $NF == "/usr/lib/loadout/loadout" { print $5 }')
          echo "$(basename "$rpm") carries a $size byte binary"

          # A self-contained publish is tens of megabytes on every runtime.
          # Anything an order of magnitude under that is a stripped bundle.
          [ "${size:-0}" -gt 40000000 ]

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.msi
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.sha256
            artifacts/provenance-*.tsv
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [source, package]
    if: github.ref_type == 'tag'
    # id-token and attestations for the provenance attestation below.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: downloaded
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          cd downloaded

          # Each sidecar is written without a trailing newline, deliberately, so
          # that a single-entry file carries no line ending for sha256sum to
          # trip over. Concatenating them therefore needs the newlines putting
          # back: "cat *.sha256 > SHA256SUMS" produced one unusable line, and
          # every release up to 0.4.0 shipped a manifest that sha256sum -c
          # rejects with "no properly formatted SHA256 checksum lines found".
          for sidecar in *.sha256; do
            cat "$sidecar"
            echo
          done > SHA256SUMS

          # Verified here, against the very files about to be published. The
          # manifest was broken for four releases precisely because nothing
          # ever read it back.
          sha256sum -c SHA256SUMS

          cat SHA256SUMS

      # Which CI run tested these bytes, and the executable's hash as it was
      # tested and as it ships. Published beside SHA256SUMS so the chain from
      # the test to the download can be read without the run's logs, which
      # expire.
      - name: Write the provenance
        env:
          RUN: ${{ needs.source.outputs.run }}
          SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          cd downloaded
          {
            echo "Built and tested by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN"
            echo "from commit $SHA."
            echo
            echo "The executable's SHA-256 as CI tested it, and as it ships. They differ"
            echo "only on Windows, where it is signed after testing."
            echo
            printf '%-12s %-12s %-64s %s\n' runtime file tested shipped
            sort provenance-*.tsv | while IFS=$'\t' read -r runtime file tested shipped; do
              printf '%-12s %-12s %-64s %s\n' "$runtime" "$file" "$tested" "$shipped"
            done
          } > PROVENANCE.txt
          rm provenance-*.tsv
          cat PROVENANCE.txt

      # Checkable by anyone with `gh attestation verify <file> --repo <repo>`:
      # each published file came from this workflow, this run and this commit.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            downloaded/*.zip
            downloaded/*.tar.gz
            downloaded/*.msi
            downloaded/*.deb
            downloaded/*.rpm

      # The document 'loadout update' reads. Until this step existed the
      # setting pointed at nothing: every release published archives and a
      # manifest, and the updater wants one JSON file naming, per platform,
      # where the archive is and what it hashes to. So the command refused
      # on every machine, whatever it was configured with.
      #
      # Built from SHA256SUMS rather than by hashing again, so the feed
      # cannot disagree with the checksums people are told to verify.
      - name: Build the release feed
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail

          base="${{ github.server_url }}/${{ github.repository }}/releases"

          pwsh ./build/feed.ps1 -Version "$VERSION" -Directory downloaded \
            -BaseUrl "$base/download/v$VERSION" \
            -Notes "$base/tag/v$VERSION"

          cat downloaded/feed.json

      # What changed in this version, which until now was written into the
      # tag and read by nobody: the release body below is the same paragraph
      # for every version, so the notes never reached the page people
      # actually look at.
      - name: Read the notes out of the tag
        id: notes
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "This was built by hand rather than from a tag, so it has no notes." > notes.md
          else
            git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
            git tag -l --format='%(contents:body)' "${{ github.ref_name }}" > notes.md
          fi

          # An unannotated tag has no body, and an empty heading is worse
          # than none.
          if [ ! -s notes.md ]; then
            echo "No notes were written for this version." > notes.md
          fi

          # The standing part every release carries, after what is particular
          # to this one. Written as a page somebody has landed on wanting to
          # install this: the commands first, the small print after. The
          # version is substituted so the commands can be copied as they are
          # rather than edited first.
          version="${{ github.ref_name }}"
          version="${version#v}"

          cat >> notes.md <<STANDING

          ## Install

          **Linux and macOS**

          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh
          loadout setup
          \`\`\`

          **Windows**

          \`\`\`powershell
          irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex
          loadout setup
          \`\`\`

          Each picks the build for your machine, checks it against \`SHA256SUMS\`
          before installing anything, and needs no root or elevation. The Windows
          one checks the MSI's signature too. To install this version rather than
          the latest, add \`-s -- --version ${version}\` after \`sh\`.

          Or take the files below yourself: an MSI and a zip for Windows,
          archives for Linux and macOS, and a \`.deb\` and an \`.rpm\`.

          ## The small print

          Self-contained builds — no .NET installation required. Verify any
          download against \`SHA256SUMS\`.

          Built for Windows, Linux and macOS on x64 and arm64. Each binary was
          built once and tested on its own platform before release (macOS x64
          under Rosetta), and these are those same bytes: \`PROVENANCE.txt\`
          names the run that tested them. macOS packages are not signed or
          notarised.
          STANDING


          cat notes.md

      # Pinned like every other action here. This is the one step with
      # contents: write, so a moved tag upstream would be a moved tag with
      # permission to publish.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            downloaded/*.zip
            downloaded/*.tar.gz
            downloaded/*.msi
            downloaded/*.deb
            downloaded/*.rpm
            downloaded/SHA256SUMS
            downloaded/PROVENANCE.txt
            downloaded/feed.json
            build/install.sh
            build/install.ps1
          # What changed, then the standing paragraph, which says how far the
          # testing went rather than implying more: macOS x64 runs under
          # Rosetta, which proves less than a native machine would.
          body_path: notes.md

  # Called rather than triggered. The release above is published with
  # GITHUB_TOKEN, and GitHub raises no workflow runs from events that token
  # causes — so a `release: published` trigger in homebrew.yml never fires for
  # a release this pipeline makes, and the tap silently stays behind.
  homebrew:
    name: Homebrew
    needs: release
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # winget is not submitted from here. Each submission is a pull request a
  # moderator reviews by hand, so winget.yml sends the newest release once a
  # day instead of one per release, and closes the ones it supersedes.

  # Off the publish path on purpose, and this is the change that matters.
  #
  # An upgrade that could not complete shipped twice and was found by a user
  # both times, so the check earns its place. But it ran inside the installer
  # job, ahead of that job's Upload step, and it stalls: six releases now, and
  # bounding every msiexec call and then the Windows Installer COM call did not
  # stop it. A stall there took the whole job down with it, so the win-x64
  # installer was never uploaded and the release could not be published at all
  # — 0.17.1 was tagged with nothing behind it twice in a row.
  #
  # A gate that hangs blocks every release rather than the bad ones. So the
  # installer is built and uploaded first, this downloads it and checks it
  # afterwards, and `release` does not wait on the answer. A bad upgrade now
  # shows as one red job beside a published release, which is the trade made
  # deliberately: the check reports, it no longer gates.
  verify-windows:
    name: Verify the Windows install
    runs-on: windows-latest
    timeout-minutes: 20
    needs: package
    if: github.ref_type == 'tag'

    steps:
      - uses: actions/checkout@v7

      # The MSI this release publishes, wrapped round the promoted build, so a
      # pass here is about what people download.
      - uses: actions/download-artifact@v8
        with:
          name: release-win-x64
          path: artifacts

      - name: Install, upgrade and uninstall it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = Get-ChildItem artifacts/*win-x64.msi | Select-Object -First 1

          # Run in a child job and hold a deadline over it out here. The step's
          # own timeout-minutes has never worked on this: the runner asks a
          # stuck step to stop, whatever is stuck does not answer, and the job
          # is cancelled with its logs discarded — which is why five stalls left
          # nothing to read. A parent that is not itself blocked can kill what
          # is, and then this fails with its output instead of vanishing.
          $work = Start-Job -ArgumentList `
            "$PWD/build/verify-windows-install.ps1", $msi.FullName, `
            '${{ github.repository }}', '${{ github.ref_name }}' -ScriptBlock {
              param($script, $msi, $repository, $tag)

              # -DisableRestartManager is the whole reason this is worth
              # running here. The failure it checks for only happens where the
              # Restart Manager is off, which is a policy on managed Windows
              # builds and a default on no runner, so every release until now
              # was verified against the easy path and reported as the hard
              # one. The runner is disposable, so writing the policy onto it
              # costs nothing.
              & $script -Msi $msi -Repository $repository -CurrentTag $tag -DisableRestartManager
            }

          if (-not (Wait-Job $work -Timeout 480)) {
            # Report, then leave. Nothing here touches the wedged job, and that
            # ordering is the whole point.
            #
            # Both runs of 0.28.0 ended at exactly 25m0s, which is this job's
            # 20 minute timeout plus the five minutes the runner allows for
            # cleanup before it kills the process — so the step never exited
            # under its own power, and a cancelled job has its logs discarded.
            # That is why eight stalls have left nothing to read, including the
            # two that happened after this guard was written to prevent exactly
            # that.
            #
            # The guard almost certainly fired on time and then blocked putting
            # its own house in order: Stop-Job on a job wedged inside the
            # installer service hangs the same way Kill does one level down,
            # which the verification script already documents. So the tidying
            # is gone. An exiting step does not need to tidy up after itself —
            # the runner tears the process tree down either way, and a leaked
            # msiexec on a machine that is about to be discarded costs nothing.
            #
            # Whether this is right is answerable by watching: the next stall
            # either fails at eight minutes with output, or it does not.
            Write-Host "::error::The Windows install check stalled for eight minutes."

            # Whatever the job managed to say before it stuck. Non-blocking:
            # this takes what is already buffered rather than waiting for more.
            Receive-Job $work -ErrorAction SilentlyContinue

            exit 1
          }

          Receive-Job $work
          Remove-Job $work -Force -ErrorAction SilentlyContinue

          if ($work.State -eq 'Failed') { exit 1 }

      # The script writes each phase to a file as it reaches it, so a stall can
      # name the phase it never came out of. Worth more now than it was: the
      # step above fails rather than being cancelled, so this actually runs.
      - name: What the install check got through
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $logs = Join-Path ([System.IO.Path]::GetTempPath()) 'loadout-install-logs'

          if (Test-Path $logs) {
            Get-ChildItem $logs -Recurse | ForEach-Object {
              Write-Host "--- $($_.Name)"
              Get-Content $_.FullName -Tail 50
            }
          }
          else {
            Write-Host 'The check wrote no phase file, so it stopped before it started.'
          }

