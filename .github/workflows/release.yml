name: Release

# Spec section 92 requires every release to be built against all Tier-1
# platforms. Each archive is produced on the operating system it targets, so the
# Unix executable bit and the macOS binaries come out right without the
# packaging script having to compensate for a foreign host.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true
        default: 0.1.0

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    # Bounded so a hang fails visibly instead of burning the job's whole
    # allowance. The win-x64 installer job hung for forty-eight minutes on
    # the 0.8.0 release and was killed with no log left to read, which is a
    # much worse outcome than a fast failure naming the step.
    timeout-minutes: 30
    # Named so the OIDC subject stays constant. Without it the subject carries
    # the ref, which differs for every tag, and a federated credential can only
    # match a fixed subject — this account's subjects also carry immutable
    # owner and repository IDs, which the portal's GitHub Actions preset cannot
    # express, so one stable subject is the only workable shape.
    environment: release

    # Presence of ARTIFACT_SIGNING_ACCOUNT is the switch. Unset, the build
    # scripts skip signing and produce unsigned artefacts; set, they refuse to
    # run half-configured. The other two are read by build/sign-windows.ps1.
    env:
      ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}

    # Required for the OIDC token azure/login exchanges. Harmless when signing
    # is not configured, because no token is then requested.
    permissions:
      contents: read
      id-token: write

    strategy:
      # One platform failing must not hide the others: a macOS-only packaging
      # break is exactly what this matrix exists to catch.
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-latest }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: osx-x64,     os: macos-latest }
          - { rid: osx-arm64,   os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # pwsh is present on every GitHub runner, which is why the packaging
      # script is PowerShell: one command works on all three legs.
      # Placed immediately before the step that signs, and deliberately not
      # earlier. GitHub's OIDC assertion is valid for five minutes and
      # azure/login cannot renew it, so a login sitting in front of a long
      # build is already dead by the time signtool asks for a token:
      # AADSTS700024, "Client assertion is not within its valid time range".
      - name: Azure login for signing
        if: startsWith(matrix.rid, 'win-') && env.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Package
        shell: pwsh
        run: >
          ./build/package.ps1
          -Runtime ${{ matrix.rid }}
          -Version ${{ steps.version.outputs.value }}

      - name: Check the archive holds what it should
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts

          # Not `ls loadout-*.{zip,tar.gz}`: that expands to two globs, and a
          # platform producing only one of them makes ls exit 2 for the glob
          # that matched nothing. With pipefail that fails the step even though
          # the archive was found. Linux and macOS build a .tar.gz and no .zip,
          # so this failed every non-Windows leg the first time the workflow ran.
          archive=$(find . -maxdepth 1 \( -name 'loadout-*.zip' -o -name 'loadout-*.tar.gz' \) | head -1)
          if [ -z "$archive" ]; then echo "no archive was produced" >&2; exit 1; fi
          archive=${archive#./}
          echo "Checking $archive"

          # A release that fails its own checksum is worse than no release.
          if command -v sha256sum >/dev/null; then
            sha256sum -c "${archive}.sha256"
          else
            shasum -a 256 -c "${archive}.sha256"
          fi

          case "$archive" in
            *.tar.gz)
              # The executable bit is the one property that silently ruins a
              # Unix release, so it is asserted rather than assumed.
              if ! tar -tvzf "$archive" | grep -E '^-rwx.*loadout$'; then
                echo "loadout is not executable inside $archive" >&2
                exit 1
              fi
              ;;
          esac

          # Debug symbols and generated API documentation must not ship.
          if tar -tzf "$archive" 2>/dev/null | grep -qE '\.(pdb|xml)$'; then
            echo "$archive contains build artefacts that should not ship" >&2
            exit 1
          fi

      # Only a native archive can be executed here; a cross-compiled one cannot.
      - name: Smoke test the binary
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke && cd smoke

          # Same reasoning as the archive check: two globs, and whichever one
          # this platform does not produce makes ls exit non-zero.
          archive=$(find ../artifacts -maxdepth 1 \( -name 'loadout-*.zip' -o -name 'loadout-*.tar.gz' \) | head -1)
          if [ -z "$archive" ]; then echo "no archive to smoke test" >&2; exit 1; fi

          case "$archive" in
            *.zip) unzip -q "$archive" ;;
            *) tar -xzf "$archive" ;;
          esac

          ./loadout --version
          ./loadout doctor --json > doctor.json
          ./loadout project list --json > projects.json

          # doctor is allowed to report problems on a bare runner; what it may
          # not do is fail to produce a report at all.
          python3 -c "import json;d=json.load(open('doctor.json'));print('verdict',d['verdict'])"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: loadout-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
          if-no-files-found: error

  installer:
    name: Installer ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # Named so the OIDC subject stays constant. Without it the subject carries
    # the ref, which differs for every tag, and a federated credential can only
    # match a fixed subject — this account's subjects also carry immutable
    # owner and repository IDs, which the portal's GitHub Actions preset cannot
    # express, so one stable subject is the only workable shape.
    environment: release

    # Presence of ARTIFACT_SIGNING_ACCOUNT is the switch. Unset, the build
    # scripts skip signing and produce unsigned artefacts; set, they refuse to
    # run half-configured. The other two are read by build/sign-windows.ps1.
    env:
      ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}

    # Required for the OIDC token azure/login exchanges. Harmless when signing
    # is not configured, because no token is then requested.
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-latest }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # Pinned to 5, deliberately. WiX 6 and later require accepting the Open
      # Source Maintenance Fee agreement, which is a decision for whoever owns
      # this project rather than something a build script should accept on
      # their behalf. Version 5 is MIT and asks for nothing.
      - name: Install WiX
        if: startsWith(matrix.rid, 'win-')
        run: dotnet tool install --global wix --version 5.0.2

      - name: Install packaging tools
        if: startsWith(matrix.rid, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y rpm

      # Placed immediately before the step that signs, and deliberately not
      # earlier. GitHub's OIDC assertion is valid for five minutes and
      # azure/login cannot renew it, so a login sitting in front of a long
      # build is already dead by the time signtool asks for a token:
      # AADSTS700024, "Client assertion is not within its valid time range".
      - name: Azure login for signing
        if: startsWith(matrix.rid, 'win-') && env.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build installer
        shell: pwsh
        run: >
          ./build/installer.ps1
          -Runtime ${{ matrix.rid }}
          -Version ${{ steps.version.outputs.value }}

      # The MSI's own authoring, which no checksum or file listing reaches.
      # 0.3.0 shipped an installer that could not upgrade over a running
      # launcher and failed with 1603, and it was invisible here because the
      # package built and installed perfectly on a machine whose Restart
      # Manager was available. See build/verify-windows.ps1.
      - name: Check the installer can upgrade over a running launcher
        if: startsWith(matrix.rid, 'win-')
        shell: pwsh
        run: |
          Get-ChildItem artifacts/*.msi | ForEach-Object {
            ./build/verify-windows.ps1 -Path $_.FullName
          }

      # Installing it is the only way to know it installs, and until now that
      # was true of the .deb and not of the MSI — the one people double-click.
      # An upgrade that could not complete shipped twice and was found by a
      # user both times, which is what this is here to stop.
      #
      # The runner is disposable, so this costs nothing but the minute it takes.
      - name: Install, upgrade and uninstall it
        if: matrix.rid == 'win-x64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = Get-ChildItem artifacts/*win-x64.msi | Select-Object -First 1

          # Upgraded over the last release rather than installed fresh, because
          # a fresh install has never been the thing that broke.
          $previous = (gh release list --repo ${{ github.repository }} --limit 5 --json tagName `
            | ConvertFrom-Json |
              Where-Object { $_.tagName -ne '${{ github.ref_name }}' } |
              Select-Object -First 1).tagName -replace '^v', ''

          ./build/verify-windows-install.ps1 -Msi $msi.FullName -PreviousVersion $previous

      - name: Check the package holds what it should
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts

          for file in *.msi *.deb *.rpm; do
            [ -e "$file" ] || continue

            echo "Checking $file"
            sha256sum -c "${file}.sha256"
          done

          # A Debian package that unpacks to nothing on PATH installs cleanly
          # and leaves the user with no command, which is the failure mode
          # worth catching here rather than in somebody's terminal.
          for deb in *.deb; do
            [ -e "$deb" ] || continue

            dpkg-deb -c "$deb" | grep -q './usr/bin/loadout' || {
              echo "$deb puts nothing on PATH" >&2
              exit 1
            }

            dpkg-deb -c "$deb" | grep -qE '\.(pdb|xml)$' && {
              echo "$deb contains build artefacts that should not ship" >&2
              exit 1
            }

            true
          done

      # Installing it is the only way to know it installs. The runner is
      # disposable, so this costs nothing and catches the class of defect a
      # checksum never will.
      - name: Install and run it
        if: matrix.rid == 'linux-x64'
        run: |
          set -euo pipefail
          sudo dpkg -i artifacts/loadout_*_amd64.deb
          loadout --version
          loadout doctor --json > /dev/null
          sudo dpkg -r loadout

          # Checked on the filesystem, not with `command -v`: that consults the
          # shell's hash table, which still holds the path from the successful
          # run above and so reports a binary that has already been removed.
          [ ! -e /usr/bin/loadout ]

      # Nothing looked inside the .rpm until a released one turned out to be
      # missing 90% of itself. rpmbuild strips every ELF it recognises, which
      # rewrites a .NET single-file binary without the bundle appended after
      # its sections: 80 MB became 11 MB, and the package installed cleanly
      # and did nothing.
      #
      # Read from the package metadata rather than by extracting, so this needs
      # no tools the runner might not have.
      - name: Check the rpm carries its payload
        if: startsWith(matrix.rid, 'linux-')
        run: |
          set -euo pipefail
          rpm=$(find artifacts -maxdepth 1 -name '*.rpm' | head -1)
          [ -n "$rpm" ] || { echo "no rpm was produced" >&2; exit 1; }

          # The long listing puts a symlink target in the last field, so the
          # /usr/bin symlink line ends with the same path as the binary it
          # points at. Restricting to regular files by the mode column is what
          # separates them; matching the path alone read the symlink and
          # reported its 24-byte size.
          size=$(rpm -qlvp "$rpm" | awk '$1 ~ /^-/ && $NF == "/usr/lib/loadout/loadout" { print $5 }')
          echo "$(basename "$rpm") carries a $size byte binary"

          # A self-contained publish is tens of megabytes on every runtime.
          # Anything an order of magnitude under that is a stripped bundle.
          [ "${size:-0}" -gt 40000000 ]

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: loadout-installer-${{ matrix.rid }}
          path: |
            artifacts/*.msi
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [package, installer]
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          merge-multiple: true

      - name: Collect checksums
        run: |
          set -euo pipefail
          cd downloaded

          # Each sidecar is written without a trailing newline, deliberately, so
          # that a single-entry file carries no line ending for sha256sum to
          # trip over. Concatenating them therefore needs the newlines putting
          # back: "cat *.sha256 > SHA256SUMS" produced one unusable line, and
          # every release up to 0.4.0 shipped a manifest that sha256sum -c
          # rejects with "no properly formatted SHA256 checksum lines found".
          for sidecar in *.sha256; do
            cat "$sidecar"
            echo
          done > SHA256SUMS

          # Verified here, against the very files about to be published. The
          # manifest was broken for four releases precisely because nothing
          # ever read it back.
          sha256sum -c SHA256SUMS

          cat SHA256SUMS

      # What changed in this version, which until now was written into the
      # tag and read by nobody: the release body below is the same paragraph
      # for every version, so the notes never reached the page people
      # actually look at.
      - name: Read the notes out of the tag
        id: notes
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "This was built by hand rather than from a tag, so it has no notes." > notes.md
          else
            git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
            git tag -l --format='%(contents:body)' "${{ github.ref_name }}" > notes.md
          fi

          # An unannotated tag has no body, and an empty heading is worse
          # than none.
          if [ ! -s notes.md ]; then
            echo "No notes were written for this version." > notes.md
          fi

          # The standing paragraph every release carries, after what is
          # particular to this one.
          cat >> notes.md <<'STANDING'

          ---

          Self-contained builds of `loadout`. No .NET installation required.

          Archives work anywhere; the `.msi`, `.deb` and `.rpm` install
          `loadout` onto `PATH` for the current user or machine.

          Tested on Windows x64, Linux x64 and macOS Apple Silicon. The
          `win-arm64` and `linux-arm64` builds are cross-compiled and not
          executed in CI, and macOS packages are not signed or notarised.

          Verify a download against `SHA256SUMS`, then see the README for
          installation.
          STANDING


          cat notes.md

      # Pinned like every other action here. This is the one step with
      # contents: write, so a moved tag upstream would be a moved tag with
      # permission to publish.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            downloaded/*.zip
            downloaded/*.tar.gz
            downloaded/*.msi
            downloaded/*.deb
            downloaded/*.rpm
            downloaded/SHA256SUMS
          # What changed, then the standing paragraph. arm64 Windows and
          # Linux are cross-compiled and never executed in CI, because GitHub
          # offers no hosted runner for either, and that is said there rather
          # than implying a level of testing that did not happen.
          body_path: notes.md
