name: Release

# Spec section 92 requires every release to be built against all Tier-1
# platforms. Each archive is produced on the operating system it targets, so the
# Unix executable bit and the macOS binaries come out right without the
# packaging script having to compensate for a foreign host.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true
        default: 0.1.0

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    # Named so the OIDC subject stays constant. Without it the subject carries
    # the ref, which differs for every tag, and a federated credential can only
    # match a fixed subject — this account's subjects also carry immutable
    # owner and repository IDs, which the portal's GitHub Actions preset cannot
    # express, so one stable subject is the only workable shape.
    environment: release

    # Presence of ARTIFACT_SIGNING_ACCOUNT is the switch. Unset, the build
    # scripts skip signing and produce unsigned artefacts; set, they refuse to
    # run half-configured. The other two are read by build/sign-windows.ps1.
    env:
      ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}

    # Required for the OIDC token azure/login exchanges. Harmless when signing
    # is not configured, because no token is then requested.
    permissions:
      contents: read
      id-token: write

    strategy:
      # One platform failing must not hide the others: a macOS-only packaging
      # break is exactly what this matrix exists to catch.
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-latest }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: osx-x64,     os: macos-latest }
          - { rid: osx-arm64,   os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # pwsh is present on every GitHub runner, which is why the packaging
      # script is PowerShell: one command works on all three legs.
      # Placed immediately before the step that signs, and deliberately not
      # earlier. GitHub's OIDC assertion is valid for five minutes and
      # azure/login cannot renew it, so a login sitting in front of a long
      # build is already dead by the time signtool asks for a token:
      # AADSTS700024, "Client assertion is not within its valid time range".
      - name: Azure login for signing
        if: startsWith(matrix.rid, 'win-') && env.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Package
        shell: pwsh
        run: >
          ./build/package.ps1
          -Runtime ${{ matrix.rid }}
          -Version ${{ steps.version.outputs.value }}

      - name: Check the archive holds what it should
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts

          archive=$(ls loadout-*.{zip,tar.gz} 2>/dev/null | head -1)
          echo "Checking $archive"

          # A release that fails its own checksum is worse than no release.
          if command -v sha256sum >/dev/null; then
            sha256sum -c "${archive}.sha256"
          else
            shasum -a 256 -c "${archive}.sha256"
          fi

          case "$archive" in
            *.tar.gz)
              # The executable bit is the one property that silently ruins a
              # Unix release, so it is asserted rather than assumed.
              if ! tar -tvzf "$archive" | grep -E '^-rwx.*loadout$'; then
                echo "loadout is not executable inside $archive" >&2
                exit 1
              fi
              ;;
          esac

          # Debug symbols and generated API documentation must not ship.
          if tar -tzf "$archive" 2>/dev/null | grep -qE '\.(pdb|xml)$'; then
            echo "$archive contains build artefacts that should not ship" >&2
            exit 1
          fi

      # Only a native archive can be executed here; a cross-compiled one cannot.
      - name: Smoke test the binary
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64' || matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke && cd smoke

          archive=$(ls ../artifacts/loadout-*.{zip,tar.gz} 2>/dev/null | head -1)

          case "$archive" in
            *.zip) unzip -q "$archive" ;;
            *) tar -xzf "$archive" ;;
          esac

          ./loadout --version
          ./loadout doctor --json > doctor.json
          ./loadout project list --json > projects.json

          # doctor is allowed to report problems on a bare runner; what it may
          # not do is fail to produce a report at all.
          python3 -c "import json;d=json.load(open('doctor.json'));print('verdict',d['verdict'])"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: loadout-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
          if-no-files-found: error

  installer:
    name: Installer ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    # Named so the OIDC subject stays constant. Without it the subject carries
    # the ref, which differs for every tag, and a federated credential can only
    # match a fixed subject — this account's subjects also carry immutable
    # owner and repository IDs, which the portal's GitHub Actions preset cannot
    # express, so one stable subject is the only workable shape.
    environment: release

    # Presence of ARTIFACT_SIGNING_ACCOUNT is the switch. Unset, the build
    # scripts skip signing and produce unsigned artefacts; set, they refuse to
    # run half-configured. The other two are read by build/sign-windows.ps1.
    env:
      ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}

    # Required for the OIDC token azure/login exchanges. Harmless when signing
    # is not configured, because no token is then requested.
    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-latest }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # Pinned to 5, deliberately. WiX 6 and later require accepting the Open
      # Source Maintenance Fee agreement, which is a decision for whoever owns
      # this project rather than something a build script should accept on
      # their behalf. Version 5 is MIT and asks for nothing.
      - name: Install WiX
        if: startsWith(matrix.rid, 'win-')
        run: dotnet tool install --global wix --version 5.0.2

      - name: Install packaging tools
        if: startsWith(matrix.rid, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y rpm

      # Placed immediately before the step that signs, and deliberately not
      # earlier. GitHub's OIDC assertion is valid for five minutes and
      # azure/login cannot renew it, so a login sitting in front of a long
      # build is already dead by the time signtool asks for a token:
      # AADSTS700024, "Client assertion is not within its valid time range".
      - name: Azure login for signing
        if: startsWith(matrix.rid, 'win-') && env.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build installer
        shell: pwsh
        run: >
          ./build/installer.ps1
          -Runtime ${{ matrix.rid }}
          -Version ${{ steps.version.outputs.value }}

      - name: Check the package holds what it should
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts

          for file in *.msi *.deb *.rpm; do
            [ -e "$file" ] || continue

            echo "Checking $file"
            sha256sum -c "${file}.sha256"
          done

          # A Debian package that unpacks to nothing on PATH installs cleanly
          # and leaves the user with no command, which is the failure mode
          # worth catching here rather than in somebody's terminal.
          for deb in *.deb; do
            [ -e "$deb" ] || continue

            dpkg-deb -c "$deb" | grep -q './usr/bin/loadout' || {
              echo "$deb puts nothing on PATH" >&2
              exit 1
            }

            dpkg-deb -c "$deb" | grep -qE '\.(pdb|xml)$' && {
              echo "$deb contains build artefacts that should not ship" >&2
              exit 1
            }

            true
          done

      # Installing it is the only way to know it installs. The runner is
      # disposable, so this costs nothing and catches the class of defect a
      # checksum never will.
      - name: Install and run it
        if: matrix.rid == 'linux-x64'
        run: |
          set -euo pipefail
          sudo dpkg -i artifacts/loadout_*_amd64.deb
          loadout --version
          loadout doctor --json > /dev/null
          sudo dpkg -r loadout
          ! command -v loadout

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: loadout-installer-${{ matrix.rid }}
          path: |
            artifacts/*.msi
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [package, installer]
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd downloaded
          cat *.sha256 > SHA256SUMS
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            downloaded/*.zip
            downloaded/*.tar.gz
            downloaded/*.msi
            downloaded/*.deb
            downloaded/*.rpm
            downloaded/SHA256SUMS
          # arm64 Windows and Linux are cross-compiled and never executed in
          # CI, because GitHub offers no hosted runner for either. Saying so
          # beats implying a level of testing that did not happen.
          body: |
            Self-contained builds of `loadout`. No .NET installation required.

            Archives work anywhere; the `.msi`, `.deb` and `.rpm` install
            `loadout` onto `PATH` for the current user or machine.

            Tested on Windows x64, Linux x64 and macOS Apple Silicon. The
            `win-arm64` and `linux-arm64` builds are cross-compiled and not
            executed in CI, and macOS packages are not signed or notarised.

            Verify a download against `SHA256SUMS`, then see the README for
            installation.
