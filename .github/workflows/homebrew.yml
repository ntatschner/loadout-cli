# Publishes the Homebrew formula for a release.
#
# The tap is a separate repository, so this cannot use GITHUB_TOKEN: that token
# reaches this repository only. HOMEBREW_TAP_TOKEN is a fine-grained PAT scoped
# to TheCodeSaiyan/homebrew-loadout and nothing else.
#
# Deliberately not a job inside release.yml. It runs after the release exists
# and reads the published SHA256SUMS, so it can be re-run on its own when the
# token expires or the tap needs rebuilding, without repeating the build.
name: Homebrew

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, for example v0.16.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  formula:
    name: Update the tap
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A prerelease is published like any other release and would otherwise
    # become what `brew install loadout` hands people.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false

    steps:
      - name: Work out the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          version="${TAG#v}"

          if [ -z "$version" ]; then
            echo "No tag to publish." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Take the checksums from the release
        id: sums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          # The release publishes one SHA256SUMS covering every artefact, so
          # the formula is built from what shipped rather than from archives
          # downloaded and hashed again here.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --output SHA256SUMS

          for rid in osx-arm64 osx-x64 linux-arm64 linux-x64; do
            name="loadout-${{ steps.release.outputs.version }}-${rid}.tar.gz"
            sum=$(awk -v n="$name" '$2 == n { print $1 }' SHA256SUMS)

            if [ -z "$sum" ]; then
              echo "SHA256SUMS has no entry for $name." >&2
              exit 1
            fi

            echo "${rid//-/_}=$sum" >> "$GITHUB_OUTPUT"
          done

      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: TheCodeSaiyan/homebrew-loadout
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write the formula
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          OSX_ARM64: ${{ steps.sums.outputs.osx_arm64 }}
          OSX_X64: ${{ steps.sums.outputs.osx_x64 }}
          LINUX_ARM64: ${{ steps.sums.outputs.linux_arm64 }}
          LINUX_X64: ${{ steps.sums.outputs.linux_x64 }}
        run: |
          set -euo pipefail

          # Checked before substitution, not after. Replacing a placeholder
          # with an empty value leaves no placeholder behind, so looking for
          # one afterwards proves nothing: the formula would carry sha256 ""
          # and fail its checksum in front of whoever ran brew install.
          for name in VERSION OSX_ARM64 OSX_X64 LINUX_ARM64 LINUX_X64; do
            value="${!name}"

            if [ -z "$value" ]; then
              echo "$name is empty." >&2
              exit 1
            fi

            case "$name" in
              VERSION) ;;
              *)
                if ! printf '%s' "$value" | grep -Eq '^[0-9a-f]{64}$'; then
                  echo "$name is not a sha256: $value" >&2
                  exit 1
                fi
                ;;
            esac
          done

          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"

          mkdir -p tap/Formula

          # Quoted heredoc, then the values substituted with envsubst-style
          # awk: an unquoted heredoc would treat the Ruby #{bin} interpolation
          # in the test block as a shell comment and eat the rest of the line.
          cat > tap/Formula/loadout.rb <<'RUBY'
          # Generated by the loadout-cli release workflow. Edits here are overwritten on
          # the next release: change .github/workflows/homebrew.yml in that repository.
          class Loadout < Formula
            desc "Agent launcher that composes project context from a central workspace"
            homepage "https://github.com/ntatschner/loadout-cli"
            version "@VERSION@"
            license "MIT"

            on_macos do
              on_arm do
                url "@BASE@/loadout-@VERSION@-osx-arm64.tar.gz"
                sha256 "@OSX_ARM64@"
              end

              on_intel do
                url "@BASE@/loadout-@VERSION@-osx-x64.tar.gz"
                sha256 "@OSX_X64@"
              end
            end

            on_linux do
              on_arm do
                url "@BASE@/loadout-@VERSION@-linux-arm64.tar.gz"
                sha256 "@LINUX_ARM64@"
              end

              on_intel do
                url "@BASE@/loadout-@VERSION@-linux-x64.tar.gz"
                sha256 "@LINUX_X64@"
              end
            end

            def install
              # Not `bin.install "loadout"`. The archive carries a native library beside
              # the binary — libonigwrap.dylib on macOS, libonigwrap.so on Linux — and
              # installing the executable on its own leaves it behind, so the whole
              # payload goes to libexec and bin gets a script that execs it there.
              libexec.install Dir["*"]

              bin.write_exec_script libexec/"loadout"
            end

            test do
              # The version is the one thing that can be asserted without a workspace,
              # a registered project or a network: everything else this does needs
              # `loadout setup` to have run.
              assert_match version.to_s, shell_output("#{bin}/loadout --version")
            end
          end
          RUBY

          # The heredoc is indented to read properly inside the step; the file
          # must not be.
          sed -i 's/^          //' tap/Formula/loadout.rb

          sed -i \
            -e "s|@BASE@|$base|g" \
            -e "s|@VERSION@|$VERSION|g" \
            -e "s|@OSX_ARM64@|$OSX_ARM64|g" \
            -e "s|@OSX_X64@|$OSX_X64|g" \
            -e "s|@LINUX_ARM64@|$LINUX_ARM64|g" \
            -e "s|@LINUX_X64@|$LINUX_X64|g" \
            tap/Formula/loadout.rb

          # Belt and braces: a placeholder surviving means a name in the
          # heredoc and a name in the sed list drifted apart.
          if grep -n '@[A-Z_]\{2,\}@' tap/Formula/loadout.rb; then
            echo "The formula still has placeholders in it." >&2
            exit 1
          fi

          cat tap/Formula/loadout.rb

      - name: Push it
        working-directory: tap
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "The formula already describes $VERSION; nothing to push."
            exit 0
          fi

          git config user.name "loadout release"
          git config user.email "noreply@github.com"

          git add Formula/loadout.rb
          git commit -m "Update the loadout formula to $VERSION"
          git push
