name: CI

# Spec section 92: every release must be built and tested against all Tier-1
# operating systems. The three test legs below are the minimum the spec names
# (Windows, Ubuntu, macOS); the publish leg proves the remaining architectures
# compile.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  licences:
    name: Dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Checked on every change rather than at release time. The failure this
      # catches is a dependency bump quietly swapping a permissive licence for
      # one the project cannot ship under, and the moment to catch that is the
      # pull request that does it.
      - name: Check every dependency is permissively licensed
        shell: pwsh
        run: ./build/licences.ps1 -Detailed

  test:
    name: Test on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Bounded so a hang fails visibly instead of burning the job's whole
    # allowance. The win-x64 installer job hung for forty-eight minutes on
    # the 0.8.0 release and was killed with no log left to read, which is a
    # much worse outcome than a fast failure naming the step.
    timeout-minutes: 30
    strategy:
      # Never cancel siblings on the first failure. A macOS-only break is
      # exactly the kind of thing that must not hide the Linux result.
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Ubuntu x64
            os: ubuntu-latest
          - name: macOS Apple Silicon
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The Secret Service is not present on a bare CI runner, so the Linux
      # secret provider reports itself unavailable there. That is the correct
      # behaviour under spec section 86 and the tests assert it rather than
      # requiring a keyring to be installed.
      - name: Show platform diagnostics
        run: dotnet run --project src/Loadout.Cli -- doctor --json
        continue-on-error: true

      # Locked mode fails if the resolved packages differ from
      # packages.lock.json, which is what makes the lock file worth having: a
      # dependency cannot change underneath a build without a commit to say so.
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # The contract tests run the built command line as a real process, and
      # skip themselves with a reason when it is absent. That is right for a
      # developer who has only built the tests, and wrong here: a skipped test
      # is indistinguishable from a passing one in a green run, so CI asserts
      # the executable exists before trusting the result.
      - name: Check the command line was built
        shell: bash
        run: |
          set -euo pipefail
          found=$(find src/Loadout.Cli/bin/Release -type f \( -name loadout -o -name loadout.exe \) | head -1)
          if [ -z "$found" ]; then
            echo "The command line executable was not produced, so the contract tests would skip." >&2
            exit 1
          fi
          echo "Found $found"

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/results.trx'

  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: >
          dotnet publish src/Loadout.Cli/Loadout.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output artifacts/${{ matrix.rid }}

      # The arm64 binaries are cross-compiled and never executed here: GitHub
      # offers no hosted arm64 Windows or Linux runner. Release notes must say
      # so rather than implying tested parity on those architectures.
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: loadout-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
