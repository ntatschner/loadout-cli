name: CI

# Spec section 92: every release must be built and tested against all Tier-1
# operating systems. The three test legs below are the minimum the spec names
# (Windows, Ubuntu, macOS); the publish leg proves the remaining architectures
# compile. A change to documentation alone is tested on one of them (see the
# "changes" job), which cannot reach a release: every release commit changes
# Directory.Build.props, so it always gets all of them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # What the change touches, which decides how much of the rest runs. A change
  # to documentation alone still runs the whole suite - the README and docs are
  # asserted on by the Contracts and Architecture tests, and docs audit runs
  # there too - but on one platform rather than five, and builds no binaries.
  # A docs pull request used to spend twenty minutes and eleven jobs proving
  # that Markdown compiles on macOS.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.decide.outputs.docs-only }}
      matrix: ${{ steps.decide.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        shell: bash
        env:
          # The pull request's base, or what main was before this push. A
          # manual run has neither, and gets everything.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          docs_only=$(bash build/docs-only.sh "${BASE:-}")

          # arm64 was cross-compiled and never executed for as long as GitHub
          # offered nowhere to execute it. It has since: these labels went
          # generally available for public repositories in August 2025 and
          # reached private ones in January 2026. Running the suite there is
          # what turns two of the six runtime identifiers from shipped-untested
          # into shipped-tested, and it costs two matrix entries.
          if [ "$docs_only" = true ]; then
            matrix='{"include":[{"name":"Ubuntu x64","os":"ubuntu-latest"}]}'
          else
            matrix='{"include":[
              {"name":"Windows x64","os":"windows-latest"},
              {"name":"Ubuntu x64","os":"ubuntu-latest"},
              {"name":"macOS Apple Silicon","os":"macos-latest"},
              {"name":"Windows arm64","os":"windows-11-arm"},
              {"name":"Ubuntu arm64","os":"ubuntu-24.04-arm"}]}'
          fi

          echo "Documentation only: $docs_only"
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "matrix=$(echo "$matrix" | jq -c .)" >> "$GITHUB_OUTPUT"

  licences:
    name: Dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes

    # Nothing a documentation change does can alter a dependency.
    if: needs.changes.outputs.docs-only != 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Checked on every change rather than at release time. The failure this
      # catches is a dependency bump quietly swapping a permissive licence for
      # one the project cannot ship under, and the moment to catch that is the
      # pull request that does it.
      - name: Check every dependency is permissively licensed
        shell: pwsh
        run: ./build/licences.ps1 -Detailed

  # Studio's page, checked and its components tested. The only job that needs
  # Node: the page is built by hand and committed, so building and testing
  # Loadout never does, and StudioBuildTests in the suite fails if the
  # committed build is older than its sources.
  studio:
    name: Studio's page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'

    defaults:
      run:
        working-directory: studio

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      # ci, not install: it refuses a lock file that disagrees with
      # package.json, which is the npm equivalent of --locked-mode.
      - name: Install exactly what the lock file names
        run: npm ci

      - name: Check the types
        run: npm run check

      - name: Test the components
        run: npm test

  test:
    name: Test on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Bounded so a hang fails visibly instead of burning the job's whole
    # allowance. The win-x64 installer job hung for forty-eight minutes on
    # the 0.8.0 release and was killed with no log left to read, which is a
    # much worse outcome than a fast failure naming the step.
    timeout-minutes: 30
    needs: changes
    strategy:
      # Never cancel siblings on the first failure. A macOS-only break is
      # exactly the kind of thing that must not hide the Linux result.
      fail-fast: false

      # Every platform, or Ubuntu x64 alone for documentation: see "changes".
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The Secret Service is not present on a bare CI runner, so the Linux
      # secret provider reports itself unavailable there. That is the correct
      # behaviour under spec section 86 and the tests assert it rather than
      # requiring a keyring to be installed.
      - name: Show platform diagnostics
        run: dotnet run --project src/Loadout.Cli -- doctor --json
        continue-on-error: true

      # Locked mode fails if the resolved packages differ from
      # packages.lock.json, which is what makes the lock file worth having: a
      # dependency cannot change underneath a build without a commit to say so.
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # The contract tests run the built command line as a real process, and
      # skip themselves with a reason when it is absent. That is right for a
      # developer who has only built the tests, and wrong here: a skipped test
      # is indistinguishable from a passing one in a green run, so CI asserts
      # the executable exists before trusting the result.
      - name: Check the command line was built
        shell: bash
        run: |
          set -euo pipefail
          found=$(find src/Loadout.Cli/bin/Release -type f \( -name loadout -o -name loadout.exe \) | head -1)
          if [ -z "$found" ]; then
            echo "The command line executable was not produced, so the contract tests would skip." >&2
            exit 1
          fi
          echo "Found $found"

      - name: Test
        # The hang detector names the tests in flight when the suite stops
        # making progress, in a Sequence file beside the results. Without it a
        # hung suite sits silent until the job timeout kills it, and the kill
        # discards everything: three Unix legs did exactly that on 14
        # September 2026 and left no way to tell which test had stopped. The
        # timeout is per test, renewed as each one finishes, and ten minutes
        # is longer than a whole healthy run, so it cannot fire on a slow
        # test; when it does fire, two-thirds of the job's allowance is still
        # left to write the file. The first catch named the test and showed
        # every other test finished, which the name alone cannot explain, so a
        # mini dump comes with it: the thread stacks are the only thing that
        # says where inside that test the wait is.
        run: dotnet test --configuration Release --no-build --logger "trx;LogFileName=results.trx" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini

      # Only after a failure, and only on Windows, where the recurring one is
      # every spawned process exiting 0xC0000142 from some point in the run to
      # its end. That code is a process that could not connect to its console
      # or desktop while starting, which is a condition of the session, and
      # the suite's log carries nothing that says which condition. This reads
      # the window station and desktop heap, counts the console hosts still
      # alive, looks for the event Windows logs when the desktop heap runs
      # out and for console-host crashes, and tries a spawn of its own to say
      # whether the condition outlived the test host. Nothing here changes
      # the machine; it exists so the next occurrence is evidence rather than
      # another re-run.
      - name: Describe the session after a Windows failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: ./build/spawn-diagnostics.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/results.trx
            **/Sequence_*.xml
            **/*.dmp
            **/spawn-refusal-probe.txt
            **/spawn-probe-healthy.txt

  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: [changes, test]

    # The last two for the provenance attestation, which is made only on main.
    permissions:
      contents: read
      id-token: write
      attestations: write

    # Documentation builds no binaries.
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Still cross-compiled from x64, deliberately. A self-contained
          # publish is a deterministic cross-compile and this path works; the
          # gap worth closing was that nothing ever ran the result, and the test
          # matrix above is where that is closed. Moving the release build onto
          # a newer runner would put a working path at risk for nothing.
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The build a release ships. Release compiles nothing: it promotes this
      # artefact, signs it and packages it, so publish.ps1 is the only place
      # the shipping flags are written down. It also writes the SHA256SUMS
      # that every later step checks the bytes against.
      - name: Publish
        shell: pwsh
        run: ./build/publish.ps1 -Runtime ${{ matrix.rid }} -OutputDirectory artifacts/${{ matrix.rid }}

      # Proof, checkable by anyone with gh attestation verify, that these bytes
      # came from this commit and this run. Only for main: a pull request's
      # build is never promoted, and a fork's cannot be granted the token.
      - name: Attest where the build came from
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/${{ matrix.rid }}/*

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: loadout-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          if-no-files-found: error

  # The published build of every runtime, run on a machine that can run it.
  # The test job above runs a framework-dependent build; what ships is a
  # self-contained single file, and a problem in bundling, a native library
  # left out, or a runtime that only the published form uses would pass there
  # and fail here. Each artefact is checked against the hashes taken when it
  # was built, so what passes is provably what was published.
  artefact:
    name: Test the ${{ matrix.rid }} build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [changes, publish]
    if: needs.changes.outputs.docs-only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: win-arm64,   os: windows-11-arm }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          # No hosted runner is an Intel Mac any longer, so the x64 build runs
          # under Rosetta on Apple Silicon. That catches a binary that will not
          # start or run; it does not catch every x64-only fault.
          #
          # And only the JSON contracts, not all of them. Every contract test
          # starts the binary, and under Rosetta a start costs about eight
          # times what it does natively: the whole set took 4m13s on
          # osx-arm64 and was cancelled at the 30 minute limit here, with no
          # test failed or stalled. The same code runs the whole set natively
          # on osx-arm64; what this leg adds is that the x64 build starts and
          # answers correctly, which a dozen commands show as well as five
          # hundred.
          - rid: osx-x64
            os: macos-latest
            tests: FullyQualifiedName~Loadout.Tests.Contract.JsonContractTests|FullyQualifiedName~Loadout.Tests.Contract.ExecutableOverrideTests
          - { rid: osx-arm64,   os: macos-latest }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: loadout-${{ matrix.rid }}
          path: artefact

      # An artefact is a zip, which carries no Unix mode, so the executable
      # bit has to be put back before anything can run it.
      - name: Check it is what was published
        shell: bash
        working-directory: artefact
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
          [ -f loadout.exe ] || chmod +x loadout

      - name: Make sure Rosetta is there
        if: matrix.rid == 'osx-x64'
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          file artefact/loadout | grep -q x86_64

      # PowerShell rather than bash because it is the one shell that gives the
      # same path, line endings and JSON parsing on every runner here.
      - name: Smoke test
        shell: pwsh
        run: |
          $loadout = (Get-ChildItem artefact -File | Where-Object Name -in 'loadout', 'loadout.exe').FullName
          "LOADOUT_CONTRACT_EXECUTABLE=$loadout" >> $env:GITHUB_ENV

          $expected = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $actual = (& $loadout --version | Out-String).Trim()
          Write-Host "Directory.Build.props says $expected; the binary says $actual"
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { exit 1 }

          # doctor may report problems on a bare runner; it may not fail to
          # produce a report at all.
          $doctor = & $loadout doctor --json | Out-String | ConvertFrom-Json
          Write-Host "doctor's verdict: $($doctor.verdict)"
          if (-not $doctor.verdict) { exit 1 }

          & $loadout project list --json | Out-String | ConvertFrom-Json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Restore
        run: dotnet restore tests/Loadout.Tests --locked-mode

      - name: Build the tests
        run: dotnet build tests/Loadout.Tests --configuration Release --no-restore

      # Only the contract tests: they are the ones that start the command line
      # as a process, so they are the ones that can be pointed at this binary.
      # LOADOUT_CONTRACT_EXECUTABLE was set by the smoke test, and
      # ExecutableOverrideTests fails the run if it was not honoured.
      - name: Run the contract tests against it
        run: >
          dotnet test tests/Loadout.Tests --configuration Release --no-build
          --filter "${{ matrix.tests || 'FullyQualifiedName~Loadout.Tests.Contract' }}"
          --logger "trx;LogFileName=results.trx"
          --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type mini

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artefact-results-${{ matrix.rid }}
          path: |
            **/results.trx
            **/Sequence_*.xml
            **/*.dmp
