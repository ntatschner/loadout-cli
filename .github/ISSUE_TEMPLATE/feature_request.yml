name: Feature request
description: Something Loadout should be able to do and cannot
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: |
        The situation rather than the feature. A described problem often has a
        better answer than the solution that came to mind first.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do about it today
      description: The workaround, if there is one, and where it falls down.
    validations:
      required: false

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: Command names, output, behaviour. Rough is fine.
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Does it hold up against the rules the project already works to?
      description: |
        Not a trick question, and a "no" is not a rejection. It saves a round
        trip if the answer is already known.
      options:
        - label: It can work on Windows, Linux and macOS, or it is honest about where it cannot
        - label: It does not require agent configuration to live in the application repository
        - label: It does not need a secret value to be displayed
