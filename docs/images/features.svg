<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="What Loadout gives you, in six parts" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<defs><style>.t{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}</style></defs>
<rect width="900" height="560" rx="14" fill="#11141a"/>
<text class="t" x="28" y="56" font-size="27" font-weight="700" fill="#f2f4f8">Loadout</text>
<text class="t" x="28" y="84" font-size="15" fill="#9aa4b4">One place for everything your AI agents need, so none of it ends up in your repo.</text>
<rect x="28" y="98" width="46" height="3" rx="1.5" fill="#e0a458"/>
<rect x="28" y="118" width="414" height="128" rx="10" fill="#181c24" stroke="#252b36"/>
<rect x="28" y="118" width="3" height="128" rx="1.5" fill="#e0a458"/>
<text class="t" x="50" y="150" font-size="11" font-weight="700" letter-spacing="1.4" fill="#e0a458">01</text>
<text class="t" x="50" y="176" font-size="17" font-weight="600" fill="#f2f4f8">Your repo stays yours</text>
<text class="t" x="50" y="200" font-size="13" fill="#9aa4b4">Instructions, rules, memory and session</text>
<text class="t" x="50" y="218" font-size="13" fill="#9aa4b4">state live in one workspace — never</text>
<text class="t" x="50" y="236" font-size="13" fill="#9aa4b4">in somebody else's diff.</text>
<rect x="458" y="118" width="414" height="128" rx="10" fill="#181c24" stroke="#252b36"/>
<rect x="458" y="118" width="3" height="128" rx="1.5" fill="#6fb3c4"/>
<text class="t" x="480" y="150" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6fb3c4">02</text>
<text class="t" x="480" y="176" font-size="17" font-weight="600" fill="#f2f4f8">The right instructions</text>
<text class="t" x="480" y="200" font-size="13" fill="#9aa4b4">72 specialists built in. Picked from</text>
<text class="t" x="480" y="218" font-size="13" fill="#9aa4b4">your repository and your task, and it</text>
<text class="t" x="480" y="236" font-size="13" fill="#9aa4b4">tells you why before it launches.</text>
<rect x="28" y="262" width="414" height="128" rx="10" fill="#181c24" stroke="#252b36"/>
<rect x="28" y="262" width="3" height="128" rx="1.5" fill="#e0a458"/>
<text class="t" x="50" y="294" font-size="11" font-weight="700" letter-spacing="1.4" fill="#e0a458">03</text>
<text class="t" x="50" y="320" font-size="17" font-weight="600" fill="#f2f4f8">It remembers</text>
<text class="t" x="50" y="344" font-size="13" fill="#9aa4b4">Durable facts per project, loaded as</text>
<text class="t" x="50" y="362" font-size="13" fill="#9aa4b4">an index rather than in full, and</text>
<text class="t" x="50" y="380" font-size="13" fill="#9aa4b4">screened so a token never lands.</text>
<rect x="458" y="262" width="414" height="128" rx="10" fill="#181c24" stroke="#252b36"/>
<rect x="458" y="262" width="3" height="128" rx="1.5" fill="#6fb3c4"/>
<text class="t" x="480" y="294" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6fb3c4">04</text>
<text class="t" x="480" y="320" font-size="17" font-weight="600" fill="#f2f4f8">A launcher, not a flag soup</text>
<text class="t" x="480" y="344" font-size="13" fill="#9aa4b4">Full-screen UI with a palette over</text>
<text class="t" x="480" y="362" font-size="13" fill="#9aa4b4">every command, found by what it is</text>
<text class="t" x="480" y="380" font-size="13" fill="#9aa4b4">for: 'undo' reaches backup restore.</text>
<rect x="28" y="406" width="414" height="128" rx="10" fill="#181c24" stroke="#252b36"/>
<rect x="28" y="406" width="3" height="128" rx="1.5" fill="#e0a458"/>
<text class="t" x="50" y="438" font-size="11" font-weight="700" letter-spacing="1.4" fill="#e0a458">05</text>
<text class="t" x="50" y="464" font-size="17" font-weight="600" fill="#f2f4f8">The agent can ask back</text>
<text class="t" x="50" y="488" font-size="13" fill="#9aa4b4">It reads its own instructions and</text>
<text class="t" x="50" y="506" font-size="13" fill="#9aa4b4">records what it learns. Nothing that</text>
<text class="t" x="50" y="524" font-size="13" fill="#9aa4b4">changes your machine is offered.</text>
<rect x="458" y="406" width="414" height="128" rx="10" fill="#181c24" stroke="#252b36"/>
<rect x="458" y="406" width="3" height="128" rx="1.5" fill="#6fb3c4"/>
<text class="t" x="480" y="438" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6fb3c4">06</text>
<text class="t" x="480" y="464" font-size="17" font-weight="600" fill="#f2f4f8">You see the bill</text>
<text class="t" x="480" y="488" font-size="13" fill="#9aa4b4">Token accounting from transcripts you</text>
<text class="t" x="480" y="506" font-size="13" fill="#9aa4b4">already have, with cache reads priced</text>
<text class="t" x="480" y="524" font-size="13" fill="#9aa4b4">as cache reads.</text>
<rect x="28" y="504" width="844" height="1" fill="#252b36"/>
<text class="t" x="28" y="526" font-size="13" fill="#9aa4b4">Windows · Linux · macOS, natively   Claude Code and Codex   every command takes --json   preview, snapshot, undo</text>
</svg>
